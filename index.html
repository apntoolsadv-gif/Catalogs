<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

<title>Digital Catalogs</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#101010;
    color:#fff;
    font-family:Arial,sans-serif
}

body{overflow-x:hidden}

/* HOME */

#catalogMenu{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px 20px
}

.menuBox{
    width:min(430px,94vw);
    text-align:center
}

#catalogMenu h1{
    margin:0 0 8px;
    font-size:30px
}

#catalogMenu p{
    margin:0 0 35px;
    color:#999;
    font-size:14px
}

.catalogButton{
    width:100%;
    min-height:82px;
    display:block;
    border:0;
    border-radius:14px;
    margin-bottom:18px;
    font-size:21px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s
}

.catalogButton:hover{transform:translateY(-2px)}
.catalogButton:active{transform:scale(.98)}

.rockman{
    background:#ffc400;
    color:#111
}

.apn{
    background:#c9141c;
    color:#fff
}

/* READER */

#reader{
    display:none;
    height:100vh;
    flex-direction:column;
    position:relative
}

#bookArea{
    width:100%;
    flex:1;
    min-height:0;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:auto;
    padding:18px 60px 90px;
    background:#101010
}

#zoomStage{
    margin:auto;
    transform-origin:center center;
    transition:transform .2s ease
}

#book{margin:auto}

.page{
    background:#fff;
    overflow:hidden
}

.page canvas{
    width:100%;
    height:100%;
    display:block
}

/* LOADER */

.pageLoading{
    width:100%;
    height:100%;
    background:linear-gradient(
        110deg,
        #e7e7e7 8%,
        #f5f5f5 18%,
        #e7e7e7 33%
    );
    background-size:200% 100%;
    animation:shimmer 1.4s linear infinite
}

@keyframes shimmer{
    to{background-position-x:-200%}
}

#initialLoader{
    position:absolute;
    inset:0;
    z-index:80;
    background:#101010;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:14px
}

.spinner{
    width:36px;
    height:36px;
    border:3px solid #444;
    border-top-color:#fff;
    border-radius:50%;
    animation:rotate .8s linear infinite
}

@keyframes rotate{
    to{transform:rotate(360deg)}
}

.loaderText{
    color:#aaa;
    font-size:14px
}

/* SIDE ARROWS */

.sideArrow{
    position:fixed;
    top:50%;
    transform:translateY(-50%);
    z-index:50;
    width:48px;
    height:70px;
    border:0;
    border-radius:10px;
    background:rgba(20,20,20,.60);
    color:#fff;
    font-size:34px;
    cursor:pointer
}

#prevSide{left:10px}
#nextSide{right:10px}

.sideArrow:hover{
    background:rgba(40,40,40,.9)
}

/* BOTTOM BAR */

#bottomBar{
    position:fixed;
    left:50%;
    bottom:12px;
    transform:translateX(-50%);
    z-index:100;
    display:flex;
    align-items:center;
    gap:2px;
    padding:0;
    background:#f5f5f5;
    color:#333;
    border-radius:7px;
    box-shadow:0 6px 20px rgba(0,0,0,.35);
    overflow:visible
}

.toolButton,
#pageInfo{
    height:48px;
    min-width:48px;
    border:0;
    border-right:1px solid #ddd;
    background:#f5f5f5;
    color:#555;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:20px
}

.toolButton:hover{
    background:#e8e8e8
}

#pageInfo{
    min-width:72px;
    padding:0 10px;
    font-size:12px;
    cursor:default
}

#moreButton{
    border-right:0;
    color:#00a0d2;
    font-size:23px
}

/* MORE MENU */

#moreMenu{
    display:none;
    position:absolute;
    right:0;
    bottom:55px;
    width:205px;
    background:#fff;
    color:#555;
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 6px 22px rgba(0,0,0,.35)
}

.moreItem{
    width:100%;
    height:44px;
    border:0;
    border-bottom:1px solid #e6e6e6;
    background:#fff;
    color:#555;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 13px;
    cursor:pointer;
    font-size:13px
}

.moreItem:hover{
    background:#f3f3f3
}

.moreItem:last-child{
    border-bottom:0
}

/* THUMBNAILS */

#thumbPanel{
    display:none;
    position:fixed;
    left:50%;
    bottom:70px;
    transform:translateX(-50%);
    width:min(900px,94vw);
    max-height:55vh;
    z-index:90;
    background:#1d1d1d;
    border:1px solid #444;
    border-radius:10px;
    padding:14px;
    overflow-y:auto;
    box-shadow:0 10px 30px rgba(0,0,0,.45)
}

#thumbGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
    gap:12px
}

.thumbItem{
    background:#2a2a2a;
    padding:5px;
    border-radius:6px;
    cursor:pointer;
    transition:.15s
}

.thumbItem:hover{
    transform:scale(1.03);
    background:#3a3a3a
}

.thumbItem canvas{
    width:100%;
    display:block;
    background:#fff
}

.thumbNumber{
    text-align:center;
    font-size:11px;
    padding-top:5px;
    color:#ccc
}

/* TOAST */

#toast{
    display:none;
    position:fixed;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:200;
    background:#252525;
    padding:10px 16px;
    border-radius:7px;
    font-size:13px
}

/* MOBILE */

@media(max-width:700px){

    #catalogMenu h1{font-size:25px}

    .catalogButton{
        min-height:70px;
        font-size:18px
    }

    #bookArea{
        padding:8px 4px 78px
    }

    .sideArrow{
        width:36px;
        height:56px;
        font-size:28px;
        background:rgba(20,20,20,.45)
    }

    #prevSide{left:1px}
    #nextSide{right:1px}

    #bottomBar{
        bottom:7px;
        max-width:96vw
    }

    .toolButton,
    #pageInfo{
        height:44px;
        min-width:42px
    }

    #pageInfo{
        min-width:58px;
        font-size:10px;
        padding:0 5px
    }

    #thumbPanel{
        bottom:60px;
        max-height:65vh
    }

    #thumbGrid{
        grid-template-columns:repeat(3,1fr)
    }
}
</style>
</head>

<body>

<!-- HOME -->

<div id="catalogMenu">
    <div class="menuBox">

        <h1>Digital Catalog</h1>
        <p>Select a catalog</p>

        <button class="catalogButton rockman"
                onclick="openCatalog('Rockman.catalog.pdf')">
            ROCKMAN CATALOG
        </button>

        <button class="catalogButton apn"
                onclick="openCatalog('Apn.catalog.pdf')">
            APN CATALOG
        </button>

    </div>
</div>

<!-- READER -->

<div id="reader">

    <button id="prevSide"
            class="sideArrow"
            onclick="prevPage()">‹</button>

    <button id="nextSide"
            class="sideArrow"
            onclick="nextPage()">›</button>

    <div id="bookArea">

        <div id="initialLoader">
            <div class="spinner"></div>
            <div class="loaderText">Opening catalog...</div>
        </div>

        <div id="zoomStage">
            <div id="book"></div>
        </div>

    </div>

</div>

<!-- THUMBNAILS -->

<div id="thumbPanel">
    <div id="thumbGrid"></div>
</div>

<!-- BOTTOM TOOLBAR -->

<div id="bottomBar" style="display:none">

    <div id="pageInfo">1 / 1</div>

    <button class="toolButton"
            title="All Pages"
            onclick="toggleThumbnails()">▦</button>

    <button class="toolButton"
            title="Zoom In"
            onclick="zoomIn()">⊕</button>

    <button class="toolButton"
            title="Zoom Out"
            onclick="zoomOut()">⊖</button>

    <button class="toolButton"
            title="Fullscreen"
            onclick="toggleFullscreen()">⛶</button>

    <button class="toolButton"
            title="Share"
            onclick="shareCatalog()">⌯</button>

    <button id="moreButton"
            class="toolButton"
            onclick="toggleMoreMenu()">•••</button>

    <div id="moreMenu">

        <button class="moreItem"
                onclick="downloadPDF()">
            <span>Download PDF</span>
            <span>⇩</span>
        </button>

        <button class="moreItem"
                onclick="togglePageMode()">
            <span id="pageModeText">Single Page Mode</span>
            <span>▣</span>
        </button>

        <button class="moreItem"
                onclick="goFirstPage()">
            <span>Go to First Page</span>
            <span>⇤</span>
        </button>

        <button class="moreItem"
                onclick="goLastPage()">
            <span>Go to Last Page</span>
            <span>⇥</span>
        </button>

        <button class="moreItem"
                onclick="toggleSound()">
            <span id="soundText">Turn off Sound</span>
            <span>🔊</span>
        </button>

        <button class="moreItem"
                onclick="goHome()">
            <span>Catalogs</span>
            <span>⌂</span>
        </button>

    </div>

</div>

<div id="toast"></div>

<audio
    id="pageFlipAudio"
    src="./pageflip.mp3?v=8"
    preload="auto">
</audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let pdfDocument = null;
let pageFlip = null;
let currentCatalog = null;

let pageElements = [];
let renderedPages = new Set();
let renderingPages = new Set();

let backgroundRenderStopped = false;

let soundUnlocked = false;
let soundEnabled = true;

let zoomValue = 1;

let manualMode = "auto";

let thumbnailsBuilt = false;


/* =========================
SOUND
========================= */

async function unlockSound(){

    if(soundUnlocked) return;

    const audio =
        document.getElementById("pageFlipAudio");

    try{

        audio.muted = true;
        audio.volume = .8;

        await audio.play();

        audio.pause();
        audio.currentTime = 0;

        audio.muted = false;

        soundUnlocked = true;

    }catch(e){

        audio.muted = false;

    }
}


function playFlipSound(){

    if(!soundEnabled) return;

    const original =
        document.getElementById("pageFlipAudio");

    if(!original) return;

    const audio =
        original.cloneNode(true);

    audio.volume = .8;
    audio.currentTime = 0;

    audio.play().catch(()=>{});
}


/* =========================
OPEN
========================= */

async function openCatalog(pdfFile){

    currentCatalog = pdfFile;

    await unlockSound();

    resetZoom();

    manualMode = "auto";

    thumbnailsBuilt = false;

    document.getElementById("thumbGrid").innerHTML = "";

    document.getElementById("catalogMenu").style.display = "none";
    document.getElementById("reader").style.display = "flex";
    document.getElementById("bottomBar").style.display = "flex";
    document.getElementById("initialLoader").style.display = "flex";

    document.getElementById("book").innerHTML = "";

    renderedPages.clear();
    renderingPages.clear();

    pageElements = [];

    backgroundRenderStopped = false;

    try{

        pdfDocument =
            await pdfjsLib.getDocument({
                url:pdfFile,
                disableRange:false,
                disableStream:false,
                disableAutoFetch:false
            }).promise;


        const firstPage =
            await pdfDocument.getPage(1);

        const viewport =
            firstPage.getViewport({scale:1});

        const ratio =
            viewport.height / viewport.width;

        const pageWidth = 550;

        const pageHeight =
            Math.round(pageWidth * ratio);

        const book =
            document.getElementById("book");


        for(let i=0;i<pdfDocument.numPages;i++){

            const page =
                document.createElement("div");

            page.className = "page";

            const loading =
                document.createElement("div");

            loading.className = "pageLoading";

            page.appendChild(loading);

            book.appendChild(page);

            pageElements.push(page);
        }


        const firstLoads = [];

        if(pdfDocument.numPages>=1)
            firstLoads.push(renderPage(1));

        if(pdfDocument.numPages>=2)
            firstLoads.push(renderPage(2));

        if(pdfDocument.numPages>=3)
            firstLoads.push(renderPage(3));

        await Promise.all(firstLoads);


        pageFlip =
            new St.PageFlip(
                book,
                {
                    width:pageWidth,
                    height:pageHeight,

                    size:"stretch",

                    minWidth:240,
                    maxWidth:700,

                    minHeight:
                        Math.round(240*ratio),

                    maxHeight:
                        Math.round(700*ratio),

                    showCover:true,

                    usePortrait:true,

                    startPage:0,

                    autoSize:true,

                    drawShadow:true,

                    maxShadowOpacity:.45,

                    flippingTime:850,

                    mobileScrollSupport:false,

                    showPageCorners:true
                }
            );


        pageFlip.loadFromHTML(
            document.querySelectorAll(".page")
        );


        document.getElementById("initialLoader")
            .style.display = "none";


        applyResponsiveOrientation();

        updatePageNumber();

        preloadAround(1);


        pageFlip.on("flip",function(event){

            updatePageNumber();

            playFlipSound();

            preloadAround(
                event.data + 1
            );
        });


        setTimeout(
            backgroundRender,
            900
        );

    }catch(error){

        console.error(error);

        document.getElementById(
            "initialLoader"
        ).innerHTML =
        "<div class='loaderText'>Error loading catalog.</div>";
    }
}


/* =========================
PAGE ORIENTATION
========================= */

function applyResponsiveOrientation(){

    if(!pageFlip) return;

    let orientation;

    if(manualMode==="single"){

        orientation = "portrait";

    }else if(manualMode==="double"){

        orientation = "landscape";

    }else{

        orientation =
            window.innerWidth <= 700
            ? "portrait"
            : "landscape";
    }

    try{

        pageFlip.updateOrientation(
            orientation
        );

    }catch(e){}

    updatePageModeLabel();
}


window.addEventListener(
    "resize",
    function(){

        setTimeout(
            applyResponsiveOrientation,
            150
        );
    }
);


/* =========================
RENDER PAGE
========================= */

async function renderPage(pageNumber){

    if(!pdfDocument) return;

    if(
        pageNumber < 1 ||
        pageNumber > pdfDocument.numPages
    ) return;

    if(renderedPages.has(pageNumber))
        return;

    if(renderingPages.has(pageNumber))
        return;

    renderingPages.add(pageNumber);

    try{

        const pdfPage =
            await pdfDocument.getPage(
                pageNumber
            );

        const deviceRatio =
            Math.min(
                window.devicePixelRatio || 1,
                1.5
            );

        const baseScale =
            window.innerWidth <= 700
            ? 1.25
            : 1.3;

        const viewport =
            pdfPage.getViewport({
                scale:
                    baseScale *
                    deviceRatio
            });

        const canvas =
            document.createElement(
                "canvas"
            );

        const context =
            canvas.getContext(
                "2d",
                {alpha:false}
            );

        canvas.width =
            Math.floor(viewport.width);

        canvas.height =
            Math.floor(viewport.height);

        await pdfPage.render({
            canvasContext:context,
            viewport:viewport
        }).promise;

        const target =
            pageElements[
                pageNumber - 1
            ];

        if(target){

            target.innerHTML = "";

            target.appendChild(
                canvas
            );
        }

        renderedPages.add(
            pageNumber
        );

    }catch(error){

        console.error(
            "Render error",
            pageNumber,
            error
        );

    }finally{

        renderingPages.delete(
            pageNumber
        );
    }
}


/* =========================
PRELOAD
========================= */

function preloadAround(pageNumber){

    if(!pdfDocument) return;

    [
        pageNumber-2,
        pageNumber-1,
        pageNumber,
        pageNumber+1,
        pageNumber+2,
        pageNumber+3,
        pageNumber+4
    ].forEach(number=>{

        if(
            number>=1 &&
            number<=pdfDocument.numPages
        ){

            renderPage(number);
        }
    });
}


async function backgroundRender(){

    if(!pdfDocument) return;

    for(
        let i=1;
        i<=pdfDocument.numPages;
        i++
    ){

        if(
            !pdfDocument ||
            backgroundRenderStopped
        ) break;

        if(!renderedPages.has(i)){

            await renderPage(i);

            await sleep(100);
        }
    }
}


function sleep(ms){

    return new Promise(
        resolve =>
            setTimeout(resolve,ms)
    );
}


/* =========================
PAGE NUMBER
========================= */

function updatePageNumber(){

    if(!pageFlip) return;

    const index =
        pageFlip.getCurrentPageIndex();

    const total =
        pageFlip.getPageCount();

    let text;

    const orientation =
        pageFlip.getOrientation();

    if(
        orientation==="landscape" &&
        index>0 &&
        index<total-1
    ){

        const first =
            index + 1;

        const second =
            Math.min(
                first + 1,
                total
            );

        text =
            first +
            "-" +
            second +
            "/" +
            total;

    }else{

        text =
            (index+1) +
            "/" +
            total;
    }

    document.getElementById(
        "pageInfo"
    ).innerText = text;
}


/* =========================
NEXT / PREV
========================= */

async function nextPage(){

    if(!pageFlip) return;

    await unlockSound();

    try{

        pageFlip.flipNext("top");

    }catch(e){

        pageFlip.flipNext();
    }
}


async function prevPage(){

    if(!pageFlip) return;

    await unlockSound();

    try{

        pageFlip.flipPrev("top");

    }catch(e){

        pageFlip.flipPrev();
    }
}


/* =========================
FIRST / LAST
========================= */

function goFirstPage(){

    closeMenus();

    if(!pageFlip) return;

    try{

        pageFlip.flip(
            0,
            "top"
        );

    }catch(e){

        pageFlip.turnToPage(0);
    }
}


function goLastPage(){

    closeMenus();

    if(!pageFlip) return;

    const last =
        pageFlip.getPageCount()-1;

    try{

        pageFlip.flip(
            last,
            "top"
        );

    }catch(e){

        pageFlip.turnToPage(
            last
        );
    }
}


/* =========================
ZOOM
========================= */

function zoomIn(){

    if(zoomValue>=2.5)
        return;

    zoomValue += .25;

    applyZoom();
}


function zoomOut(){

    if(zoomValue<=.75)
        return;

    zoomValue -= .25;

    applyZoom();
}


function resetZoom(){

    zoomValue = 1;

    applyZoom();
}


function applyZoom(){

    const stage =
        document.getElementById(
            "zoomStage"
        );

    stage.style.transform =
        "scale(" +
        zoomValue +
        ")";
}


/* =========================
THUMBNAILS
========================= */

async function toggleThumbnails(){

    closeMoreMenu();

    const panel =
        document.getElementById(
            "thumbPanel"
        );

    if(
        panel.style.display==="block"
    ){

        panel.style.display="none";
        return;
    }

    panel.style.display="block";

    if(!thumbnailsBuilt){

        thumbnailsBuilt = true;

        await buildThumbnails();
    }
}


async function buildThumbnails(){

    if(!pdfDocument) return;

    const grid =
        document.getElementById(
            "thumbGrid"
        );

    for(
        let i=1;
        i<=pdfDocument.numPages;
        i++
    ){

        const item =
            document.createElement(
                "div"
            );

        item.className =
            "thumbItem";

        const canvas =
            document.createElement(
                "canvas"
            );

        const label =
            document.createElement(
                "div"
            );

        label.className =
            "thumbNumber";

        label.innerText =
            "Page " + i;

        item.appendChild(
            canvas
        );

        item.appendChild(
            label
        );

        grid.appendChild(
            item
        );

        item.onclick =
            function(){

                goToPage(i-1);

                document.getElementById(
                    "thumbPanel"
                ).style.display =
                    "none";
            };


        try{

            const page =
                await pdfDocument.getPage(i);

            const viewport =
                page.getViewport({
                    scale:.23
                });

            canvas.width =
                viewport.width;

            canvas.height =
                viewport.height;

            await page.render({
                canvasContext:
                    canvas.getContext("2d"),
                viewport:viewport
            }).promise;

        }catch(e){}

        await sleep(20);
    }
}


function goToPage(index){

    if(!pageFlip) return;

    try{

        pageFlip.flip(
            index,
            "top"
        );

    }catch(e){

        pageFlip.turnToPage(
            index
        );
    }
}


/* =========================
SINGLE / DOUBLE
========================= */

function togglePageMode(){

    closeMenus();

    if(!pageFlip)
        return;

    const currentOrientation =
        pageFlip.getOrientation();

    if(
        currentOrientation==="landscape"
    ){

        manualMode =
            "single";

    }else{

        manualMode =
            "double";
    }

    applyResponsiveOrientation();

    updatePageNumber();
}


function updatePageModeLabel(){

    const label =
        document.getElementById(
            "pageModeText"
        );

    if(!pageFlip){

        label.innerText =
            "Single Page Mode";

        return;
    }

    if(
        pageFlip.getOrientation()
        ===
        "landscape"
    ){

        label.innerText =
            "Single Page Mode";

    }else{

        label.innerText =
            "Double Page Mode";
    }
}


/* =========================
SOUND
========================= */

function toggleSound(){

    soundEnabled =
        !soundEnabled;

    document.getElementById(
        "soundText"
    ).innerText =
        soundEnabled
        ? "Turn off Sound"
        : "Turn on Sound";

    showToast(
        soundEnabled
        ? "Sound on"
        : "Sound off"
    );

    closeMenus();
}


/* =========================
DOWNLOAD
========================= */

function downloadPDF(){

    closeMenus();

    if(!currentCatalog)
        return;

    const link =
        document.createElement(
            "a"
        );

    link.href =
        currentCatalog;

    link.download =
        currentCatalog;

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();
}


/* =========================
SHARE
========================= */

async function shareCatalog(){

    const url =
        window.location.href;

    try{

        if(navigator.share){

            await navigator.share({
                title:
                    "Digital Catalog",
                url:url
            });

        }else{

            await navigator.clipboard
                .writeText(url);

            showToast(
                "Link copied"
            );
        }

    }catch(e){}
}


/* =========================
FULLSCREEN
========================= */

function toggleFullscreen(){

    if(
        !document.fullscreenElement
    ){

        document.documentElement
            .requestFullscreen()
            .catch(()=>{});

    }else{

        document
            .exitFullscreen()
            .catch(()=>{});
    }
}


/* =========================
MORE MENU
========================= */

function toggleMoreMenu(){

    document.getElementById(
        "thumbPanel"
    ).style.display =
        "none";

    const menu =
        document.getElementById(
            "moreMenu"
        );

    menu.style.display =
        menu.style.display==="block"
        ? "none"
        : "block";
}


function closeMoreMenu(){

    document.getElementById(
        "moreMenu"
    ).style.display =
        "none";
}


function closeMenus(){

    closeMoreMenu();

    document.getElementById(
        "thumbPanel"
    ).style.display =
        "none";
}


/* =========================
TOAST
========================= */

function showToast(text){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.innerText = text;

    toast.style.display =
        "block";

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            ()=>{
                toast.style.display =
                    "none";
            },
            1600
        );
}


/* =========================
HOME
========================= */

function goHome(){

    closeMenus();

    backgroundRenderStopped =
        true;

    if(pageFlip){

        try{

            pageFlip.destroy();

        }catch(e){}
    }

    pageFlip = null;

    pdfDocument = null;

    currentCatalog = null;

    renderedPages.clear();

    renderingPages.clear();

    pageElements = [];

    document.getElementById(
        "book"
    ).innerHTML = "";

    document.getElementById(
        "reader"
    ).style.display =
        "none";

    document.getElementById(
        "bottomBar"
    ).style.display =
        "none";

    document.getElementById(
        "catalogMenu"
    ).style.display =
        "flex";

    resetZoom();
}


/* CLOSE MENUS IF CLICK OUTSIDE */

document.addEventListener(
    "click",
    function(event){

        const bar =
            document.getElementById(
                "bottomBar"
            );

        const thumbs =
            document.getElementById(
                "thumbPanel"
            );

        if(
            !bar.contains(event.target) &&
            !thumbs.contains(event.target)
        ){

            closeMenus();
        }
    }
);

</script>
