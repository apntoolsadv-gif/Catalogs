<!DOCTYPE html>
<html lang="fa">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

<title>Digital Catalog</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:#111;
    font-family:Arial,sans-serif;
    overflow:hidden;
}


/* =========================
   SELECT CATALOG
========================= */

#catalogMenu{

    width:100%;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:24px;
}


.menuBox{

    width:min(430px,92vw);

    text-align:center;

    color:white;
}


.menuBox h1{

    margin:0 0 8px;

    font-size:30px;
}


.menuBox p{

    margin:0 0 30px;

    font-size:14px;

    color:#999;
}


.catalogButton{

    width:100%;

    min-height:78px;

    border:0;

    border-radius:14px;

    margin-bottom:16px;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;
}


.rockman{

    background:#ffc400;

    color:#111;
}


.apn{

    background:#c9141c;

    color:white;
}



/* =========================
   READER
========================= */

#reader{

    display:none;

    width:100%;

    height:100vh;

    position:relative;

    background:#111;
}



/* =========================
   BOOK AREA
========================= */

#bookArea{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:auto;

    padding:
        12px
        50px
        70px;
}


#bookStage{

    margin:auto;

    display:flex;

    justify-content:center;
    align-items:center;

    transform-origin:center center;

    transition:transform .2s ease;
}


#book{

    margin:auto;
}



/* =========================
   PAGE
========================= */

.page{

    background:white;

    overflow:hidden;
}


.page canvas{

    width:100%;

    height:100%;

    display:block;
}



/* =========================
   PAGE PLACEHOLDER
========================= */

.pageLoading{

    width:100%;

    height:100%;

    background:

        linear-gradient(
            110deg,
            #e5e5e5 8%,
            #f5f5f5 18%,
            #e5e5e5 33%
        );

    background-size:200% 100%;

    animation:
        shimmer 1.3s linear infinite;
}


@keyframes shimmer{

    to{

        background-position-x:-200%;
    }
}



/* =========================
   LOADER
========================= */

#initialLoader{

    position:absolute;

    inset:0;

    z-index:100;

    background:#111;

    display:flex;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    gap:14px;
}


.spinner{

    width:36px;

    height:36px;

    border:
        3px solid #444;

    border-top-color:white;

    border-radius:50%;

    animation:
        rotate .75s linear infinite;
}


@keyframes rotate{

    to{

        transform:rotate(360deg);
    }
}


.loaderText{

    color:#aaa;

    font-size:14px;
}



/* =========================
   PAGE ARROWS
========================= */

.sideArrow{

    position:fixed;

    top:50%;

    transform:
        translateY(-50%);

    z-index:50;

    width:46px;

    height:70px;

    border:0;

    border-radius:10px;

    background:
        rgba(15,15,15,.55);

    color:white;

    font-size:34px;

    cursor:pointer;
}


#prevSide{

    left:8px;
}


#nextSide{

    right:8px;
}



/* =========================
   ONLY ZOOM CONTROLS
========================= */

#zoomBar{

    display:none;

    position:fixed;

    left:50%;

    bottom:12px;

    transform:
        translateX(-50%);

    z-index:120;

    background:#f4f4f4;

    border-radius:8px;

    overflow:hidden;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.35);
}


.zoomButton{

    width:56px;

    height:48px;

    border:0;

    background:#f4f4f4;

    color:#444;

    font-size:27px;

    cursor:pointer;
}


.zoomButton:first-child{

    border-right:
        1px solid #ddd;
}


.zoomButton:hover{

    background:#e7e7e7;
}



/* =========================
   MOBILE
========================= */

@media(max-width:700px){


    .menuBox h1{

        font-size:25px;
    }


    .catalogButton{

        min-height:68px;

        font-size:18px;
    }


    #bookArea{

        padding:
            5px
            2px
            62px;
    }


    .sideArrow{

        width:34px;

        height:54px;

        font-size:27px;

        background:
            rgba(15,15,15,.38);
    }


    #prevSide{

        left:0;
    }


    #nextSide{

        right:0;
    }


    #zoomBar{

        bottom:7px;
    }


    .zoomButton{

        width:50px;

        height:44px;

        font-size:25px;
    }

}

</style>

</head>


<body>


<!-- =========================
CATALOG SELECTION
========================= -->

<div id="catalogMenu">

<div class="menuBox">

<h1>
Digital Catalog
</h1>

<p>
Select a catalog
</p>


<button
class="catalogButton rockman"
onclick="openCatalog('Rockman.catalog.pdf')">

ROCKMAN CATALOG

</button>


<button
class="catalogButton apn"
onclick="openCatalog('Apn.catalog.pdf')">

APN CATALOG

</button>

</div>

</div>



<!-- =========================
READER
========================= -->

<div id="reader">


<button
id="prevSide"
class="sideArrow"
onclick="previousPage()">

‹

</button>


<button
id="nextSide"
class="sideArrow"
onclick="nextPage()">

›

</button>



<div id="bookArea">


<div id="initialLoader">


<div class="spinner">
</div>


<div class="loaderText">

Opening catalog...

</div>


</div>



<div id="bookStage">


<div id="book">
</div>


</div>


</div>


</div>



<!-- =========================
ONLY TWO BOTTOM BUTTONS
========================= -->

<div id="zoomBar">


<button
class="zoomButton"
onclick="zoomOut()">

−

</button>


<button
class="zoomButton"
onclick="zoomIn()">

+

</button>


</div>



<!-- =========================
PAGE SOUND
========================= -->

<audio
id="pageFlipAudio"
src="./pageflip.mp3?v=30"
preload="auto">
</audio>



<script
src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
</script>


<script
src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js">
</script>



<script>


pdfjsLib.GlobalWorkerOptions.workerSrc =

"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";



let pdfDocument = null;

let pageFlip = null;


let pageElements = [];


let renderedPages =
    new Set();


let renderingPages =
    new Set();


let storedCanvases = {};


let zoomValue = 1;


let lastPageIndex = 0;


let soundUnlocked = false;


let stopBackgroundLoad = false;


let pageRatio = 1.414;



/* =========================
AUDIO
========================= */

async function unlockSound(){


    if(soundUnlocked)
        return;


    const audio =

        document.getElementById(
            "pageFlipAudio"
        );


    try{


        audio.muted = true;


        await audio.play();


        audio.pause();


        audio.currentTime = 0;


        audio.muted = false;


        soundUnlocked = true;


    }


    catch(e){


        audio.muted = false;


    }

}



function playFlipSound(){


    const original =

        document.getElementById(
            "pageFlipAudio"
        );


    if(!original)
        return;


    const audio =

        original.cloneNode(true);


    audio.currentTime = 0;


    audio.volume = .8;


    audio.play()
        .catch(()=>{});

}



/* =========================
OPEN CATALOG
========================= */

async function openCatalog(pdfFile){


    await unlockSound();


    zoomValue = 1;


    stopBackgroundLoad =
        false;


    storedCanvases = {};


    renderedPages.clear();


    renderingPages.clear();


    pageElements = [];


    applyZoom();



    document.getElementById(
        "catalogMenu"
    ).style.display =
        "none";


    document.getElementById(
        "reader"
    ).style.display =
        "block";


    document.getElementById(
        "zoomBar"
    ).style.display =
        "flex";


    document.getElementById(
        "initialLoader"
    ).style.display =
        "flex";



    try{


        pdfDocument =

            await pdfjsLib.getDocument({

                url:
                    pdfFile,

                disableRange:
                    false,

                disableStream:
                    false,

                disableAutoFetch:
                    true

            }).promise;



        const firstPage =

            await pdfDocument
            .getPage(1);



        const firstViewport =

            firstPage
            .getViewport({

                scale:1

            });



        pageRatio =

            firstViewport.height /

            firstViewport.width;



        createPages();



        /*
        ONLY COVER BEFORE DISPLAY
        */


        await renderPage(1);



        createBook();



        document.getElementById(
            "initialLoader"
        ).style.display =
            "none";



        /*
        Prepare next pages after cover
        is already visible.
        */


        setTimeout(()=>{


            preloadAround(
                2
            );


        },30);



        setTimeout(()=>{


            backgroundLoad();


        },500);


    }


    catch(error){


        console.error(
            error
        );


    }

}



/* =========================
CREATE PAGE ELEMENTS
========================= */

function createPages(){


    const book =

        document.getElementById(
            "book"
        );


    book.innerHTML =
        "";


    pageElements = [];


    for(

        let i=1;

        i<=pdfDocument.numPages;

        i++

    ){


        const page =

            document.createElement(
                "div"
            );


        page.className =
            "page";


        page.dataset.pageNumber =
            i;



        const placeholder =

            document.createElement(
                "div"
            );


        placeholder.className =
            "pageLoading";


        page.appendChild(
            placeholder
        );


        book.appendChild(
            page
        );


        pageElements.push(
            page
        );


    }

}



/* =========================
CREATE BOOK
========================= */

function createBook(){


    const mobile =

        window.innerWidth <= 700;



    /*
    DESKTOP:
    larger normal readable size.

    MOBILE:
    single page occupying most
    of screen.
    */


    const width =

        mobile
        ? 440
        : 610;



    const height =

        Math.round(

            width *

            pageRatio

        );



    pageFlip =

        new St.PageFlip(

            document.getElementById(
                "book"
            ),

            {


                width:
                    width,


                height:
                    height,


                size:
                    "stretch",



                minWidth:

                    mobile
                    ? 300
                    : 390,


                maxWidth:

                    mobile
                    ? 520
                    : 720,



                minHeight:

                    Math.round(

                        (
                            mobile
                            ? 300
                            : 390
                        )

                        *

                        pageRatio

                    ),



                maxHeight:

                    Math.round(

                        (
                            mobile
                            ? 520
                            : 720
                        )

                        *

                        pageRatio

                    ),



                /*
                FIRST + LAST COVER
                = SINGLE
                */


                showCover:
                    true,



                /*
                MOBILE:
                SINGLE PAGE

                DESKTOP:
                DOUBLE PAGE INSIDE
                */


                usePortrait:
                    mobile,



                startPage:
                    0,


                autoSize:
                    true,


                drawShadow:
                    true,


                maxShadowOpacity:
                    .45,


                flippingTime:
                    900,


                mobileScrollSupport:
                    false,


                showPageCorners:
                    true


            }

        );



    pageFlip.loadFromHTML(

        document.querySelectorAll(
            ".page"
        )

    );



    lastPageIndex =

        pageFlip
        .getCurrentPageIndex();



    /*
    SOUND ONLY AFTER REAL PAGE CHANGE
    */


    pageFlip.on(

        "flip",

        function(event){


            const index =
                event.data;


            if(
                index !==
                lastPageIndex
            ){


                playFlipSound();


                lastPageIndex =
                    index;


            }


            preloadAround(
                index + 1
            );


        }

    );

}



/* =========================
RENDER PDF PAGE
========================= */

async function renderPage(number){


    if(!pdfDocument)
        return;


    if(
        number < 1 ||
        number >
        pdfDocument.numPages
    )
        return;


    if(
        renderedPages.has(
            number
        )
    )
        return;


    if(
        renderingPages.has(
            number
        )
    )
        return;



    renderingPages.add(
        number
    );



    try{


        const page =

            await pdfDocument
            .getPage(
                number
            );



        const mobile =

            window.innerWidth <= 700;



        const pixelRatio =

            Math.min(

                window.devicePixelRatio || 1,

                1.4

            );



        const scale =

            mobile
            ? 1.12
            : 1.23;



        const viewport =

            page.getViewport({

                scale:

                    scale *

                    pixelRatio

            });



        const canvas =

            document.createElement(
                "canvas"
            );



        const context =

            canvas.getContext(

                "2d",

                {
                    alpha:false
                }

            );



        canvas.width =

            Math.floor(
                viewport.width
            );


        canvas.height =

            Math.floor(
                viewport.height
            );



        await page.render({

            canvasContext:
                context,

            viewport:
                viewport

        }).promise;



        storedCanvases[number] =
            canvas;



        const target =

            pageElements[
                number - 1
            ];



        if(target){


            target.innerHTML =
                "";


            const visible =

                document.createElement(
                    "canvas"
                );


            visible.width =
                canvas.width;


            visible.height =
                canvas.height;


            visible
            .getContext("2d")
            .drawImage(
                canvas,
                0,
                0
            );


            target.appendChild(
                visible
            );


        }



        renderedPages.add(
            number
        );


    }


    catch(error){


        console.error(
            error
        );


    }


    finally{


        renderingPages.delete(
            number
        );


    }

}



/* =========================
PRELOAD
========================= */

function preloadAround(page){


    [


        page,

        page + 1,

        page + 2,

        page + 3


    ].forEach(number=>{


        if(

            pdfDocument &&

            number >= 1 &&

            number <=
            pdfDocument.numPages

        ){


            renderPage(
                number
            );


        }


    });

}



/* =========================
BACKGROUND LOAD
========================= */

async function backgroundLoad(){


    if(!pdfDocument)
        return;


    for(

        let i=1;

        i<=pdfDocument.numPages;

        i++

    ){


        if(
            stopBackgroundLoad
        )
            break;


        if(
            !renderedPages.has(i)
        ){


            await renderPage(i);


            await sleep(
                160
            );


        }


    }

}



function sleep(ms){


    return new Promise(

        resolve =>

            setTimeout(
                resolve,
                ms
            )

    );

}



/* =========================
NEXT PAGE
========================= */

async function nextPage(){


    if(!pageFlip)
        return;


    await unlockSound();


    /*
    FORWARD FLIP ANIMATION
    */


    try{


        pageFlip.flipNext(
            "top"
        );


    }


    catch(e){


        pageFlip.flipNext();


    }

}



/* =========================
PREVIOUS PAGE
========================= */

async function previousPage(){


    if(!pageFlip)
        return;


    await unlockSound();



    /*
    IMPORTANT:
    THIS IS ANIMATED REVERSE FLIP.

    It does NOT jump directly
    to previous page.
    */


    try{


        pageFlip.flipPrev(
            "top"
        );


    }


    catch(e){


        pageFlip.flipPrev();


    }

}



/* =========================
ZOOM +
========================= */

function zoomIn(){


    if(
        zoomValue >= 2.25
    )
        return;


    zoomValue += .25;


    applyZoom();

}



/* =========================
ZOOM -
========================= */

function zoomOut(){


    if(
        zoomValue <= .75
    )
        return;


    zoomValue -= .25;


    applyZoom();

}



function applyZoom(){


    document.getElementById(
        "bookStage"
    ).style.transform =

        "scale(" +

        zoomValue +

        ")";

}


</script>

</body>

</html>
