<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">

<title>Digital Catalog</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;

    background:#111;

    font-family:Arial,sans-serif;

    overflow:hidden;
}


/* =====================================================
   HOME
===================================================== */

#catalogMenu{
    width:100%;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:24px;
}

.menuBox{
    width:min(430px,92vw);

    text-align:center;

    color:#fff;
}

.menuBox h1{
    margin:0 0 8px;

    font-size:30px;
}

.menuBox p{
    margin:0 0 30px;

    color:#999;

    font-size:14px;
}


/* =====================================================
   CATALOG BUTTONS
===================================================== */

.catalogButton{
    width:100%;

    min-height:78px;

    margin-bottom:16px;

    border:0;

    border-radius:14px;

    font-size:22px;

    font-weight:bold;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    letter-spacing:.5px;

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.catalogButton:active{
    transform:scale(.98);
}

.rockman{
    background:#ffc400;

    color:#111;
}

.apn{
    background:#c9141c;

    color:#fff;
}


/* =====================================================
   READER
===================================================== */

#reader{
    display:none;

    position:relative;

    width:100%;
    height:100vh;

    background:#111;

    overflow:hidden;
}


/* =====================================================
   PAGE COUNTER
===================================================== */

#pageCounter{
    position:fixed;

    top:12px;
    left:50%;

    transform:translateX(-50%);

    z-index:850;

    padding:8px 15px;

    border-radius:8px;

    background:rgba(20,20,20,.82);

    color:#fff;

    font-size:14px;

    white-space:nowrap;

    pointer-events:none;

    user-select:none;
}


/* =====================================================
   SIDE ARROWS
===================================================== */

.sideArrow{
    position:fixed;

    top:50%;

    transform:translateY(-50%);

    z-index:900;

    width:46px;
    height:70px;

    border:0;

    border-radius:10px;

    background:rgba(15,15,15,.60);

    color:#fff;

    font-size:35px;

    line-height:1;

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;

    touch-action:manipulation;

    user-select:none;

    -webkit-user-select:none;
}

.sideArrow:hover{
    background:rgba(40,40,40,.92);
}

.sideArrow:active{
    transform:
        translateY(-50%)
        scale(.94);
}

#prevSide{
    left:8px;
}

#nextSide{
    right:8px;
}


/* =====================================================
   BOOK AREA
===================================================== */

#bookArea{
    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    padding:
        55px
        56px
        70px;

    touch-action:none;
}


/* =====================================================
   PAN + ZOOM STAGE
===================================================== */

#panStage{
    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    transform-origin:center center;

    will-change:transform;

    touch-action:none;
}


/* =====================================================
   BOOK STAGE
===================================================== */

#bookStage{
    position:relative;

    display:inline-flex;

    align-items:center;
    justify-content:center;

    width:max-content;
    height:max-content;
}


/* =====================================================
   RTL MIRROR

   فقط خود مکانیزم کتاب Mirror می‌شود.
   محتوای هر صفحه دوباره Mirror معکوس می‌شود،
   بنابراین نوشته و تصویر PDF صحیح باقی می‌ماند.
===================================================== */

#rtlBookMirror{
    position:relative;

    display:inline-flex;

    transform:scaleX(-1);

    transform-origin:center center;
}


/* =====================================================
   BOOK
===================================================== */

#book{
    margin:auto;

    pointer-events:none;
}


/* =====================================================
   PAGE
===================================================== */

.page{
    background:#fff;

    overflow:hidden;
}


/*
محتوا Mirror دوم می‌گیرد تا
نوشته‌ها آینه‌ای نشوند.
*/

.pageInner{
    width:100%;
    height:100%;

    transform:scaleX(-1);

    transform-origin:center center;

    background:#fff;
}

.pageInner canvas{
    display:block;

    width:100%;
    height:100%;
}


/* =====================================================
   EDGE SWIPE ZONES
===================================================== */

.edgeZone{
    position:absolute;

    top:0;
    bottom:0;

    width:1cm;

    z-index:180;

    background:transparent;

    touch-action:none;
}

#leftEdge{
    left:0;
}

#rightEdge{
    right:0;
}


/* =====================================================
   PAGE PLACEHOLDER
===================================================== */

.pageLoading{
    width:100%;
    height:100%;

    background:

        linear-gradient(
            110deg,
            #e5e5e5 8%,
            #f5f5f5 18%,
            #e5e5e5 33%
        );

    background-size:200% 100%;

    animation:
        shimmer
        1.3s
        linear
        infinite;
}

@keyframes shimmer{

    to{
        background-position-x:-200%;
    }

}


/* =====================================================
   INITIAL LOADER
===================================================== */

#initialLoader{
    position:absolute;

    inset:0;

    z-index:700;

    background:#111;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:14px;
}

.spinner{
    width:36px;
    height:36px;

    border:3px solid #444;

    border-top-color:#fff;

    border-radius:50%;

    animation:
        rotate
        .75s
        linear
        infinite;
}

@keyframes rotate{

    to{
        transform:rotate(360deg);
    }

}

.loaderText{
    color:#aaa;

    font-size:14px;
}


/* =====================================================
   BOTTOM BAR
===================================================== */

#bottomBar{
    display:none;

    position:fixed;

    left:50%;
    bottom:12px;

    transform:translateX(-50%);

    z-index:950;

    background:#f4f4f4;

    border-radius:8px;

    overflow:hidden;

    box-shadow:
        0
        5px
        18px
        rgba(0,0,0,.35);
}

.bottomButton{
    width:56px;
    height:48px;

    border:0;

    border-right:1px solid #ddd;

    background:#f4f4f4;

    color:#444;

    font-size:24px;

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;

    touch-action:manipulation;

    user-select:none;

    -webkit-user-select:none;
}

.bottomButton:last-child{
    border-right:0;
}

.bottomButton:hover{
    background:#e7e7e7;
}

#switchButton{
    font-size:25px;

    font-weight:bold;
}


/* =====================================================
   PAGE PANEL
===================================================== */

#pagePanel{
    display:none;

    position:fixed;

    left:50%;
    bottom:72px;

    transform:translateX(-50%);

    width:min(900px,94vw);

    max-height:65vh;

    z-index:940;

    background:#1b1b1b;

    border:1px solid #444;

    border-radius:12px;

    padding:14px;

    overflow-y:auto;
    overflow-x:hidden;

    touch-action:pan-y;

    overscroll-behavior:contain;

    box-shadow:
        0
        10px
        35px
        rgba(0,0,0,.5);
}


/*
Thumbnailها هم راست به چپ چیده شوند.
*/

#pageGrid{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(95px,1fr)
        );

    gap:12px;

    direction:rtl;
}

.pageThumb{
    padding:5px;

    background:#292929;

    border:2px solid transparent;

    border-radius:7px;

    cursor:pointer;

    touch-action:manipulation;
}

.pageThumb:hover{
    background:#3a3a3a;
}

.pageThumb.active{
    border-color:#fff;
}

.pageThumb canvas{
    width:100%;

    height:auto;

    display:block;

    background:#fff;
}

.pageThumbLabel{
    padding-top:5px;

    text-align:center;

    font-size:10px;

    color:#ccc;

    direction:rtl;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .menuBox h1{
        font-size:25px;
    }

    .catalogButton{
        min-height:68px;

        font-size:20px;
    }

    #pageCounter{
        top:7px;

        padding:6px 11px;

        font-size:12px;
    }

    #bookArea{
        padding:
            42px
            36px
            62px;
    }

    .sideArrow{
        width:34px;
        height:56px;

        border-radius:8px;

        font-size:28px;

        background:rgba(15,15,15,.52);
    }

    #prevSide{
        left:1px;
    }

    #nextSide{
        right:1px;
    }

    #bottomBar{
        bottom:7px;
    }

    .bottomButton{
        width:48px;
        height:44px;

        font-size:22px;
    }

    #switchButton{
        font-size:22px;
    }

    #pagePanel{
        bottom:60px;

        width:96vw;

        max-height:70vh;

        padding:10px;
    }

    #pageGrid{
        grid-template-columns:
            repeat(3,1fr);

        gap:9px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HOME
===================================================== -->

<div id="catalogMenu">

    <div class="menuBox">


        <h1>
            Digital Catalog
        </h1>


        <p>
            Select a catalog
        </p>



        <button
        class="catalogButton rockman"
        onclick="
            openCatalog(
                'rockman',
                'Rockman.catalog.pdf'
            )
        ">

            ROCKMAN

        </button>



        <button
        class="catalogButton apn"
        onclick="
            openCatalog(
                'apn',
                'Apn.catalog.pdf'
            )
        ">

            APN

        </button>


    </div>

</div>



<!-- =====================================================
     READER
===================================================== -->

<div id="reader">


    <!-- PREVIOUS -->

    <button
    id="prevSide"
    class="sideArrow"
    onclick="previousPage()"
    aria-label="Previous page">

        ‹

    </button>



    <!-- NEXT -->

    <button
    id="nextSide"
    class="sideArrow"
    onclick="nextPage()"
    aria-label="Next page">

        ›

    </button>



    <!-- COUNTER -->

    <div id="pageCounter">

        صفحه 1 از 1

    </div>



    <!-- BOOK AREA -->

    <div id="bookArea">


        <!-- LOADER -->

        <div id="initialLoader">


            <div class="spinner">
            </div>


            <div class="loaderText">
                Opening...
            </div>


        </div>



        <!-- PAN + ZOOM -->

        <div id="panStage">


            <div id="bookStage">


                <!--
                RTL MIRROR
                -->

                <div id="rtlBookMirror">


                    <div id="book">
                    </div>


                </div>



                <!--
                فقط این دو ناحیه
                Swipe صفحه را کنترل می‌کنند.
                -->


                <div
                id="leftEdge"
                class="edgeZone">
                </div>


                <div
                id="rightEdge"
                class="edgeZone">
                </div>


            </div>


        </div>


    </div>


</div>



<!-- =====================================================
     PAGE PANEL
===================================================== -->

<div id="pagePanel">


    <div id="pageGrid">
    </div>


</div>



<!-- =====================================================
     BOTTOM BAR
===================================================== -->

<div id="bottomBar">


    <!-- ZOOM OUT -->

    <button
    class="bottomButton"
    onclick="zoomOut()"
    aria-label="Zoom out">

        −

    </button>



    <!-- PAGES -->

    <button
    class="bottomButton"
    onclick="togglePagePanel()"
    aria-label="Pages">

        ▦

    </button>



    <!-- SWITCH CATALOG -->

    <button
    id="switchButton"
    class="bottomButton"
    onclick="switchCatalog()"
    aria-label="Switch catalog">

        ⇄

    </button>



    <!-- ZOOM IN -->

    <button
    class="bottomButton"
    onclick="zoomIn()"
    aria-label="Zoom in">

        +

    </button>


</div>



<!-- =====================================================
     SOUND
===================================================== -->

<audio
id="pageFlipAudio"
src="./pageflip.mp3"
preload="auto">
</audio>



<!-- =====================================================
     PDF.JS
===================================================== -->

<script
src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
</script>



<!-- =====================================================
     PAGE FLIP
===================================================== -->

<script
src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js">
</script>



<script>


/* =====================================================
   PDF WORKER
===================================================== */

pdfjsLib.GlobalWorkerOptions.workerSrc =

"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";



/* =====================================================
   GLOBALS
===================================================== */

let pdfDocument =
    null;


let pageFlip =
    null;


let currentCatalog =
    null;


let openRequestId =
    0;


let pageElements =
    [];


let renderedPages =
    new Set();


let renderingPages =
    new Set();


let thumbElements =
    [];


let thumbnailsBuilt =
    false;


let zoomValue =
    1;


let panX =
    0;


let panY =
    0;


let pageRatio =
    1.414;


let lastPageIndex =
    0;


let soundUnlocked =
    false;



/* =====================================================
   SEQUENTIAL LOAD
===================================================== */

let sequentialLoadToken =
    0;


let sequentialLoading =
    false;



/* =====================================================
   PAN
===================================================== */

let dragging =
    false;


let dragPointerId =
    null;


let dragStartX =
    0;


let dragStartY =
    0;


let dragStartPanX =
    0;


let dragStartPanY =
    0;



/* =====================================================
   PINCH
===================================================== */

let pinchActive =
    false;


let pinchStartDistance =
    0;


let pinchStartZoom =
    1;



/* =====================================================
   EDGE
===================================================== */

let edgeGesture =
    null;



/* =====================================================
   AUDIO
===================================================== */

async function unlockSound(){


    if(soundUnlocked){
        return;
    }


    const audio =

        document.getElementById(
            "pageFlipAudio"
        );


    if(!audio){
        return;
    }


    try{


        audio.muted =
            true;


        await audio.play();


        audio.pause();


        audio.currentTime =
            0;


        audio.muted =
            false;


        soundUnlocked =
            true;


    }


    catch(error){


        audio.muted =
            false;


    }

}



function playFlipSound(){


    const source =

        document.getElementById(
            "pageFlipAudio"
        );


    if(!source){
        return;
    }


    const audio =

        source.cloneNode(
            true
        );


    audio.currentTime =
        0;


    audio.volume =
        .8;


    audio.play()
        .catch(()=>{});

}



/* =====================================================
   DESTROY OLD BOOK
===================================================== */

function destroyCurrentBook(){


    sequentialLoadToken++;


    sequentialLoading =
        false;



    if(pageFlip){


        try{


            pageFlip.destroy();


        }


        catch(error){}


        pageFlip =
            null;

    }



    if(pdfDocument){


        try{


            pdfDocument.destroy();


        }


        catch(error){}


    }



    pdfDocument =
        null;



    document.getElementById(
        "book"
    ).innerHTML =
        "";



    document.getElementById(
        "pageGrid"
    ).innerHTML =
        "";



    renderedPages.clear();


    renderingPages.clear();



    pageElements =
        [];


    thumbElements =
        [];


    thumbnailsBuilt =
        false;


    edgeGesture =
        null;


    dragging =
        false;


    dragPointerId =
        null;


    pinchActive =
        false;

}



/* =====================================================
   OPEN CATALOG
===================================================== */

async function openCatalog(
    catalogName,
    pdfFile
){


    const requestId =

        ++openRequestId;



    currentCatalog =
        catalogName;



    destroyCurrentBook();



    zoomValue =
        1;


    panX =
        0;


    panY =
        0;



    const menu =

        document.getElementById(
            "catalogMenu"
        );


    const reader =

        document.getElementById(
            "reader"
        );


    const bottomBar =

        document.getElementById(
            "bottomBar"
        );


    const pagePanel =

        document.getElementById(
            "pagePanel"
        );


    const loader =

        document.getElementById(
            "initialLoader"
        );



    menu.style.display =
        "none";


    reader.style.display =
        "block";


    bottomBar.style.display =
        "flex";


    pagePanel.style.display =
        "none";



    document.getElementById(
        "pageCounter"
    ).innerText =
        "در حال باز شدن...";



    loader.innerHTML =

        '<div class="spinner"></div>' +

        '<div class="loaderText">Opening...</div>';



    loader.style.display =
        "flex";



    applyTransform();



    unlockSound();



    try{


        const loadingTask =

            pdfjsLib.getDocument({

                url:
                    pdfFile,


                disableRange:
                    false,


                disableStream:
                    false,


                disableAutoFetch:
                    true

            });



        const loadedPDF =

            await loadingTask.promise;



        if(
            requestId !==
            openRequestId
        ){


            try{

                loadedPDF.destroy();

            }

            catch(e){}


            return;

        }



        pdfDocument =
            loadedPDF;



        /*
        فقط صفحه اول ابتدا
        */


        const firstPage =

            await pdfDocument
            .getPage(
                1
            );



        if(
            requestId !==
            openRequestId
        ){
            return;
        }



        const firstViewport =

            firstPage
            .getViewport({

                scale:1

            });



        pageRatio =

            firstViewport.height /

            firstViewport.width;



        createPages();



        /*
        فقط صفحه اول Render
        */


        await renderPage(
            1
        );



        if(
            requestId !==
            openRequestId
        ){
            return;
        }



        createBook();



        updatePageCounter();



        loader.style.display =
            "none";



        /*
        صفحات 2 و 3 سریع
        */


        setTimeout(()=>{


            if(
                requestId ===
                openRequestId
            ){


                preloadPriorityPages(
                    2
                );


            }


        },20);



        /*
        بعد صفحات به ترتیب
        */


        setTimeout(()=>{


            if(
                requestId ===
                openRequestId
            ){


                startSequentialLoading();


            }


        },350);


    }


    catch(error){


        if(
            requestId !==
            openRequestId
        ){
            return;
        }


        console.error(
            error
        );


        loader.innerHTML =

            '<div style="' +

            'color:white;' +

            'text-align:center;' +

            'padding:20px;' +

            '">' +

            'خطا در باز شدن کاتالوگ' +

            '</div>';


        loader.style.display =
            "flex";

    }

}



/* =====================================================
   SWITCH APN / ROCKMAN
===================================================== */

function switchCatalog(){


    document.getElementById(
        "pagePanel"
    ).style.display =
        "none";



    if(
        currentCatalog ===
        "rockman"
    ){


        openCatalog(

            "apn",

            "Apn.catalog.pdf"

        );


        return;

    }



    openCatalog(

        "rockman",

        "Rockman.catalog.pdf"

    );

}



/* =====================================================
   CREATE PAGES
===================================================== */

function createPages(){


    const book =

        document.getElementById(
            "book"
        );


    book.innerHTML =
        "";


    pageElements =
        [];



    for(
        let i=1;
        i<=pdfDocument.numPages;
        i++
    ){


        /*
        صفحه بیرونی را StPageFlip کنترل می‌کند.
        */


        const page =

            document.createElement(
                "div"
            );


        page.className =
            "page";


        page.dataset.pageNumber =
            i;



        /*
        این wrapper محتوای PDF را
        Mirror معکوس می‌کند.
        */


        const inner =

            document.createElement(
                "div"
            );


        inner.className =
            "pageInner";



        const loading =

            document.createElement(
                "div"
            );


        loading.className =
            "pageLoading";



        inner.appendChild(
            loading
        );


        page.appendChild(
            inner
        );


        book.appendChild(
            page
        );


        pageElements.push(
            page
        );


    }

}



/* =====================================================
   CREATE BOOK
===================================================== */

function createBook(){


    const mobile =

        window.innerWidth <=
        700;



    const width =

        mobile
        ? 440
        : 610;



    const height =

        Math.round(

            width *

            pageRatio

        );



    pageFlip =

        new St.PageFlip(

            document.getElementById(
                "book"
            ),

            {


                width:
                    width,


                height:
                    height,


                size:
                    "stretch",


                minWidth:

                    mobile
                    ? 280
                    : 390,


                maxWidth:

                    mobile
                    ? 520
                    : 720,


                minHeight:

                    Math.round(

                        (
                            mobile
                            ? 280
                            : 390
                        )

                        *

                        pageRatio

                    ),


                maxHeight:

                    Math.round(

                        (
                            mobile
                            ? 520
                            : 720
                        )

                        *

                        pageRatio

                    ),


                /*
                جلد اول و آخر
                تک صفحه
                */

                showCover:
                    true,


                /*
                موبایل تک صفحه
                دسکتاپ دو صفحه
                */

                usePortrait:
                    mobile,


                startPage:
                    0,


                autoSize:
                    true,


                drawShadow:
                    true,


                maxShadowOpacity:
                    .45,


                flippingTime:
                    900,


                mobileScrollSupport:
                    true,


                showPageCorners:
                    false


            }

        );



    pageFlip.loadFromHTML(

        document.querySelectorAll(
            ".page"
        )

    );



    document.getElementById(
        "book"
    ).style.pointerEvents =
        "none";



    lastPageIndex =

        pageFlip
        .getCurrentPageIndex();



    pageFlip.on(

        "flip",

        function(event){


            const index =
                event.data;



            if(
                index !==
                lastPageIndex
            ){


                playFlipSound();


                lastPageIndex =
                    index;


            }



            panX =
                0;


            panY =
                0;



            applyTransform();



            updatePageCounter();



            updateActiveThumbnail();



            preloadPriorityPages(
                index + 1
            );


        }

    );

}



/* =====================================================
   NEXT PAGE

   به دلیل Mirror شدن خود کتاب،
   flipNext به صورت بصری
   از راست به چپ دیده می‌شود.
===================================================== */

async function nextPage(){


    if(!pageFlip){
        return;
    }



    const current =

        pageFlip
        .getCurrentPageIndex();



    preloadPriorityPages(
        current + 2
    );



    await unlockSound();



    try{


        pageFlip.flipNext(
            "top"
        );


    }


    catch(error){


        try{

            pageFlip.flipNext();

        }

        catch(e){}


    }

}



/* =====================================================
   PREVIOUS PAGE
===================================================== */

async function previousPage(){


    if(!pageFlip){
        return;
    }



    const current =

        pageFlip
        .getCurrentPageIndex();



    preloadPriorityPages(
        current
    );



    await unlockSound();



    try{


        pageFlip.flipPrev(
            "top"
        );


    }


    catch(error){


        try{

            pageFlip.flipPrev();

        }

        catch(e){}


    }

}



/* =====================================================
   PAGE COUNTER
===================================================== */

function updatePageCounter(){


    if(
        !pageFlip ||
        !pdfDocument
    ){
        return;
    }



    const index =

        pageFlip
        .getCurrentPageIndex();



    const total =

        pdfDocument.numPages;



    const mobile =

        window.innerWidth <=
        700;



    const counter =

        document.getElementById(
            "pageCounter"
        );



    /*
    MOBILE
    */


    if(mobile){


        counter.innerText =

            "صفحه " +

            (index + 1) +

            " از " +

            total;


        return;

    }



    /*
    FRONT COVER
    */


    if(index === 0){


        counter.innerText =

            "صفحه 1 از " +

            total;


        return;

    }



    /*
    BACK COVER
    */


    if(
        index >=
        total - 1
    ){


        counter.innerText =

            "صفحه " +

            total +

            " از " +

            total;


        return;

    }



    /*
    DESKTOP SPREAD

    به دلیل RTL:
    عدد اول همان صفحه سمت راست است.
    */


    const rightPage =
        index + 1;



    const leftPage =

        Math.min(

            rightPage + 1,

            total

        );



    counter.innerText =

        "صفحه " +

        rightPage +

        "–" +

        leftPage +

        " از " +

        total;

}



/* =====================================================
   PRIORITY LOAD
===================================================== */

function preloadPriorityPages(
    pageNumber
){


    if(!pdfDocument){
        return;
    }



    const pages = [

        pageNumber,

        pageNumber + 1,

        pageNumber - 1,

        pageNumber + 2

    ];



    pages.forEach(

        function(number){


            if(

                number >= 1
                &&
                number <=
                pdfDocument.numPages

            ){


                renderPage(
                    number
                );


            }


        }

    );

}



/* =====================================================
   SEQUENTIAL LOAD
===================================================== */

async function startSequentialLoading(){


    if(
        !pdfDocument ||
        sequentialLoading
    ){
        return;
    }



    sequentialLoading =
        true;



    const myToken =

        ++sequentialLoadToken;



    /*
    1 قبلاً Render شده.
    بقیه دقیقاً:
    2,3,4,5...
    */


    for(
        let pageNumber=2;
        pageNumber<=pdfDocument.numPages;
        pageNumber++
    ){


        if(
            myToken !==
            sequentialLoadToken
        ){
            break;
        }



        if(!pdfDocument){
            break;
        }



        if(
            !renderedPages.has(
                pageNumber
            )
        ){


            await renderPage(
                pageNumber
            );


        }



        await waitForIdle();


    }



    if(
        myToken ===
        sequentialLoadToken
    ){


        sequentialLoading =
            false;


    }

}



/* =====================================================
   IDLE
===================================================== */

function waitForIdle(){


    return new Promise(

        resolve=>{


            if(
                "requestIdleCallback"
                in window
            ){


                requestIdleCallback(

                    ()=>resolve(),

                    {
                        timeout:120
                    }

                );


            }


            else{


                setTimeout(
                    resolve,
                    35
                );


            }


        }

    );

}



/* =====================================================
   RTL EDGE SWIPE
===================================================== */

const leftEdge =

    document.getElementById(
        "leftEdge"
    );


const rightEdge =

    document.getElementById(
        "rightEdge"
    );



function startEdgeSwipe(
    side,
    event
){


    if(
        event.pointerType ===
        "touch"
        &&
        !event.isPrimary
    ){
        return;
    }



    edgeGesture = {


        side:
            side,


        pointerId:
            event.pointerId,


        startX:
            event.clientX,


        startY:
            event.clientY


    };



    try{


        event.currentTarget
        .setPointerCapture(
            event.pointerId
        );


    }


    catch(e){}



    event.preventDefault();

}



/* =====================================================
   EDGE END
===================================================== */

async function endEdgeSwipe(
    event
){


    if(!edgeGesture){
        return;
    }



    if(
        event.pointerId !==
        edgeGesture.pointerId
    ){
        return;
    }



    const dx =

        event.clientX -

        edgeGesture.startX;



    const dy =

        event.clientY -

        edgeGesture.startY;



    const side =

        edgeGesture.side;



    edgeGesture =
        null;



    /*
    TAP هیچ کاری نکند.
    */


    if(
        Math.abs(dx) <
        30
    ){
        return;
    }



    /*
    حرکت باید افقی باشد.
    */


    if(
        Math.abs(dx) <
        Math.abs(dy) *
        1.2
    ){
        return;
    }



    /*
    RIGHT EDGE
    کشیدن به چپ
    = صفحه بعد
    */


    if(
        side === "right"
        &&
        dx < -30
    ){


        await nextPage();


        return;

    }



    /*
    LEFT EDGE
    کشیدن به راست
    = صفحه قبل
    */


    if(
        side === "left"
        &&
        dx > 30
    ){


        await previousPage();


    }

}



leftEdge.addEventListener(

    "pointerdown",

    event=>

        startEdgeSwipe(
            "left",
            event
        )

);



rightEdge.addEventListener(

    "pointerdown",

    event=>

        startEdgeSwipe(
            "right",
            event
        )

);



leftEdge.addEventListener(

    "pointerup",

    endEdgeSwipe

);



rightEdge.addEventListener(

    "pointerup",

    endEdgeSwipe

);



leftEdge.addEventListener(

    "pointercancel",

    ()=>{

        edgeGesture =
            null;

    }

);



rightEdge.addEventListener(

    "pointercancel",

    ()=>{

        edgeGesture =
            null;

    }

);



/* =====================================================
   PAGE PANEL
===================================================== */

async function togglePagePanel(){


    const panel =

        document.getElementById(
            "pagePanel"
        );



    if(
        panel.style.display ===
        "block"
    ){


        panel.style.display =
            "none";


        return;

    }



    panel.style.display =
        "block";



    if(!thumbnailsBuilt){


        thumbnailsBuilt =
            true;


        await buildThumbnails();


    }



    updateActiveThumbnail();

}



/* =====================================================
   THUMBNAILS
===================================================== */

async function buildThumbnails(){


    if(!pdfDocument){
        return;
    }



    const grid =

        document.getElementById(
            "pageGrid"
        );



    for(
        let i=1;
        i<=pdfDocument.numPages;
        i++
    ){


        const item =

            document.createElement(
                "div"
            );


        item.className =
            "pageThumb";



        const canvas =

            document.createElement(
                "canvas"
            );



        const label =

            document.createElement(
                "div"
            );


        label.className =
            "pageThumbLabel";


        label.innerText =

            "صفحه " + i;



        item.appendChild(
            canvas
        );


        item.appendChild(
            label
        );


        grid.appendChild(
            item
        );


        thumbElements.push(
            item
        );



        item.onclick =

            function(){


                preloadPriorityPages(
                    i
                );


                goToPage(
                    i - 1
                );


                document.getElementById(
                    "pagePanel"
                ).style.display =
                    "none";


            };



        try{


            const page =

                await pdfDocument
                .getPage(
                    i
                );



            const viewport =

                page.getViewport({

                    scale:.14

                });



            canvas.width =

                Math.round(
                    viewport.width
                );



            canvas.height =

                Math.round(
                    viewport.height
                );



            await page.render({

                canvasContext:

                    canvas.getContext(
                        "2d"
                    ),


                viewport:
                    viewport


            }).promise;


        }


        catch(error){}



        await waitForIdle();


    }

}



/* =====================================================
   ACTIVE THUMB
===================================================== */

function updateActiveThumbnail(){


    if(
        !pageFlip ||
        thumbElements.length ===
        0
    ){
        return;
    }



    const index =

        pageFlip
        .getCurrentPageIndex();



    thumbElements.forEach(

        function(
            item,
            i
        ){


            item.classList.toggle(

                "active",

                i === index

            );


        }

    );



    const active =

        thumbElements[index];



    if(active){


        active.scrollIntoView({

            block:"nearest",

            behavior:"smooth"

        });


    }

}



/* =====================================================
   GO TO PAGE
===================================================== */

function goToPage(
    index
){


    if(!pageFlip){
        return;
    }



    preloadPriorityPages(
        index + 1
    );



    try{


        pageFlip.flip(
            index,
            "top"
        );


    }


    catch(error){


        try{


            pageFlip.turnToPage(
                index
            );


        }


        catch(e){}


    }

}



/* =====================================================
   RENDER PAGE
===================================================== */

async function renderPage(
    pageNumber
){


    if(!pdfDocument){
        return;
    }



    if(
        pageNumber < 1
        ||
        pageNumber >
        pdfDocument.numPages
    ){
        return;
    }



    if(
        renderedPages.has(
            pageNumber
        )
    ){
        return;
    }



    if(
        renderingPages.has(
            pageNumber
        )
    ){


        while(
            renderingPages.has(
                pageNumber
            )
        ){


            await new Promise(

                resolve=>

                    setTimeout(
                        resolve,
                        20
                    )

            );


        }


        return;

    }



    renderingPages.add(
        pageNumber
    );



    try{


        const page =

            await pdfDocument
            .getPage(
                pageNumber
            );



        const mobile =

            window.innerWidth <=
            700;



        const pixelRatio =

            Math.min(

                window.devicePixelRatio ||
                1,

                1.35

            );



        const scale =

            mobile
            ? 1.08
            : 1.18;



        const viewport =

            page.getViewport({

                scale:

                    scale *

                    pixelRatio

            });



        const canvas =

            document.createElement(
                "canvas"
            );



        const context =

            canvas.getContext(

                "2d",

                {
                    alpha:false
                }

            );



        canvas.width =

            Math.floor(
                viewport.width
            );



        canvas.height =

            Math.floor(
                viewport.height
            );



        await page.render({

            canvasContext:
                context,


            viewport:
                viewport


        }).promise;



        const target =

            pageElements[
                pageNumber - 1
            ];



        if(target){


            /*
            فقط محتوای pageInner عوض شود.
            */


            const inner =

                target.querySelector(
                    ".pageInner"
                );



            if(inner){


                inner.innerHTML =
                    "";


                inner.appendChild(
                    canvas
                );


            }


        }



        renderedPages.add(
            pageNumber
        );


    }


    catch(error){


        console.error(
            error
        );


    }


    finally{


        renderingPages.delete(
            pageNumber
        );


    }

}



/* =====================================================
   ZOOM
===================================================== */

function zoomIn(){


    zoomValue =

        Math.min(

            2.75,

            zoomValue +
            .25

        );


    applyTransform();

}



function zoomOut(){


    zoomValue =

        Math.max(

            .75,

            zoomValue -
            .25

        );



    if(
        zoomValue <=
        1
    ){


        panX =
            0;


        panY =
            0;


    }



    applyTransform();

}



/* =====================================================
   APPLY TRANSFORM
===================================================== */

function applyTransform(){


    if(
        zoomValue <=
        1
    ){


        panX =
            0;


        panY =
            0;


    }



    document.getElementById(
        "panStage"
    ).style.transform =

        "translate3d(" +

        panX +

        "px," +

        panY +

        "px,0) scale(" +

        zoomValue +

        ")";

}



/* =====================================================
   PAN
===================================================== */

const bookArea =

    document.getElementById(
        "bookArea"
    );



bookArea.addEventListener(

    "pointerdown",

    function(event){


        if(
            event.target.closest(
                ".edgeZone"
            )
        ){
            return;
        }



        if(
            zoomValue <=
            1
        ){
            return;
        }



        if(
            event.pointerType ===
            "touch"
            &&
            !event.isPrimary
        ){
            return;
        }



        dragging =
            true;



        dragPointerId =
            event.pointerId;



        dragStartX =
            event.clientX;



        dragStartY =
            event.clientY;



        dragStartPanX =
            panX;



        dragStartPanY =
            panY;



        try{


            bookArea
            .setPointerCapture(
                event.pointerId
            );


        }


        catch(e){}



        event.preventDefault();

    }

);



bookArea.addEventListener(

    "pointermove",

    function(event){


        if(!dragging){
            return;
        }



        if(pinchActive){
            return;
        }



        if(
            event.pointerId !==
            dragPointerId
        ){
            return;
        }



        panX =

            dragStartPanX +

            (
                event.clientX -
                dragStartX
            );



        panY =

            dragStartPanY +

            (
                event.clientY -
                dragStartY
            );



        applyTransform();



        event.preventDefault();

    }

);



bookArea.addEventListener(

    "pointerup",

    function(event){


        if(
            dragPointerId ===
            event.pointerId
        ){


            dragging =
                false;


            dragPointerId =
                null;


        }

    }

);



bookArea.addEventListener(

    "pointercancel",

    function(){


        dragging =
            false;


        dragPointerId =
            null;


    }

);



/* =====================================================
   PINCH ZOOM
===================================================== */

function getTouchDistance(
    touches
){


    const dx =

        touches[0].clientX -

        touches[1].clientX;



    const dy =

        touches[0].clientY -

        touches[1].clientY;



    return Math.sqrt(

        dx * dx +

        dy * dy

    );

}



bookArea.addEventListener(

    "touchstart",

    function(event){


        if(
            event.target.closest(
                ".edgeZone"
            )
        ){
            return;
        }



        if(
            event.touches.length ===
            2
        ){


            dragging =
                false;


            dragPointerId =
                null;


            pinchActive =
                true;


            pinchStartDistance =

                getTouchDistance(
                    event.touches
                );


            pinchStartZoom =
                zoomValue;


            event.preventDefault();

        }

    },

    {
        passive:false
    }

);



bookArea.addEventListener(

    "touchmove",

    function(event){


        if(
            !pinchActive
            ||
            event.touches.length !==
            2
        ){
            return;
        }



        event.preventDefault();



        const distance =

            getTouchDistance(
                event.touches
            );



        const ratio =

            distance /

            pinchStartDistance;



        zoomValue =

            Math.max(

                .75,

                Math.min(

                    2.75,

                    pinchStartZoom *

                    ratio

                )

            );



        applyTransform();

    },

    {
        passive:false
    }

);



bookArea.addEventListener(

    "touchend",

    function(event){


        if(
            event.touches.length <
            2
        ){


            pinchActive =
                false;


        }

    },

    {
        passive:false
    }

);



bookArea.addEventListener(

    "touchcancel",

    function(){


        pinchActive =
            false;


    }

);


</script>
