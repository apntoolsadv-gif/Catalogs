<!DOCTYPE html>
<html lang="fa">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

<title>Digital Catalog</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:#111;
    font-family:Arial,sans-serif;
    overflow:hidden;
}


/* =================================
   CATALOG SELECT
================================= */

#catalogMenu{

    width:100%;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:24px;
}

.menuBox{

    width:min(430px,92vw);

    text-align:center;

    color:white;
}

.menuBox h1{

    margin:0 0 8px;

    font-size:30px;
}

.menuBox p{

    margin:0 0 30px;

    color:#999;

    font-size:14px;
}

.catalogButton{

    width:100%;

    min-height:78px;

    margin-bottom:16px;

    border:0;

    border-radius:14px;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;
}

.rockman{

    background:#ffc400;

    color:#111;
}

.apn{

    background:#c9141c;

    color:white;
}


/* =================================
   READER
================================= */

#reader{

    display:none;

    width:100%;
    height:100vh;

    position:relative;

    background:#111;
}


/* =================================
   PAGE COUNTER
================================= */

#pageCounter{

    position:fixed;

    top:12px;

    left:50%;

    transform:translateX(-50%);

    z-index:200;

    padding:8px 15px;

    border-radius:8px;

    background:rgba(20,20,20,.82);

    color:white;

    font-size:14px;

    white-space:nowrap;

    box-shadow:
        0 3px 10px
        rgba(0,0,0,.25);
}


/* =================================
   BOOK AREA
================================= */

#bookArea{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:auto;

    padding:
        55px
        50px
        72px;

    overscroll-behavior:none;
}


#bookStage{

    margin:auto;

    display:flex;

    justify-content:center;
    align-items:center;

    transform-origin:center center;

    transition:transform .15s ease;
}


#book{

    margin:auto;
}


/* =================================
   PAGE
================================= */

.page{

    background:white;

    overflow:hidden;
}


.page canvas{

    width:100%;

    height:100%;

    display:block;
}


/* =================================
   PLACEHOLDER
================================= */

.pageLoading{

    width:100%;

    height:100%;

    background:

        linear-gradient(
            110deg,
            #e5e5e5 8%,
            #f5f5f5 18%,
            #e5e5e5 33%
        );

    background-size:200% 100%;

    animation:
        shimmer 1.3s linear infinite;
}


@keyframes shimmer{

    to{

        background-position-x:-200%;
    }
}


/* =================================
   MAIN LOADER
================================= */

#initialLoader{

    position:absolute;

    inset:0;

    z-index:300;

    background:#111;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:14px;
}


.spinner{

    width:36px;

    height:36px;

    border:
        3px solid #444;

    border-top-color:white;

    border-radius:50%;

    animation:
        rotate .75s linear infinite;
}


@keyframes rotate{

    to{

        transform:rotate(360deg);
    }
}


.loaderText{

    color:#aaa;

    font-size:14px;
}


/* =================================
   SIDE ARROWS
================================= */

.sideArrow{

    position:fixed;

    top:50%;

    transform:translateY(-50%);

    z-index:170;

    width:44px;

    height:70px;

    border:0;

    border-radius:10px;

    background:
        rgba(15,15,15,.55);

    color:white;

    font-size:34px;

    cursor:pointer;
}


#prevSide{

    left:8px;
}


#nextSide{

    right:8px;
}


/* =================================
   BOTTOM CONTROLS
================================= */

#bottomBar{

    display:none;

    position:fixed;

    left:50%;

    bottom:12px;

    transform:translateX(-50%);

    z-index:220;

    background:#f4f4f4;

    border-radius:8px;

    overflow:hidden;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.35);
}


.bottomButton{

    width:56px;

    height:48px;

    border:0;

    border-right:1px solid #ddd;

    background:#f4f4f4;

    color:#444;

    font-size:24px;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;
}


.bottomButton:last-child{

    border-right:0;
}


.bottomButton:hover{

    background:#e7e7e7;
}


/* =================================
   PAGE PANEL
================================= */

#pagePanel{

    display:none;

    position:fixed;

    left:50%;

    bottom:72px;

    transform:translateX(-50%);

    width:min(900px,94vw);

    max-height:65vh;

    z-index:210;

    background:#1b1b1b;

    border:
        1px solid #444;

    border-radius:12px;

    padding:14px;

    overflow-y:auto;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.5);
}


#pageGrid{

    display:grid;

    grid-template-columns:

        repeat(
            auto-fill,
            minmax(95px,1fr)
        );

    gap:12px;
}


.pageThumb{

    padding:5px;

    background:#292929;

    border:
        2px solid transparent;

    border-radius:7px;

    cursor:pointer;

    transition:.15s;
}


.pageThumb:hover{

    background:#3a3a3a;

    transform:scale(1.02);
}


.pageThumb.active{

    border-color:white;
}


.pageThumb canvas{

    width:100%;

    display:block;

    background:white;
}


.pageThumbLabel{

    padding-top:5px;

    text-align:center;

    font-size:10px;

    color:#ccc;
}


/* =================================
   MOBILE
================================= */

@media(max-width:700px){


    .menuBox h1{

        font-size:25px;
    }


    .catalogButton{

        min-height:68px;

        font-size:18px;
    }


    #pageCounter{

        top:7px;

        padding:6px 11px;

        font-size:12px;
    }


    #bookArea{

        padding:
            42px
            2px
            64px;
    }


    .sideArrow{

        width:32px;

        height:52px;

        font-size:26px;

        background:
            rgba(15,15,15,.38);
    }


    #prevSide{

        left:0;
    }


    #nextSide{

        right:0;
    }


    #bottomBar{

        bottom:7px;
    }


    .bottomButton{

        width:50px;

        height:44px;

        font-size:22px;
    }


    #pagePanel{

        bottom:60px;

        width:96vw;

        max-height:70vh;

        padding:10px;
    }


    #pageGrid{

        grid-template-columns:
            repeat(3,1fr);

        gap:9px;
    }

}

</style>

</head>


<body>


<!-- =================================
     SELECT
================================= -->

<div id="catalogMenu">

<div class="menuBox">

<h1>
Digital Catalog
</h1>

<p>
Select a catalog
</p>


<button
class="catalogButton rockman"
onclick="openCatalog('Rockman.catalog.pdf')">

ROCKMAN CATALOG

</button>


<button
class="catalogButton apn"
onclick="openCatalog('Apn.catalog.pdf')">

APN CATALOG

</button>

</div>

</div>



<!-- =================================
     READER
================================= -->

<div id="reader">


<div id="pageCounter">

صفحه 1 از 1

</div>



<button
id="prevSide"
class="sideArrow"
onclick="previousPage()">

‹

</button>


<button
id="nextSide"
class="sideArrow"
onclick="nextPage()">

›

</button>



<div id="bookArea">


<div id="initialLoader">


<div class="spinner"></div>


<div class="loaderText">

Opening catalog...

</div>


</div>



<div id="bookStage">


<div id="book"></div>


</div>


</div>


</div>



<!-- =================================
     PAGE THUMB PANEL
================================= -->

<div id="pagePanel">

<div id="pageGrid"></div>

</div>



<!-- =================================
     BOTTOM BAR
================================= -->

<div id="bottomBar">


<button
class="bottomButton"
onclick="zoomOut()">

−

</button>


<button
class="bottomButton"
onclick="togglePagePanel()"
title="Pages">

▦

</button>


<button
class="bottomButton"
onclick="zoomIn()">

+

</button>


</div>



<!-- =================================
     SOUND
================================= -->

<audio
id="pageFlipAudio"
src="./pageflip.mp3?v=50"
preload="auto">
</audio>



<script
src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
</script>


<script
src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js">
</script>



<script>


pdfjsLib.GlobalWorkerOptions.workerSrc =

"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";



let pdfDocument = null;

let pageFlip = null;


let pageElements = [];


let renderedPages =
    new Set();


let renderingPages =
    new Set();


let storedCanvases = {};


let zoomValue = 1;


let lastPageIndex = 0;


let soundUnlocked = false;


let stopBackgroundLoad = false;


let pageRatio = 1.414;


let thumbElements = [];


let thumbnailsBuilt = false;


/* PINCH */

let pinchStartDistance = 0;

let pinchStartZoom = 1;

let isPinching = false;



/* =================================
   AUDIO
================================= */

async function unlockSound(){


    if(soundUnlocked)
        return;


    const audio =

        document.getElementById(
            "pageFlipAudio"
        );


    try{


        audio.muted = true;


        await audio.play();


        audio.pause();


        audio.currentTime = 0;


        audio.muted = false;


        soundUnlocked = true;


    }


    catch(e){


        audio.muted = false;


    }

}



function playFlipSound(){


    const original =

        document.getElementById(
            "pageFlipAudio"
        );


    if(!original)
        return;


    const audio =

        original.cloneNode(true);


    audio.currentTime = 0;


    audio.volume = .8;


    audio.play()
        .catch(()=>{});

}



/* =================================
   OPEN CATALOG
================================= */

async function openCatalog(pdfFile){


    await unlockSound();


    zoomValue = 1;


    stopBackgroundLoad =
        false;


    storedCanvases = {};


    renderedPages.clear();


    renderingPages.clear();


    pageElements = [];


    thumbElements = [];


    thumbnailsBuilt =
        false;


    applyZoom();



    document.getElementById(
        "catalogMenu"
    ).style.display =
        "none";


    document.getElementById(
        "reader"
    ).style.display =
        "block";


    document.getElementById(
        "bottomBar"
    ).style.display =
        "flex";


    document.getElementById(
        "initialLoader"
    ).style.display =
        "flex";


    document.getElementById(
        "pagePanel"
    ).style.display =
        "none";


    document.getElementById(
        "pageGrid"
    ).innerHTML =
        "";



    try{


        pdfDocument =

            await pdfjsLib.getDocument({

                url:
                    pdfFile,

                disableRange:
                    false,

                disableStream:
                    false,

                disableAutoFetch:
                    true

            }).promise;



        const firstPage =

            await pdfDocument
            .getPage(1);



        const firstViewport =

            firstPage
            .getViewport({

                scale:1

            });



        pageRatio =

            firstViewport.height /

            firstViewport.width;



        createPages();



        /*
        Cover first.
        */


        await renderPage(1);



        createBook();



        updatePageCounter();



        document.getElementById(
            "initialLoader"
        ).style.display =
            "none";



        setTimeout(()=>{


            preloadAround(
                2
            );


        },50);



        setTimeout(()=>{


            backgroundLoad();


        },600);


    }


    catch(error){


        console.error(
            error
        );


    }

}



/* =================================
   CREATE PAGES
================================= */

function createPages(){


    const book =

        document.getElementById(
            "book"
        );


    book.innerHTML =
        "";


    pageElements = [];


    for(

        let i=1;

        i<=pdfDocument.numPages;

        i++

    ){


        const page =

            document.createElement(
                "div"
            );


        page.className =
            "page";


        page.dataset.pageNumber =
            i;



        const placeholder =

            document.createElement(
                "div"
            );


        placeholder.className =
            "pageLoading";


        page.appendChild(
            placeholder
        );


        book.appendChild(
            page
        );


        pageElements.push(
            page
        );


    }

}



/* =================================
   CREATE BOOK
================================= */

function createBook(){


    const mobile =

        window.innerWidth <= 700;



    const width =

        mobile
        ? 440
        : 610;



    const height =

        Math.round(

            width *

            pageRatio

        );



    pageFlip =

        new St.PageFlip(

            document.getElementById(
                "book"
            ),

            {


                width:
                    width,


                height:
                    height,


                size:
                    "stretch",



                minWidth:

                    mobile
                    ? 300
                    : 390,


                maxWidth:

                    mobile
                    ? 520
                    : 720,



                minHeight:

                    Math.round(

                        (
                            mobile
                            ? 300
                            : 390
                        )

                        *

                        pageRatio

                    ),



                maxHeight:

                    Math.round(

                        (
                            mobile
                            ? 520
                            : 720
                        )

                        *

                        pageRatio

                    ),



                showCover:
                    true,



                usePortrait:
                    mobile,



                startPage:
                    0,


                autoSize:
                    true,


                drawShadow:
                    true,


                maxShadowOpacity:
                    .45,


                flippingTime:
                    900,


                mobileScrollSupport:
                    false,


                showPageCorners:
                    true


            }

        );



    pageFlip.loadFromHTML(

        document.querySelectorAll(
            ".page"
        )

    );



    lastPageIndex =

        pageFlip
        .getCurrentPageIndex();



    pageFlip.on(

        "flip",

        function(event){


            const index =
                event.data;


            if(
                index !==
                lastPageIndex
            ){


                playFlipSound();


                lastPageIndex =
                    index;


            }


            updatePageCounter();


            updateActiveThumbnail();


            preloadAround(
                index + 1
            );


        }

    );

}



/* =================================
   PAGE COUNTER
================================= */

function updatePageCounter(){


    if(
        !pageFlip ||
        !pdfDocument
    )
        return;



    const index =

        pageFlip
        .getCurrentPageIndex();



    const total =

        pdfDocument.numPages;



    const mobile =

        window.innerWidth <= 700;



    if(
        !mobile &&
        index > 0 &&
        index < total - 1
    ){


        const first =
            index + 1;


        const second =
            Math.min(
                first + 1,
                total
            );


        document.getElementById(
            "pageCounter"
        ).innerText =

            "صفحه " +

            first +

            "–" +

            second +

            " از " +

            total;


    }


    else{


        document.getElementById(
            "pageCounter"
        ).innerText =

            "صفحه " +

            (index + 1) +

            " از " +

            total;


    }

}



/* =================================
   PAGE PANEL
================================= */

async function togglePagePanel(){


    const panel =

        document.getElementById(
            "pagePanel"
        );


    if(
        panel.style.display ===
        "block"
    ){


        panel.style.display =
            "none";


        return;


    }


    panel.style.display =
        "block";


    if(!thumbnailsBuilt){


        thumbnailsBuilt =
            true;


        await buildThumbnails();


    }


    updateActiveThumbnail();

}



/* =================================
   BUILD THUMBNAILS
================================= */

async function buildThumbnails(){


    if(!pdfDocument)
        return;



    const grid =

        document.getElementById(
            "pageGrid"
        );



    for(

        let i=1;

        i<=pdfDocument.numPages;

        i++

    ){


        const item =

            document.createElement(
                "div"
            );


        item.className =
            "pageThumb";


        item.dataset.page =
            i;



        const canvas =

            document.createElement(
                "canvas"
            );



        const label =

            document.createElement(
                "div"
            );


        label.className =
            "pageThumbLabel";


        label.innerText =
            "صفحه " + i;



        item.appendChild(
            canvas
        );


        item.appendChild(
            label
        );


        grid.appendChild(
            item
        );


        thumbElements.push(
            item
        );



        item.onclick =

            function(){


                goToPage(
                    i - 1
                );


                document.getElementById(
                    "pagePanel"
                ).style.display =
                    "none";


            };



        try{


            const page =

                await pdfDocument
                .getPage(i);



            const viewport =

                page.getViewport({

                    scale:.18

                });



            canvas.width =

                Math.round(
                    viewport.width
                );


            canvas.height =

                Math.round(
                    viewport.height
                );



            await page.render({

                canvasContext:

                    canvas.getContext(
                        "2d"
                    ),

                viewport:
                    viewport

            }).promise;


        }


        catch(e){}



        await sleep(15);


    }

}



/* =================================
   ACTIVE THUMB
================================= */

function updateActiveThumbnail(){


    if(
        !pageFlip ||
        thumbElements.length === 0
    )
        return;



    const index =

        pageFlip
        .getCurrentPageIndex();



    thumbElements.forEach(

        (
            item,
            i
        )=>{


            item.classList.toggle(

                "active",

                i === index

            );


        }

    );



    const active =

        thumbElements[index];


    if(active){


        active.scrollIntoView({

            block:"nearest",

            behavior:"smooth"

        });


    }

}



/* =================================
   GO TO PAGE
================================= */

function goToPage(index){


    if(!pageFlip)
        return;


    preloadAround(
        index + 1
    );


    try{


        pageFlip.flip(
            index,
            "top"
        );


    }


    catch(e){


        pageFlip.turnToPage(
            index
        );


    }

}



/* =================================
   RENDER PAGE
================================= */

async function renderPage(number){


    if(!pdfDocument)
        return;


    if(
        number < 1 ||
        number >
        pdfDocument.numPages
    )
        return;


    if(
        renderedPages.has(
            number
        )
    )
        return;


    if(
        renderingPages.has(
            number
        )
    )
        return;



    renderingPages.add(
        number
    );



    try{


        const page =

            await pdfDocument
            .getPage(
                number
            );



        const mobile =

            window.innerWidth <= 700;



        const pixelRatio =

            Math.min(

                window.devicePixelRatio || 1,

                1.4

            );



        const scale =

            mobile
            ? 1.12
            : 1.23;



        const viewport =

            page.getViewport({

                scale:

                    scale *

                    pixelRatio

            });



        const canvas =

            document.createElement(
                "canvas"
            );



        const context =

            canvas.getContext(

                "2d",

                {
                    alpha:false
                }

            );



        canvas.width =

            Math.floor(
                viewport.width
            );


        canvas.height =

            Math.floor(
                viewport.height
            );



        await page.render({

            canvasContext:
                context,

            viewport:
                viewport

        }).promise;



        storedCanvases[
            number
        ] = canvas;



        const target =

            pageElements[
                number - 1
            ];



        if(target){


            target.innerHTML =
                "";


            const visible =

                document.createElement(
                    "canvas"
                );


            visible.width =
                canvas.width;


            visible.height =
                canvas.height;


            visible
            .getContext("2d")
            .drawImage(
                canvas,
                0,
                0
            );


            target.appendChild(
                visible
            );


        }



        renderedPages.add(
            number
        );


    }


    catch(error){


        console.error(
            error
        );


    }


    finally{


        renderingPages.delete(
            number
        );


    }

}



/* =================================
   PRELOAD
================================= */

function preloadAround(page){


    [

        page,

        page + 1,

        page + 2,

        page + 3

    ].forEach(number=>{


        if(

            pdfDocument &&

            number >= 1 &&

            number <=
            pdfDocument.numPages

        ){


            renderPage(
                number
            );


        }


    });

}



/* =================================
   BACKGROUND LOAD
================================= */

async function backgroundLoad(){


    if(!pdfDocument)
        return;


    for(

        let i=1;

        i<=pdfDocument.numPages;

        i++

    ){


        if(
            stopBackgroundLoad
        )
            break;


        if(
            !renderedPages.has(i)
        ){


            await renderPage(i);


            await sleep(
                170
            );


        }


    }

}



function sleep(ms){


    return new Promise(

        resolve =>

            setTimeout(
                resolve,
                ms
            )

    );

}



/* =================================
   NEXT
================================= */

async function nextPage(){


    if(!pageFlip)
        return;


    await unlockSound();


    try{


        pageFlip.flipNext(
            "top"
        );


    }


    catch(e){


        pageFlip.flipNext();


    }

}



/* =================================
   PREVIOUS
================================= */

async function previousPage(){


    if(!pageFlip)
        return;


    await unlockSound();


    try{


        pageFlip.flipPrev(
            "top"
        );


    }


    catch(e){


        pageFlip.flipPrev();


    }

}



/* =================================
   ZOOM
================================= */

function zoomIn(){


    if(
        zoomValue >= 2.5
    )
        return;


    zoomValue += .25;


    applyZoom();

}



function zoomOut(){


    if(
        zoomValue <= .75
    )
        return;


    zoomValue -= .25;


    applyZoom();

}



function applyZoom(){


    zoomValue =

        Math.max(

            .75,

            Math.min(
                2.5,
                zoomValue
            )

        );


    document.getElementById(
        "bookStage"
    ).style.transform =

        "scale(" +

        zoomValue +

        ")";

}



/* =================================
   PINCH ZOOM
================================= */

const bookArea =

    document.getElementById(
        "bookArea"
    );



function touchDistance(touches){


    const x =

        touches[0].clientX -

        touches[1].clientX;


    const y =

        touches[0].clientY -

        touches[1].clientY;


    return Math.sqrt(

        x*x +

        y*y

    );

}



bookArea.addEventListener(

    "touchstart",

    function(event){


        if(
            event.touches.length === 2
        ){


            isPinching =
                true;


            pinchStartDistance =

                touchDistance(
                    event.touches
                );


            pinchStartZoom =
                zoomValue;


            event.preventDefault();


        }


    },

    {
        passive:false
    }

);



bookArea.addEventListener(

    "touchmove",

    function(event){


        if(
            !isPinching ||
            event.touches.length !== 2
        )
            return;


        event.preventDefault();


        const distance =

            touchDistance(
                event.touches
            );


        zoomValue =

            pinchStartZoom *

            (
                distance /
                pinchStartDistance
            );


        applyZoom();


    },

    {
        passive:false
    }

);



bookArea.addEventListener(

    "touchend",

    function(event){


        if(
            event.touches.length < 2
        ){


            isPinching =
                false;


        }


    },

    {
        passive:false
    }

);


</script>
