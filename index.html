<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Catalogs</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #101010;
    color: #fff;
    font-family: Arial, sans-serif;
}

body {
    overflow-x: hidden;
}


/* =========================
   HOME
========================= */

#catalogMenu {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
}

.menuBox {
    width: min(430px, 94vw);
    text-align: center;
}

#catalogMenu h1 {
    margin: 0 0 8px;
    font-size: 30px;
}

#catalogMenu p {
    margin: 0 0 35px;
    color: #999;
    font-size: 14px;
}

.catalogButton {
    width: 100%;
    min-height: 82px;

    display: block;

    border: 0;
    border-radius: 14px;

    margin-bottom: 18px;

    font-size: 21px;
    font-weight: bold;

    cursor: pointer;

    transition:
        transform .2s,
        opacity .2s;
}

.catalogButton:hover {
    transform: translateY(-2px);
}

.catalogButton:active {
    transform: scale(.98);
}

.rockman {
    background: #ffc400;
    color: #111;
}

.apn {
    background: #c9141c;
    color: #fff;
}


/* =========================
   READER
========================= */

#reader {
    display: none;

    min-height: 100vh;

    flex-direction: column;
    align-items: center;
}

#toolbar {
    width: 100%;
    min-height: 64px;

    position: relative;
    z-index: 20;

    display: flex;

    justify-content: center;
    align-items: center;

    flex-wrap: wrap;

    gap: 9px;

    padding: 10px 12px;

    background: rgba(15,15,15,.97);

    border-bottom: 1px solid #292929;
}

#toolbar button {
    padding: 9px 14px;

    border-radius: 8px;

    border: 1px solid #414141;

    background: #262626;

    color: white;

    font-size: 14px;

    cursor: pointer;
}

#toolbar button:hover {
    background: #353535;
}

#pageInfo {
    min-width: 95px;

    text-align: center;

    color: #ddd;

    font-size: 14px;
}


/* =========================
   BOOK AREA
========================= */

#bookArea {
    width: 100%;

    flex: 1;

    min-height: calc(100vh - 64px);

    position: relative;

    display: flex;

    justify-content: center;
    align-items: center;

    overflow: hidden;

    padding: 14px;
}

#book {
    margin: auto;
}

.page {
    background: white;
    overflow: hidden;
}

.page canvas {
    width: 100%;
    height: 100%;

    display: block;
}


/* =========================
   PAGE LOADING
========================= */

.pageLoading {
    width: 100%;
    height: 100%;

    background:
        linear-gradient(
            110deg,
            #e7e7e7 8%,
            #f5f5f5 18%,
            #e7e7e7 33%
        );

    background-size: 200% 100%;

    animation: shimmer 1.4s linear infinite;
}

@keyframes shimmer {

    to {
        background-position-x: -200%;
    }

}


/* =========================
   INITIAL LOADER
========================= */

#initialLoader {
    position: absolute;

    inset: 0;

    z-index: 50;

    background: #101010;

    display: flex;

    justify-content: center;
    align-items: center;

    flex-direction: column;

    gap: 15px;
}

.spinner {
    width: 36px;
    height: 36px;

    border: 3px solid #444;

    border-top-color: white;

    border-radius: 50%;

    animation: rotate .8s linear infinite;
}

@keyframes rotate {

    to {
        transform: rotate(360deg);
    }

}

.loaderText {
    color: #aaa;
    font-size: 14px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    #catalogMenu h1 {
        font-size: 25px;
    }

    .catalogButton {
        min-height: 70px;

        font-size: 18px;
    }

    #toolbar {
        min-height: 56px;

        gap: 6px;

        padding: 7px 5px;
    }

    #toolbar button {
        padding: 8px 9px;

        font-size: 12px;
    }

    #pageInfo {
        min-width: 72px;

        font-size: 12px;
    }

    #bookArea {
        min-height: calc(100vh - 56px);

        padding: 4px;
    }

}

</style>
</head>


<body>


<!-- =========================
     HOME
========================= -->

<div id="catalogMenu">

    <div class="menuBox">

        <h1>Digital Catalog</h1>

        <p>Select a catalog</p>


        <button
            class="catalogButton rockman"
            onclick="openCatalog('Rockman.catalog.pdf')">

            ROCKMAN CATALOG

        </button>


        <button
            class="catalogButton apn"
            onclick="openCatalog('Apn.catalog.pdf')">

            APN CATALOG

        </button>

    </div>

</div>



<!-- =========================
     READER
========================= -->

<div id="reader">

    <div id="toolbar">


        <button onclick="goHome()">
            Catalogs
        </button>


        <button onclick="prevPage()">
            ◀
        </button>


        <span id="pageInfo">
            1 / 1
        </span>


        <button onclick="nextPage()">
            ▶
        </button>


        <button onclick="toggleFullscreen()">
            ⛶
        </button>


    </div>



    <div id="bookArea">


        <div id="initialLoader">

            <div class="spinner"></div>

            <div class="loaderText">
                Opening catalog...
            </div>

        </div>


        <div id="book"></div>


    </div>

</div>



<!-- PDF.JS -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<!-- PAGE FLIP -->

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>



<script>


/* =========================
   PDF.JS SETUP
========================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";



let pdfDocument = null;

let pageFlip = null;

let pageElements = [];

let renderedPages = new Set();

let renderingPages = new Set();

let audioContext = null;

let backgroundRenderStopped = false;



/* =========================
   OPEN CATALOG
========================= */

async function openCatalog(pdfFile) {


    /*
    Important:
    this is triggered by the user's click,
    so audio permission is unlocked here.
    */

    unlockAudio();


    document.getElementById("catalogMenu")
        .style.display = "none";


    document.getElementById("reader")
        .style.display = "flex";


    document.getElementById("initialLoader")
        .style.display = "flex";


    document.getElementById("book")
        .innerHTML = "";


    renderedPages.clear();

    renderingPages.clear();

    pageElements = [];

    backgroundRenderStopped = false;



    try {


        const loadingTask =
            pdfjsLib.getDocument({

                url: pdfFile,

                disableRange: false,

                disableStream: false,

                disableAutoFetch: false

            });



        pdfDocument =
            await loadingTask.promise;



        /* Get page proportions */

        const firstPage =
            await pdfDocument.getPage(1);


        const originalViewport =
            firstPage.getViewport({
                scale: 1
            });


        const ratio =
            originalViewport.height /
            originalViewport.width;



        /* Book logical size */

        const pageWidth = 550;

        const pageHeight =
            Math.round(
                pageWidth * ratio
            );



        const book =
            document.getElementById("book");



        /*
        Create lightweight placeholders
        instantly for every page.
        */

        for (
            let i = 0;
            i < pdfDocument.numPages;
            i++
        ) {


            const page =
                document.createElement("div");


            page.className = "page";


            page.dataset.pageNumber =
                i + 1;



            const skeleton =
                document.createElement("div");


            skeleton.className =
                "pageLoading";


            page.appendChild(skeleton);


            book.appendChild(page);


            pageElements.push(page);

        }



        /*
        Only render the first pages
        before showing the catalog.
        */

        const initialPages = [];


        if (pdfDocument.numPages >= 1)
            initialPages.push(renderPage(1));


        if (pdfDocument.numPages >= 2)
            initialPages.push(renderPage(2));


        if (pdfDocument.numPages >= 3)
            initialPages.push(renderPage(3));



        await Promise.all(initialPages);



        /* =========================
           PAGE FLIP
        ========================= */


        pageFlip =
            new St.PageFlip(

                book,

                {

                    width: pageWidth,

                    height: pageHeight,


                    size: "stretch",


                    minWidth: 280,

                    maxWidth: 700,


                    minHeight:
                        Math.round(
                            280 * ratio
                        ),


                    maxHeight:
                        Math.round(
                            700 * ratio
                        ),


                    /*
                    IMPORTANT:
                    cover is shown alone.
                    Interior pages display
                    as a normal two-page book.
                    */

                    showCover: true,


                    /*
                    Desktop:
                    double pages.

                    Mobile:
                    automatically single page.
                    */

                    usePortrait: true,


                    startPage: 0,


                    autoSize: true,


                    drawShadow: true,


                    maxShadowOpacity: 0.42,


                    flippingTime: 780,


                    mobileScrollSupport: false

                }

            );



        pageFlip.loadFromHTML(

            document.querySelectorAll(
                ".page"
            )

        );



        document.getElementById(
            "initialLoader"
        ).style.display = "none";



        updatePageNumber();



        /*
        Prepare pages around the cover.
        */

        preloadAround(1);



        /*
        Every completed page flip
        */

        pageFlip.on(
            "flip",
            function(event) {


                const index =
                    event.data;


                updatePageNumber();


                /*
                Natural page-turn sound
                */

                playPageSound();


                /*
                Prepare nearby pages
                */

                preloadAround(
                    index + 1
                );

            }
        );



        /*
        Render the remaining pages
        gently in background.
        */

        setTimeout(

            backgroundRender,

            900

        );


    }


    catch(error) {


        console.error(error);


        document.getElementById(
            "initialLoader"
        ).innerHTML =

        "<div class='loaderText'>Error loading catalog.</div>";


    }

}



/* =========================
   RENDER ONE PAGE
========================= */

async function renderPage(pageNumber) {


    if (!pdfDocument)
        return;


    if (
        pageNumber < 1 ||
        pageNumber > pdfDocument.numPages
    )
        return;


    if (
        renderedPages.has(pageNumber)
    )
        return;


    if (
        renderingPages.has(pageNumber)
    )
        return;



    renderingPages.add(
        pageNumber
    );



    try {


        const pdfPage =
            await pdfDocument.getPage(
                pageNumber
            );



        /*
        Balanced quality / speed.
        */

        const deviceRatio =
            Math.min(

                window.devicePixelRatio || 1,

                1.4

            );



        const baseScale =

            window.innerWidth <= 700

            ? 1.05

            : 1.22;



        const viewport =
            pdfPage.getViewport({

                scale:

                    baseScale *
                    deviceRatio

            });



        const canvas =
            document.createElement(
                "canvas"
            );


        const context =
            canvas.getContext(

                "2d",

                {
                    alpha: false
                }

            );



        canvas.width =
            Math.floor(
                viewport.width
            );


        canvas.height =
            Math.floor(
                viewport.height
            );



        await pdfPage.render({

            canvasContext:
                context,

            viewport:
                viewport

        }).promise;



        const target =
            pageElements[
                pageNumber - 1
            ];



        if (target) {


            target.innerHTML = "";


            target.appendChild(
                canvas
            );

        }



        renderedPages.add(
            pageNumber
        );


    }


    catch(error) {


        console.error(

            "Page render error:",

            pageNumber,

            error

        );


    }


    finally {


        renderingPages.delete(
            pageNumber
        );


    }

}



/* =========================
   PRELOAD NEAR USER
========================= */

function preloadAround(pageNumber) {


    if (!pdfDocument)
        return;



    const pages = [

        pageNumber - 2,

        pageNumber - 1,

        pageNumber,

        pageNumber + 1,

        pageNumber + 2,

        pageNumber + 3,

        pageNumber + 4

    ];



    pages.forEach(number => {


        if (

            number >= 1 &&

            number <=
                pdfDocument.numPages

        ) {


            renderPage(number);


        }


    });

}



/* =========================
   BACKGROUND RENDER
========================= */

async function backgroundRender() {


    if (!pdfDocument)
        return;



    for (

        let i = 1;

        i <= pdfDocument.numPages;

        i++

    ) {


        if (
            !pdfDocument ||
            backgroundRenderStopped
        )
            break;



        if (
            !renderedPages.has(i)
        ) {


            await renderPage(i);


            /*
            Prevent browser freezing.
            */

            await sleep(110);


        }

    }

}



function sleep(ms) {


    return new Promise(

        resolve =>

            setTimeout(
                resolve,
                ms
            )

    );

}



/* =========================
   PAGE NUMBER
========================= */

function updatePageNumber() {


    if (!pageFlip)
        return;



    const current =
        pageFlip
            .getCurrentPageIndex()
        + 1;



    const total =
        pageFlip
            .getPageCount();



    document.getElementById(
        "pageInfo"
    ).innerText =

        current +
        " / " +
        total;

}



/* =========================
   NEXT
========================= */

function nextPage() {


    if (pageFlip) {


        /*
        Resume audio if browser
        temporarily suspended it.
        */

        unlockAudio();


        pageFlip.flipNext();


    }

}



/* =========================
   PREVIOUS
========================= */

function prevPage() {


    if (pageFlip) {


        unlockAudio();


        pageFlip.flipPrev();


    }

}



/* =========================
   HOME
========================= */

function goHome() {


    backgroundRenderStopped = true;



    if (pageFlip) {


        try {

            pageFlip.destroy();

        }

        catch(e) {}


    }



    pageFlip = null;

    pdfDocument = null;



    renderedPages.clear();

    renderingPages.clear();

    pageElements = [];



    document.getElementById(
        "book"
    ).innerHTML = "";



    document.getElementById(
        "reader"
    ).style.display = "none";



    document.getElementById(
        "catalogMenu"
    ).style.display = "flex";

}



/* =========================
   FULLSCREEN
========================= */

function toggleFullscreen() {


    if (
        !document.fullscreenElement
    ) {


        document
            .documentElement
            .requestFullscreen()
            .catch(() => {});


    }


    else {


        document
            .exitFullscreen()
            .catch(() => {});


    }

}



/* ========================================
   AUDIO INITIALIZATION
======================================== */

function unlockAudio() {


    try {


        if (!audioContext) {


            audioContext =
                new (

                    window.AudioContext ||

                    window.webkitAudioContext

                )();


        }



        if (
            audioContext.state ===
            "suspended"
        ) {


            audioContext.resume();


        }


    }


    catch(error) {


        console.log(
            "Audio unavailable"
        );


    }

}



/* ========================================
   NATURAL PAGE TURN SOUND
======================================== */

function playPageSound() {


    unlockAudio();



    if (!audioContext)
        return;



    const ctx =
        audioContext;


    const now =
        ctx.currentTime;



    /*
    FIRST LAYER
    Fast movement of paper.
    */

    createPaperNoise({

        start:
            now,

        duration:
            0.20,

        volume:
            0.18,

        frequency:
            1600,

        q:
            0.65

    });



    /*
    SECOND LAYER
    Softer lower paper sweep.
    */

    createPaperNoise({

        start:
            now + 0.055,

        duration:
            0.23,

        volume:
            0.11,

        frequency:
            950,

        q:
            0.55

    });



    /*
    THIRD LAYER
    Gentle page landing.
    */

    createPaperNoise({

        start:
            now + 0.18,

        duration:
            0.095,

        volume:
            0.085,

        frequency:
            600,

        q:
            0.75

    });

}



/* ========================================
   PAPER SOUND GENERATOR
======================================== */

function createPaperNoise(settings) {


    const ctx =
        audioContext;



    const duration =
        settings.duration;



    const length =
        Math.floor(

            ctx.sampleRate *
            duration

        );



    const buffer =
        ctx.createBuffer(

            1,

            length,

            ctx.sampleRate

        );



    const data =
        buffer.getChannelData(0);



    let smoothNoise = 0;



    for (

        let i = 0;

        i < length;

        i++

    ) {


        const white =
            Math.random() * 2 - 1;



        /*
        Smooth the random noise.
        Makes it softer and more paper-like.
        */

        smoothNoise =

            smoothNoise * 0.72 +

            white * 0.28;



        const progress =
            i / length;



        /*
        Soft natural envelope.
        */

        let envelope =
            Math.sin(

                Math.PI *
                progress

            );



        envelope =
            Math.pow(
                envelope,
                0.8
            );



        data[i] =

            smoothNoise *

            envelope *

            0.9;

    }



    const source =
        ctx.createBufferSource();



    const filter =
        ctx.createBiquadFilter();



    const gain =
        ctx.createGain();



    filter.type =
        "bandpass";



    filter.frequency
        .setValueAtTime(

            settings.frequency,

            settings.start

        );



    filter.Q
        .setValueAtTime(

            settings.q,

            settings.start

        );



    gain.gain
        .setValueAtTime(

            0.001,

            settings.start

        );



    gain.gain
        .linearRampToValueAtTime(

            settings.volume,

            settings.start + 0.025

        );



    gain.gain
        .exponentialRampToValueAtTime(

            0.001,

            settings.start +
            duration

        );



    source.buffer =
        buffer;



    source.connect(
        filter
    );



    filter.connect(
        gain
    );



    gain.connect(
        ctx.destination
    );



    source.start(
        settings.start
    );



    source.stop(

        settings.start +
        duration +
        0.02

    );

}


</script>

</body>
</html>
