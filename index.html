<html lang="fa">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

<title>Digital Catalogs</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #101010;
    color: #fff;
    font-family: Arial, sans-serif;
}

body {
    overflow: hidden;
}


/* =========================
   HOME
========================= */

#catalogMenu {

    width: 100%;
    height: 100vh;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 30px 20px;
}


.menuBox {

    width: min(430px, 94vw);

    text-align: center;
}


#catalogMenu h1 {

    margin: 0 0 8px;

    font-size: 30px;
}


#catalogMenu p {

    margin: 0 0 35px;

    color: #999;

    font-size: 14px;
}


.catalogButton {

    width: 100%;

    min-height: 82px;

    display: block;

    border: 0;

    border-radius: 14px;

    margin-bottom: 18px;

    font-size: 21px;

    font-weight: bold;

    cursor: pointer;

    transition: transform .2s;
}


.catalogButton:hover {

    transform: translateY(-2px);
}


.catalogButton:active {

    transform: scale(.98);
}


.rockman {

    background: #ffc400;

    color: #111;
}


.apn {

    background: #c9141c;

    color: #fff;
}



/* =========================
   READER
========================= */

#reader {

    display: none;

    width: 100%;

    height: 100vh;

    position: relative;

    background: #101010;
}



/* =========================
   BOOK AREA
========================= */

#bookArea {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: auto;

    padding:

        18px
        58px
        85px;

    transition: padding .25s ease;
}



/* FULLSCREEN */

#reader:fullscreen #bookArea,
#reader:-webkit-full-screen #bookArea {

    padding:

        5px
        45px
        70px;
}



#zoomStage {

    margin: auto;

    display: flex;

    align-items: center;
    justify-content: center;

    transform-origin: center center;

    transition: transform .25s ease;
}


#book {

    margin: auto;
}



/* =========================
   PAGES
========================= */

.page {

    background: white;

    overflow: hidden;
}


.page canvas {

    width: 100%;

    height: 100%;

    display: block;
}



/* =========================
   PAGE PLACEHOLDER
========================= */

.pageLoading {

    width: 100%;

    height: 100%;

    background:

        linear-gradient(

            110deg,

            #e5e5e5 8%,

            #f5f5f5 18%,

            #e5e5e5 33%

        );

    background-size: 200% 100%;

    animation:

        shimmer 1.3s linear infinite;
}


@keyframes shimmer {

    to {

        background-position-x: -200%;
    }
}



/* =========================
   MAIN LOADER
========================= */

#initialLoader {

    position: absolute;

    inset: 0;

    z-index: 80;

    background: #101010;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 14px;
}


.spinner {

    width: 36px;

    height: 36px;

    border:

        3px solid #444;

    border-top-color:

        #fff;

    border-radius: 50%;

    animation:

        rotate .75s linear infinite;
}


@keyframes rotate {

    to {

        transform: rotate(360deg);
    }
}


.loaderText {

    color: #aaa;

    font-size: 14px;
}



/* =========================
   SIDE NAVIGATION
========================= */

.sideArrow {

    position: fixed;

    top: 50%;

    transform: translateY(-50%);

    z-index: 50;

    width: 48px;

    height: 70px;

    border: 0;

    border-radius: 10px;

    background:

        rgba(20,20,20,.58);

    color: white;

    font-size: 34px;

    cursor: pointer;

    transition: .2s;
}


.sideArrow:hover {

    background:

        rgba(50,50,50,.9);
}


#prevSide {

    left: 10px;
}


#nextSide {

    right: 10px;
}



/* =========================
   BOTTOM BAR
========================= */

#bottomBar {

    position: fixed;

    left: 50%;

    bottom: 12px;

    transform: translateX(-50%);

    z-index: 120;

    display: none;

    align-items: center;

    background: #f5f5f5;

    border-radius: 7px;

    box-shadow:

        0 6px 22px
        rgba(0,0,0,.38);

    overflow: visible;
}


.toolButton,
#pageInfo {

    height: 48px;

    min-width: 48px;

    padding: 0;

    border: 0;

    border-right:

        1px solid #ddd;

    background: #f5f5f5;

    color: #555;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;
}


.toolButton {

    font-size: 20px;
}


.toolButton:hover {

    background: #e8e8e8;
}


.toolButton svg {

    width: 20px;

    height: 20px;

    display: block;

    stroke: currentColor;
}


#pageInfo {

    min-width: 74px;

    padding: 0 9px;

    font-size: 12px;

    cursor: default;
}


#moreButton {

    border-right: 0;

    color: #009ecc;

    font-weight: bold;

    font-size: 21px;
}



/* =========================
   MORE MENU
========================= */

#moreMenu {

    display: none;

    position: absolute;

    right: 0;

    bottom: 56px;

    width: 220px;

    background: #fff;

    border-radius: 7px;

    overflow: hidden;

    box-shadow:

        0 7px 25px
        rgba(0,0,0,.40);
}


.moreItem {

    width: 100%;

    min-height: 45px;

    padding: 0 14px;

    border: 0;

    border-bottom:

        1px solid #e8e8e8;

    background: white;

    color: #555;

    display: flex;

    align-items: center;

    justify-content: space-between;

    cursor: pointer;

    font-size: 13px;
}


.moreItem:hover {

    background: #f4f4f4;
}


.moreItem:last-child {

    border-bottom: 0;
}



/* =========================
   THUMBNAILS
========================= */

#thumbPanel {

    display: none;

    position: fixed;

    left: 50%;

    bottom: 72px;

    transform:

        translateX(-50%);

    width:

        min(900px, 94vw);

    max-height: 57vh;

    z-index: 100;

    padding: 14px;

    background: #1b1b1b;

    border:

        1px solid #444;

    border-radius: 10px;

    overflow-y: auto;

    box-shadow:

        0 10px 30px
        rgba(0,0,0,.5);
}


#thumbGrid {

    display: grid;

    grid-template-columns:

        repeat(
            auto-fill,
            minmax(90px,1fr)
        );

    gap: 12px;
}


.thumbItem {

    padding: 5px;

    background: #292929;

    border-radius: 6px;

    cursor: pointer;

    transition: .15s;
}


.thumbItem:hover {

    transform: scale(1.03);

    background: #3a3a3a;
}


.thumbItem canvas {

    width: 100%;

    display: block;

    background: white;
}


.thumbNumber {

    padding-top: 5px;

    text-align: center;

    color: #ccc;

    font-size: 11px;
}



/* =========================
   TOAST
========================= */

#toast {

    display: none;

    position: fixed;

    top: 18px;

    left: 50%;

    transform:

        translateX(-50%);

    z-index: 300;

    padding: 10px 16px;

    border-radius: 7px;

    background: #252525;

    color: white;

    font-size: 13px;
}



/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {


    #catalogMenu h1 {

        font-size: 25px;
    }


    .catalogButton {

        min-height: 70px;

        font-size: 18px;
    }


    #bookArea {

        padding:

            6px
            3px
            72px;
    }


    .sideArrow {

        width: 35px;

        height: 55px;

        font-size: 27px;

        background:

            rgba(20,20,20,.42);
    }


    #prevSide {

        left: 1px;
    }


    #nextSide {

        right: 1px;
    }


    #bottomBar {

        bottom: 7px;

        max-width: 97vw;
    }


    .toolButton,
    #pageInfo {

        height: 44px;

        min-width: 41px;
    }


    #pageInfo {

        min-width: 58px;

        padding: 0 4px;

        font-size: 10px;
    }


    .toolButton svg {

        width: 18px;

        height: 18px;
    }


    #thumbPanel {

        bottom: 61px;

        max-height: 66vh;
    }


    #thumbGrid {

        grid-template-columns:

            repeat(3,1fr);
    }

}

</style>

<script
src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
</script>


<script
src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js">
</script>



<script>


pdfjsLib.GlobalWorkerOptions.workerSrc =

"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";



let pdfDocument = null;

let pageFlip = null;

let currentCatalog = null;


let pageElements = [];

let renderedPages = new Set();

let renderingPages = new Set();


let backgroundRenderStopped = false;


let soundUnlocked = false;

let soundEnabled = true;


let zoomValue = 1;

let fullscreenBoost = 1;


let requestedMode = "auto";


let thumbnailsBuilt = false;


let lastPageIndex = -1;


let pageRatio = 1.414;

let pageWidth = 550;

let pageHeight = 778;



/* =========================
   SOUND UNLOCK
========================= */

async function unlockSound() {


    if (soundUnlocked)
        return;


    const audio =

        document.getElementById(
            "pageFlipAudio"
        );


    if (!audio)
        return;


    try {


        audio.muted = true;

        audio.volume = .80;


        await audio.play();


        audio.pause();

        audio.currentTime = 0;

        audio.muted = false;


        soundUnlocked = true;


    }


    catch (error) {


        audio.muted = false;


    }

}



/* =========================
   PLAY SOUND
========================= */

function playFlipSound() {


    if (!soundEnabled)
        return;


    const source =

        document.getElementById(
            "pageFlipAudio"
        );


    if (!source)
        return;


    const audio =

        source.cloneNode(true);


    audio.volume = .8;

    audio.currentTime = 0;


    audio.play()

        .catch(() => {});

}



/* =========================
   OPEN CATALOG
========================= */

async function openCatalog(pdfFile) {


    currentCatalog = pdfFile;


    await unlockSound();


    backgroundRenderStopped =
        false;


    thumbnailsBuilt =
        false;


    requestedMode =
        "auto";


    zoomValue =
        1;


    fullscreenBoost =
        1;


    renderedPages.clear();

    renderingPages.clear();


    pageElements = [];


    document.getElementById(
        "thumbGrid"
    ).innerHTML = "";


    document.getElementById(
        "thumbPanel"
    ).style.display = "none";


    document.getElementById(
        "moreMenu"
    ).style.display = "none";


    document.getElementById(
        "catalogMenu"
    ).style.display = "none";


    document.getElementById(
        "reader"
    ).style.display = "block";


    document.getElementById(
        "bottomBar"
    ).style.display = "flex";


    document.getElementById(
        "initialLoader"
    ).style.display = "flex";


    document.getElementById(
        "book"
    ).innerHTML = "";


    applyZoom();



    try {


        const loadingTask =

            pdfjsLib.getDocument({


                url:
                    pdfFile,


                disableRange:
                    false,


                disableStream:
                    false,


                /*
                IMPORTANT:

                Don't automatically fetch
                entire 60-page PDF.
                */

                disableAutoFetch:
                    true


            });



        pdfDocument =

            await loadingTask.promise;



        const firstPage =

            await pdfDocument.getPage(1);



        const viewport =

            firstPage.getViewport({

                scale: 1

            });



        pageRatio =

            viewport.height /

            viewport.width;



        pageWidth = 550;


        pageHeight =

            Math.round(

                pageWidth *

                pageRatio

            );



        createPageElements();



        /*
        SPEED:

        Only the cover must be ready
        before catalog appears.
        */


        await renderPage(1);



        createFlipbook(0);



        document.getElementById(
            "initialLoader"
        ).style.display = "none";



        /*
        Start nearby pages immediately
        after cover is visible.
        */


        setTimeout(() => {


            preloadAround(2);


        }, 30);



        setTimeout(() => {


            backgroundRender();


        }, 400);


    }


    catch (error) {


        console.error(error);


        document.getElementById(
            "initialLoader"
        ).innerHTML =

        "<div class='loaderText'>Error loading catalog.</div>";


    }

}



/* =========================
   CREATE PAGE ELEMENTS
========================= */

function createPageElements() {


    const book =

        document.getElementById(
            "book"
        );


    book.innerHTML = "";


    pageElements = [];


    for (

        let i = 0;

        i < pdfDocument.numPages;

        i++

    ) {


        const page =

            document.createElement(
                "div"
            );


        page.className =
            "page";


        page.dataset.pageNumber =
            i + 1;



        const placeholder =

            document.createElement(
                "div"
            );


        placeholder.className =
            "pageLoading";


        page.appendChild(
            placeholder
        );


        book.appendChild(
            page
        );


        pageElements.push(
            page
        );


    }

}



/* =========================
   CREATE / RECREATE BOOK
========================= */

function createFlipbook(startIndex = 0) {


    if (pageFlip) {


        try {


            pageFlip.destroy();


        }


        catch (e) {}


        pageFlip = null;


    }



    /*
    Recreating PageFlip can modify DOM,
    so rebuild all pages and reconnect
    already-rendered canvases.
    */


    rebuildPageDOM();



    const mobile =

        window.innerWidth <= 700;



    let usePortrait;


    if (
        requestedMode === "single"
    ) {


        usePortrait = true;


    }


    else if (
        requestedMode === "double"
    ) {


        usePortrait = false;


    }


    else {


        /*
        Default:
        mobile single
        desktop double
        */


        usePortrait =
            mobile;


    }



    pageFlip =

        new St.PageFlip(

            document.getElementById(
                "book"
            ),

            {


                width:
                    pageWidth,


                height:
                    pageHeight,


                size:
                    "stretch",



                minWidth:
                    mobile ? 260 : 240,


                maxWidth:
                    760,



                minHeight:

                    Math.round(

                        (mobile ? 260 : 240) *

                        pageRatio

                    ),



                maxHeight:

                    Math.round(

                        760 *

                        pageRatio

                    ),



                showCover:
                    true,



                usePortrait:
                    usePortrait,



                startPage:

                    Math.max(

                        0,

                        Math.min(

                            startIndex,

                            pdfDocument.numPages - 1

                        )

                    ),



                autoSize:
                    true,



                drawShadow:
                    true,



                maxShadowOpacity:
                    .45,



                flippingTime:
                    850,



                mobileScrollSupport:
                    false,



                showPageCorners:
                    true


            }

        );



    pageFlip.loadFromHTML(

        document.querySelectorAll(
            ".page"
        )

    );



    lastPageIndex =

        pageFlip.getCurrentPageIndex();



    updatePageModeLabel();

    updatePageNumber();



    /*
    SOUND:

    Only when actual page index changed.
    Fullscreen / resize / menu / zoom
    cannot trigger page sound.
    */


    pageFlip.on(

        "flip",

        function(event) {


            const newIndex =

                event.data;


            if (
                newIndex !==
                lastPageIndex
            ) {


                playFlipSound();


                lastPageIndex =
                    newIndex;


            }


            updatePageNumber();


            preloadAround(
                newIndex + 1
            );


        }

    );

}



/* =========================
   REBUILD PAGE DOM
========================= */

function rebuildPageDOM() {


    const book =

        document.getElementById(
            "book"
        );


    book.innerHTML = "";


    const newElements = [];


    for (

        let i = 1;

        i <= pdfDocument.numPages;

        i++

    ) {


        const page =

            document.createElement(
                "div"
            );


        page.className =
            "page";


        page.dataset.pageNumber =
            i;



        if (
            renderedPages.has(i) &&
            window.renderedCanvasStore &&
            window.renderedCanvasStore[i]
        ) {


            const storedCanvas =

                window.renderedCanvasStore[i];


            const clone =

                document.createElement(
                    "canvas"
                );


            clone.width =
                storedCanvas.width;


            clone.height =
                storedCanvas.height;


            clone.getContext("2d")
                .drawImage(
                    storedCanvas,
                    0,
                    0
                );


            page.appendChild(
                clone
            );


        }


        else {


            const placeholder =

                document.createElement(
                    "div"
                );


            placeholder.className =
                "pageLoading";


            page.appendChild(
                placeholder
            );


        }


        book.appendChild(
            page
        );


        newElements.push(
            page
        );


    }


    pageElements =
        newElements;

}



/* =========================
   RENDER PAGE
========================= */

async function renderPage(pageNumber) {


    if (!pdfDocument)
        return;


    if (

        pageNumber < 1 ||

        pageNumber >
            pdfDocument.numPages

    )
        return;


    if (
        renderedPages.has(
            pageNumber
        )
    )
        return;


    if (
        renderingPages.has(
            pageNumber
        )
    )
        return;



    renderingPages.add(
        pageNumber
    );



    try {


        const pdfPage =

            await pdfDocument.getPage(
                pageNumber
            );



        const deviceRatio =

            Math.min(

                window.devicePixelRatio || 1,

                1.35

            );



        /*
        Enough for zoom,
        lighter than previous versions.
        */


        const baseScale =

            window.innerWidth <= 700

            ? 1.05

            : 1.18;



        const viewport =

            pdfPage.getViewport({

                scale:

                    baseScale *

                    deviceRatio

            });



        const canvas =

            document.createElement(
                "canvas"
            );



        const ctx =

            canvas.getContext(

                "2d",

                {
                    alpha: false
                }

            );



        canvas.width =

            Math.floor(
                viewport.width
            );


        canvas.height =

            Math.floor(
                viewport.height
            );



        await pdfPage.render({

            canvasContext:
                ctx,

            viewport:
                viewport

        }).promise;



        if (
            !window.renderedCanvasStore
        ) {


            window.renderedCanvasStore =
                {};


        }



        window.renderedCanvasStore[
            pageNumber
        ] = canvas;



        const target =

            pageElements[
                pageNumber - 1
            ];



        if (target) {


            target.innerHTML = "";


            const clone =

                document.createElement(
                    "canvas"
                );


            clone.width =
                canvas.width;


            clone.height =
                canvas.height;


            clone.getContext("2d")
                .drawImage(
                    canvas,
                    0,
                    0
                );


            target.appendChild(
                clone
            );


        }



        renderedPages.add(
            pageNumber
        );


    }


    catch (error) {


        console.error(

            "Page render error",

            pageNumber,

            error

        );


    }


    finally {


        renderingPages.delete(
            pageNumber
        );


    }

}



/* =========================
   PRELOAD
========================= */

function preloadAround(pageNumber) {


    if (!pdfDocument)
        return;



    [


        pageNumber - 1,

        pageNumber,

        pageNumber + 1,

        pageNumber + 2,

        pageNumber + 3


    ].forEach(number => {


        if (

            number >= 1 &&

            number <=
                pdfDocument.numPages

        ) {


            renderPage(number);


        }


    });

}



/* =========================
   BACKGROUND RENDER
========================= */

async function backgroundRender() {


    if (!pdfDocument)
        return;



    for (

        let i = 1;

        i <= pdfDocument.numPages;

        i++

    ) {


        if (

            !pdfDocument ||

            backgroundRenderStopped

        )
            break;



        if (
            !renderedPages.has(i)
        ) {


            await renderPage(i);


            await sleep(140);


        }


    }

}



function sleep(ms) {


    return new Promise(

        resolve =>

            setTimeout(
                resolve,
                ms
            )

    );

}



/* =========================
   NEXT / PREVIOUS
========================= */

async function nextPage() {


    if (!pageFlip)
        return;


    await unlockSound();


    try {


        pageFlip.flipNext(
            "top"
        );


    }


    catch (e) {


        pageFlip.flipNext();


    }

}



async function prevPage() {


    if (!pageFlip)
        return;


    await unlockSound();


    try {


        pageFlip.flipPrev(
            "top"
        );


    }


    catch (e) {


        pageFlip.flipPrev();


    }

}



/* =========================
   PAGE NUMBER
========================= */

function updatePageNumber() {


    if (!pageFlip)
        return;


    const index =

        pageFlip
        .getCurrentPageIndex();


    const total =

        pageFlip
        .getPageCount();


    const orientation =

        pageFlip
        .getOrientation();



    if (

        orientation === "landscape" &&

        index > 0 &&

        index < total - 1

    ) {


        const pageOne =
            index + 1;


        const pageTwo =

            Math.min(

                pageOne + 1,

                total

            );


        document.getElementById(
            "pageInfo"
        ).innerText =

            pageOne +

            "-" +

            pageTwo +

            "/" +

            total;


    }


    else {


        document.getElementById(
            "pageInfo"
        ).innerText =

            (index + 1) +

            "/" +

            total;


    }

}



/* =========================
   SINGLE / DOUBLE PAGE
========================= */

function togglePageMode() {


    if (!pageFlip)
        return;


    closeMenus();


    const currentIndex =

        pageFlip
        .getCurrentPageIndex();



    const orientation =

        pageFlip
        .getOrientation();



    if (
        orientation === "landscape"
    ) {


        requestedMode =
            "single";


    }


    else {


        requestedMode =
            "double";


    }



    /*
    Recreate book using proper
    usePortrait setting.
    */


    createFlipbook(
        currentIndex
    );


    showToast(

        requestedMode === "double"

        ? "Double page mode"

        : "Single page mode"

    );

}



function updatePageModeLabel() {


    const label =

        document.getElementById(
            "pageModeText"
        );


    if (!pageFlip)
        return;


    const orientation =

        pageFlip
        .getOrientation();



    if (
        orientation === "landscape"
    ) {


        label.innerText =
            "Single Page Mode";


    }


    else {


        label.innerText =
            "Double Page Mode";


    }

}



/* =========================
   FIRST PAGE
========================= */

function goFirstPage() {


    closeMenus();


    if (!pageFlip)
        return;


    try {


        pageFlip.flip(
            0,
            "top"
        );


    }


    catch (e) {


        pageFlip.turnToPage(
            0
        );


    }

}



/* =========================
   LAST PAGE
========================= */

function goLastPage() {


    closeMenus();


    if (!pageFlip)
        return;


    const last =

        pageFlip
        .getPageCount() - 1;


    try {


        pageFlip.flip(
            last,
            "top"
        );


    }


    catch (e) {


        pageFlip.turnToPage(
            last
        );


    }

}



/* =========================
   ZOOM
========================= */

function zoomIn() {


    if (
        zoomValue >= 2.5
    )
        return;


    zoomValue += .25;


    applyZoom();

}



function zoomOut() {


    if (
        zoomValue <= .75
    )
        return;


    zoomValue -= .25;


    applyZoom();

}



function resetZoom() {


    zoomValue = 1;


    applyZoom();

}



function applyZoom() {


    const stage =

        document.getElementById(
            "zoomStage"
        );


    if (!stage)
        return;


    const totalScale =

        zoomValue *

        fullscreenBoost;


    stage.style.transform =

        "scale(" +

        totalScale +

        ")";

}



/* =========================
   FULLSCREEN
========================= */

async function toggleFullscreen() {


    closeMenus();


    const reader =

        document.getElementById(
            "reader"
        );


    try {


        if (
            !document.fullscreenElement
        ) {


            await reader
                .requestFullscreen();


        }


        else {


            await document
                .exitFullscreen();


        }


    }


    catch (e) {}


}



function updateFullscreenSize() {


    if (
        document.fullscreenElement
    ) {


        /*
        User requested catalog itself
        to become slightly larger.
        */


        fullscreenBoost =
            1.15;


    }


    else {


        fullscreenBoost =
            1;


    }


    applyZoom();



    /*
    Let PageFlip recalculate layout.
    No sound because page index
    does not change.
    */


    setTimeout(() => {


        if (pageFlip) {


            try {


                pageFlip.update();


            }


            catch (e) {}


        }


    }, 120);

}



document.addEventListener(

    "fullscreenchange",

    updateFullscreenSize

);



/* =========================
   THUMBNAILS
========================= */

async function toggleThumbnails() {


    closeMoreMenu();


    const panel =

        document.getElementById(
            "thumbPanel"
        );


    if (
        panel.style.display ===
        "block"
    ) {


        panel.style.display =
            "none";


        return;


    }


    panel.style.display =
        "block";


    if (!thumbnailsBuilt) {


        thumbnailsBuilt =
            true;


        await buildThumbnails();


    }

}



async function buildThumbnails() {


    if (!pdfDocument)
        return;


    const grid =

        document.getElementById(
            "thumbGrid"
        );


    for (

        let i = 1;

        i <= pdfDocument.numPages;

        i++

    ) {


        const item =

            document.createElement(
                "div"
            );


        item.className =
            "thumbItem";



        const canvas =

            document.createElement(
                "canvas"
            );



        const label =

            document.createElement(
                "div"
            );


        label.className =
            "thumbNumber";


        label.innerText =
            "Page " + i;



        item.appendChild(
            canvas
        );


        item.appendChild(
            label
        );


        grid.appendChild(
            item
        );



        item.onclick =

            function() {


                goToPage(
                    i - 1
                );


                document.getElementById(
                    "thumbPanel"
                ).style.display =
                    "none";


            };



        try {


            const page =

                await pdfDocument
                .getPage(i);


            const viewport =

                page.getViewport({

                    scale: .20

                });



            canvas.width =
                viewport.width;


            canvas.height =
                viewport.height;



            await page.render({

                canvasContext:

                    canvas.getContext(
                        "2d"
                    ),

                viewport:
                    viewport

            }).promise;


        }


        catch (e) {}



        await sleep(25);


    }

}



/* =========================
   GO TO PAGE
========================= */

function goToPage(index) {


    if (!pageFlip)
        return;


    try {


        pageFlip.flip(
            index,
            "top"
        );


    }


    catch (e) {


        pageFlip.turnToPage(
            index
        );


    }

}



/* =========================
   SOUND TOGGLE
========================= */

function toggleSound() {


    soundEnabled =
        !soundEnabled;


    document.getElementById(
        "soundText"
    ).innerText =

        soundEnabled

        ? "Turn off Sound"

        : "Turn on Sound";


    closeMenus();


    showToast(

        soundEnabled

        ? "Sound on"

        : "Sound off"

    );

}



/* =========================
   DOWNLOAD
========================= */

function downloadPDF() {


    closeMenus();


    if (!currentCatalog)
        return;


    const link =

        document.createElement(
            "a"
        );


    link.href =
        currentCatalog;


    link.download =
        currentCatalog;


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();

}



/* =========================
   SHARE
========================= */

async function shareCatalog() {


    closeMenus();


    const url =

        window.location.href;


    try {


        if (
            navigator.share
        ) {


            await navigator.share({

                title:
                    "Digital Catalog",

                url:
                    url

            });


        }


        else {


            await navigator
                .clipboard
                .writeText(url);


            showToast(
                "Link copied"
            );


        }


    }


    catch (e) {}

}



/* =========================
   MORE MENU
========================= */

function toggleMoreMenu() {


    document.getElementById(
        "thumbPanel"
    ).style.display =
        "none";


    const menu =

        document.getElementById(
            "moreMenu"
        );


    menu.style.display =

        menu.style.display ===
        "block"

        ? "none"

        : "block";

}



function closeMoreMenu() {


    document.getElementById(
        "moreMenu"
    ).style.display =
        "none";

}



function closeMenus() {


    closeMoreMenu();


    document.getElementById(
        "thumbPanel"
    ).style.display =
        "none";

}



/* =========================
   RETURN TO CATALOG SELECT
========================= */

function returnToCatalogs() {


    /*
    Separate function so the
    menu button can't fail because
    of destroyed PageFlip state.
    */


    closeMenus();


    backgroundRenderStopped =
        true;



    if (pageFlip) {


        try {


            pageFlip.destroy();


        }


        catch (e) {}


    }



    pageFlip =
        null;


    pdfDocument =
        null;


    currentCatalog =
        null;


    requestedMode =
        "auto";


    lastPageIndex =
        -1;


    renderedPages.clear();

    renderingPages.clear();


    pageElements = [];


    window.renderedCanvasStore =
        {};


    document.getElementById(
        "book"
    ).innerHTML = "";


    document.getElementById(
        "reader"
    ).style.display =
        "none";


    document.getElementById(
        "bottomBar"
    ).style.display =
        "none";


    document.getElementById(
        "catalogMenu"
    ).style.display =
        "flex";


    resetZoom();

}



/* =========================
   TOAST
========================= */

function showToast(text) {


    const toast =

        document.getElementById(
            "toast"
        );


    toast.innerText =
        text;


    toast.style.display =
        "block";


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =

        setTimeout(() => {


            toast.style.display =
                "none";


        }, 1500);

}



/* =========================
   CLICK OUTSIDE MENUS
========================= */

document.addEventListener(

    "click",

    function(event) {


        const bar =

            document.getElementById(
                "bottomBar"
            );


        const thumbs =

            document.getElementById(
                "thumbPanel"
            );


        if (

            !bar.contains(
                event.target
            ) &&

            !thumbs.contains(
                event.target
            )

        ) {


            closeMenus();


        }

    }

);



/* =========================
   RESIZE
========================= */

let resizeTimer;


window.addEventListener(

    "resize",

    function() {


        clearTimeout(
            resizeTimer
        );


        resizeTimer =

            setTimeout(() => {


                /*
                Only automatically switch
                mobile/desktop orientation
                when user has NOT manually
                chosen a page mode.
                */


                if (

                    pageFlip &&

                    requestedMode ===
                    "auto"

                ) {


                    const current =

                        pageFlip
                        .getCurrentPageIndex();


                    createFlipbook(
                        current
                    );


                }


            }, 250);


    }

);


</script>
