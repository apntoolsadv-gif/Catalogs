<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">

<title>Digital Catalog</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:#111;
    font-family:Arial,sans-serif;
    overflow:hidden;
}


/* =========================
   HOME
========================= */

#catalogMenu{
    width:100%;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:24px;
}

.menuBox{
    width:min(430px,92vw);

    text-align:center;
    color:#fff;
}

.menuBox h1{
    margin:0 0 8px;

    font-size:30px;
}

.menuBox p{
    margin:0 0 30px;

    color:#999;

    font-size:14px;
}


/* =========================
   CATALOG BUTTONS
========================= */

.catalogButton{
    width:100%;
    min-height:78px;

    margin-bottom:16px;

    border:0;
    border-radius:14px;

    font-size:21px;
    font-weight:bold;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.catalogButton:active{
    transform:scale(.98);
}

.catalogBtnInner{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:13px;
}

.catalogBtnIcon{
    width:32px;
    height:32px;

    display:flex;
    align-items:center;
    justify-content:center;

    flex:0 0 auto;
}

.catalogBtnIcon svg{
    width:30px;
    height:30px;

    fill:none;
    stroke:currentColor;

    stroke-width:1.9;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.rockman{
    background:#ffc400;
    color:#111;
}

.apn{
    background:#c9141c;
    color:#fff;
}


/* =========================
   READER
========================= */

#reader{
    display:none;

    position:relative;

    width:100%;
    height:100vh;

    background:#111;

    overflow:hidden;
}


/* =========================
   PAGE COUNTER
========================= */

#pageCounter{
    position:fixed;

    top:12px;
    left:50%;

    transform:translateX(-50%);

    z-index:850;

    padding:8px 15px;

    border-radius:8px;

    background:
        rgba(
            20,
            20,
            20,
            .82
        );

    color:#fff;

    font-size:14px;

    white-space:nowrap;

    pointer-events:none;

    user-select:none;
}


/* =========================
   SIDE ARROWS
========================= */

.sideArrow{
    position:fixed;

    top:50%;

    transform:translateY(-50%);

    z-index:900;

    width:46px;
    height:70px;

    border:0;

    border-radius:10px;

    background:
        rgba(
            15,
            15,
            15,
            .60
        );

    color:#fff;

    font-size:35px;
    line-height:1;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    touch-action:manipulation;

    user-select:none;
    -webkit-user-select:none;
}

.sideArrow:hover{
    background:
        rgba(
            40,
            40,
            40,
            .92
        );
}

.sideArrow:active{
    transform:
        translateY(-50%)
        scale(.94);
}

#prevSide{
    left:8px;
}

#nextSide{
    right:8px;
}


/* =========================
   BOOK AREA
========================= */

#bookArea{
    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    padding:
        55px
        56px
        70px;

    touch-action:none;
}


/* =========================
   PAN + ZOOM
========================= */

#panStage{
    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    transform-origin:
        center
        center;

    will-change:transform;

    touch-action:none;
}


/* =========================
   BOOK STAGE
========================= */

#bookStage{
    position:relative;

    display:inline-flex;

    align-items:center;
    justify-content:center;

    width:max-content;
    height:max-content;
}


/* =========================
   BOOK
========================= */

#book{
    margin:auto;

    /*
    خود StPageFlip مستقیماً
    از کاربر gesture نمی‌گیرد
    */

    pointer-events:none;
}


/* =========================
   PAGE
========================= */

.page{
    background:#fff;

    overflow:hidden;
}

.page canvas{
    display:block;

    width:100%;
    height:100%;
}


/* =========================
   EDGE SWIPE ZONES
========================= */

.edgeZone{
    position:absolute;

    top:0;
    bottom:0;

    width:1cm;

    z-index:180;

    background:transparent;

    touch-action:none;
}

#leftEdge{
    left:0;
}

#rightEdge{
    right:0;
}


/* =========================
   PAGE PLACEHOLDER
========================= */

.pageLoading{
    width:100%;
    height:100%;

    background:

        linear-gradient(
            110deg,

            #e5e5e5 8%,

            #f5f5f5 18%,

            #e5e5e5 33%
        );

    background-size:
        200%
        100%;

    animation:
        shimmer
        1.3s
        linear
        infinite;
}

@keyframes shimmer{

    to{
        background-position-x:
            -200%;
    }

}


/* =========================
   INITIAL LOADER
========================= */

#initialLoader{
    position:absolute;

    inset:0;

    z-index:700;

    background:#111;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:14px;
}

.spinner{
    width:36px;
    height:36px;

    border:
        3px
        solid
        #444;

    border-top-color:#fff;

    border-radius:50%;

    animation:
        rotate
        .75s
        linear
        infinite;
}

@keyframes rotate{

    to{
        transform:
            rotate(360deg);
    }

}

.loaderText{
    color:#aaa;

    font-size:14px;
}


/* =========================
   BOTTOM BAR
========================= */

#bottomBar{
    display:none;

    position:fixed;

    left:50%;
    bottom:12px;

    transform:
        translateX(-50%);

    z-index:950;

    background:#f4f4f4;

    border-radius:8px;

    overflow:hidden;

    box-shadow:
        0
        5px
        18px
        rgba(
            0,
            0,
            0,
            .35
        );
}

.bottomButton{
    width:56px;
    height:48px;

    border:0;

    border-right:
        1px
        solid
        #ddd;

    background:#f4f4f4;

    color:#444;

    font-size:24px;

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;

    touch-action:manipulation;

    user-select:none;
    -webkit-user-select:none;
}

.bottomButton:last-child{
    border-right:0;
}

.bottomButton:hover{
    background:#e7e7e7;
}

#switchButton{
    font-size:25px;
    font-weight:bold;
}


/* =========================
   PAGE PANEL
========================= */

#pagePanel{
    display:none;

    position:fixed;

    left:50%;
    bottom:72px;

    transform:
        translateX(-50%);

    width:
        min(
            900px,
            94vw
        );

    max-height:65vh;

    z-index:940;

    background:#1b1b1b;

    border:
        1px
        solid
        #444;

    border-radius:12px;

    padding:14px;

    overflow-y:auto;
    overflow-x:hidden;

    touch-action:pan-y;

    overscroll-behavior:contain;

    box-shadow:
        0
        10px
        35px
        rgba(
            0,
            0,
            0,
            .5
        );
}

#pageGrid{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(
                95px,
                1fr
            )
        );

    gap:12px;
}

.pageThumb{
    padding:5px;

    background:#292929;

    border:
        2px
        solid
        transparent;

    border-radius:7px;

    cursor:pointer;

    touch-action:manipulation;
}

.pageThumb:hover{
    background:#3a3a3a;
}

.pageThumb.active{
    border-color:#fff;
}

.pageThumb canvas{
    width:100%;

    height:auto;

    display:block;

    background:#fff;
}

.pageThumbLabel{
    padding-top:5px;

    text-align:center;

    font-size:10px;

    color:#ccc;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .menuBox h1{
        font-size:25px;
    }

    .catalogButton{
        min-height:68px;

        font-size:19px;
    }

    .catalogBtnIcon{
        width:28px;
        height:28px;
    }

    .catalogBtnIcon svg{
        width:26px;
        height:26px;
    }

    #pageCounter{
        top:7px;

        padding:
            6px
            11px;

        font-size:12px;
    }

    #bookArea{
        padding:
            42px
            36px
            62px;
    }

    .sideArrow{
        width:34px;
        height:56px;

        border-radius:8px;

        font-size:28px;

        background:
            rgba(
                15,
                15,
                15,
                .52
            );
    }

    #prevSide{
        left:1px;
    }

    #nextSide{
        right:1px;
    }

    #bottomBar{
        bottom:7px;
    }

    .bottomButton{
        width:48px;
        height:44px;

        font-size:22px;
    }

    #switchButton{
        font-size:22px;
    }

    #pagePanel{
        bottom:60px;

        width:96vw;

        max-height:70vh;

        padding:10px;
    }

    #pageGrid{
        grid-template-columns:

            repeat(
                3,
                1fr
            );

        gap:9px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HOME MENU
========================= -->

<div id="catalogMenu">

    <div class="menuBox">


        <h1>

        </h1>


        <p>

</div>



<!-- =========================
     READER
========================= -->

<div id="reader">


    <!-- LEFT ARROW -->

    <button
    id="prevSide"
    class="sideArrow"
    onclick="previousPage()"
    aria-label="Previous page">

        ‹

    </button>


    <!-- RIGHT ARROW -->

    <button
    id="nextSide"
    class="sideArrow"
    onclick="nextPage()"
    aria-label="Next page">

        ›

    </button>



    <!-- COUNTER -->

    <div id="pageCounter">

        صفحه 1 از 1

    </div>



    <!-- BOOK AREA -->

    <div id="bookArea">


        <!-- LOADER -->

        <div id="initialLoader">


            <div class="spinner">

</div>



<!-- =========================
     PAGE PANEL
========================= -->

<div id="pagePanel">


    <div id="pageGrid">
    </div>


</div>

     BOTTOM BAR
========================= -->

<div id="bottomBar">


    <!-- ZOOM OUT -->

    <button
    class="bottomButton"
    onclick="zoomOut()"
    aria-label="Zoom out">

        −

    </button>



    <!-- ALL PAGES -->

    <button
    class="bottomButton"
    onclick="togglePagePanel()"

        ▦

    </button>

    <button
    id="switchButton"
    class="bottomButton"
    onclick="switchCatalog()"
    aria-label="Switch catalog"

    class="bottomButton"

<!-- =========================
     PAGE FLIP SOUND
========================= -->

id="pageFlipAudio"
src="./pageflip.mp3"
preload="auto">
</audio>



<!-- =========================
     PDF JS
========================= -->

<script
src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
</script>



<!-- =========================
     PAGE FLIP
========================= -->

<script
src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js">
</script>



<script>


/* =========================
   PDF WORKER
========================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =

"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";



/* =========================
   GLOBAL VARIABLES
========================= */

let pdfDocument =
    null;


let pageFlip =
    null;


let currentCatalog =
    null;


let openRequestId =
    0;


let pageElements =
    [];


let renderedPages =
    new Set();


let renderingPages =
    new Set();


let thumbElements =
    [];


let thumbnailsBuilt =
    false;


let zoomValue =
    1;


let panX =
    0;


let panY =
    0;


let pageRatio =
    1.414;


let lastPageIndex =
    0;


let soundUnlocked =
    false;



/* =========================
   PAN VARIABLES
========================= */

let dragging =
    false;


let dragPointerId =
    null;


let dragStartX =
    0;


let dragStartY =
    0;


let dragStartPanX =
    0;


let dragStartPanY =
    0;



/* =========================
   PINCH VARIABLES
========================= */

let pinchActive =
    false;


let pinchStartDistance =
    0;


let pinchStartZoom =
    1;



/* =========================
   EDGE VARIABLES
========================= */

let edgeGesture =
    null;



/* =========================
   AUDIO
========================= */

async function unlockSound(){


    if(soundUnlocked){
        return;
    }



    const audio =

        document.getElementById(
            "pageFlipAudio"
        );



    if(!audio){
        return;
    }



    try{


        audio.muted =
            true;


        await audio.play();


        audio.pause();


        audio.currentTime =
            0;


        audio.muted =
            false;


        soundUnlocked =
            true;


    }


    catch(error){


        audio.muted =
            false;


    }

}



function playFlipSound(){


    const source =

        document.getElementById(
            "pageFlipAudio"
        );



    if(!source){
        return;
    }



    const audio =

        source.cloneNode(
            true
        );



    audio.currentTime =
        0;



    audio.volume =
        .8;



    audio.play()
        .catch(()=>{});

}



/* =========================
   DESTROY OLD CATALOG
========================= */

function destroyCurrentBook(){


    if(pageFlip){


        try{


            pageFlip.destroy();


        }


        catch(error){}



        pageFlip =
            null;

    }



    if(pdfDocument){


        try{


            pdfDocument.destroy();


        }


        catch(error){}


    }



    pdfDocument =
        null;



    document.getElementById(
        "book"
    ).innerHTML =
        "";



    document.getElementById(
        "pageGrid"
    ).innerHTML =
        "";



    renderedPages.clear();


    renderingPages.clear();



    pageElements =
        [];


    thumbElements =
        [];


    thumbnailsBuilt =
        false;


    edgeGesture =
        null;


    dragging =
        false;


    dragPointerId =
        null;


    pinchActive =
        false;

}



/* =========================
   OPEN CATALOG
========================= */

async function openCatalog(
    catalogName,
    pdfFile
){


    const requestId =

        ++openRequestId;



    currentCatalog =
        catalogName;



    destroyCurrentBook();



    zoomValue =
        1;


    panX =
        0;


    panY =
        0;



    const menu =

        document.getElementById(
            "catalogMenu"
        );



    const reader =

        document.getElementById(
            "reader"
        );



    const bottomBar =

        document.getElementById(
            "bottomBar"
        );



    const pagePanel =

        document.getElementById(
            "pagePanel"
        );



    const loader =

        document.getElementById(
            "initialLoader"
        );



    menu.style.display =
        "none";


    reader.style.display =
        "block";


    bottomBar.style.display =
        "flex";


    pagePanel.style.display =
        "none";



    document.getElementById(
        "pageCounter"
    ).innerText =
        "در حال باز شدن...";



    loader.innerHTML =

        '<div class="spinner"></div>' +

        '<div class="loaderText">Opening...</div>';



    loader.style.display =
        "flex";



    applyTransform();



    /*
    صدا آماده شود،
    بدون اینکه باز شدن PDF
    منتظر آن بماند.
    */

    unlockSound();



    try{


        const loadedPDF =

            await pdfjsLib
            .getDocument({

                url:
                    pdfFile,


                /*
                Range فعال
                */

                disableRange:
                    false,


                /*
                Stream فعال
                */

                disableStream:
                    false,


                /*
                کل PDF از اول
                Auto Fetch نشود.
                */

                disableAutoFetch:
                    true

            })
            .promise;



        /*
        اگر کاربر کاتالوگ را
        عوض کرده باشد،
        این Load قدیمی کنار گذاشته شود.
        */


        if(
            requestId !==
            openRequestId
        ){


            try{


                loadedPDF.destroy();


            }


            catch(e){}



            return;

        }



        pdfDocument =
            loadedPDF;



        /*
        فقط صفحه 1.
        */


        const firstPage =

            await pdfDocument
            .getPage(
                1
            );



        if(
            requestId !==
            openRequestId
        ){
            return;
        }



        const firstViewport =

            firstPage
            .getViewport({

                scale:1

            });



        pageRatio =

            firstViewport.height /

            firstViewport.width;



        createPages();



        /*
        صفحه اول واقعی PDF
        قبل از نمایش کتاب
        رندر شود.
        */


        await renderPage(
            1
        );



        if(
            requestId !==
            openRequestId
        ){
            return;
        }



        createBook();



        updatePageCounter();



        /*
        کتاب آماده است.
        */


        loader.style.display =
            "none";



        /*
        فقط چند صفحه نزدیک
        بعد از باز شدن آماده شوند.
        */


        setTimeout(()=>{


            if(
                requestId ===
                openRequestId
            ){


                preloadAround(
                    1
                );


            }


        },60);


    }


    catch(error){


        if(
            requestId !==
            openRequestId
        ){
            return;
        }



        console.error(
            error
        );



        loader.innerHTML =

            '<div style="' +

            'color:white;' +

            'text-align:center;' +

            'padding:20px;' +

            '">' +

            'خطا در باز شدن کاتالوگ' +

            '</div>';



        loader.style.display =
            "flex";


    }

}



/* =========================
   SWITCH CATALOG
========================= */

function switchCatalog(){


    document.getElementById(
        "pagePanel"
    ).style.display =
        "none";



    /*
    ROCKMAN -> APN
    */


    if(
        currentCatalog ===
        "rockman"
    ){


        openCatalog(

            "apn",

            "Apn.catalog.pdf"

        );


        return;

    }



    /*
    APN -> ROCKMAN
    */


    openCatalog(

        "rockman",

        "Rockman.catalog.pdf"

    );

}



/* =========================
   CREATE PAGES
========================= */

function createPages(){


    const book =

        document.getElementById(
            "book"
        );



    book.innerHTML =
        "";



    pageElements =
        [];



    for(
        let i=1;
        i<=pdfDocument.numPages;
        i++
    ){


        const page =

            document.createElement(
                "div"
            );



        page.className =
            "page";



        page.dataset.pageNumber =
            i;



        const loading =

            document.createElement(
                "div"
            );



        loading.className =
            "pageLoading";



        page.appendChild(
            loading
        );



        book.appendChild(
            page
        );



        pageElements.push(
            page
        );


    }

}



/* =========================
   CREATE BOOK
========================= */

function createBook(){


    const mobile =

        window.innerWidth <=
        700;



    const width =

        mobile
        ? 440
        : 610;



    const height =

        Math.round(

            width *

            pageRatio

        );



    pageFlip =

        new St.PageFlip(

            document.getElementById(
                "book"
            ),

            {


                width:
                    width,


                height:
                    height,


                size:
                    "stretch",


                minWidth:

                    mobile
                    ? 280
                    : 390,


                maxWidth:

                    mobile
                    ? 520
                    : 720,


                minHeight:

                    Math.round(

                        (
                            mobile
                            ? 280
                            : 390
                        )

                        *

                        pageRatio

                    ),


                maxHeight:

                    Math.round(

                        (
                            mobile
                            ? 520
                            : 720
                        )

                        *

                        pageRatio

                    ),


                /*
                جلد اول و آخر
                تک صفحه.
                */

                showCover:
                    true,


                /*
                موبایل تک صفحه.
                دسکتاپ دو صفحه.
                */

                usePortrait:
                    mobile,


                startPage:
                    0,


                autoSize:
                    true,


                drawShadow:
                    true,


                maxShadowOpacity:
                    .45,


                flippingTime:
                    900,


                mobileScrollSupport:
                    true,


                /*
                خود گوشه صفحه
                ورق نزند.
                */

                showPageCorners:
                    false


            }

        );



    pageFlip.loadFromHTML(

        document.querySelectorAll(
            ".page"
        )

    );



    /*
    خود PageFlip هیچ
    تاچ و کلیک مستقیمی نگیرد.
    */

    document.getElementById(
        "book"
    ).style.pointerEvents =
        "none";



    lastPageIndex =

        pageFlip
        .getCurrentPageIndex();



    pageFlip.on(

        "flip",

        function(event){


            const index =
                event.data;



            if(
                index !==
                lastPageIndex
            ){


                playFlipSound();


                lastPageIndex =
                    index;


            }



            /*
            با عوض شدن صفحه
            pan وسط شود.
            Zoom حفظ شود.
            */


            panX =
                0;


            panY =
                0;



            applyTransform();



            updatePageCounter();



            updateActiveThumbnail();



            preloadAround(
                index + 1
            );


        }

    );

}



/* =========================
   NEXT PAGE
========================= */

async function nextPage(){


    if(!pageFlip){
        return;
    }



    await unlockSound();



    try{


        pageFlip.flipNext(
            "top"
        );


    }


    catch(error){


        try{


            pageFlip.flipNext();


        }


        catch(e){}


    }

}



/* =========================
   PREVIOUS PAGE
========================= */

async function previousPage(){


    if(!pageFlip){
        return;
    }



    await unlockSound();



    try{


        pageFlip.flipPrev(
            "top"
        );


    }


    catch(error){


        try{


            pageFlip.flipPrev();


        }


        catch(e){}


    }

}



/* =========================
   PAGE COUNTER
========================= */

function updatePageCounter(){


    if(
        !pageFlip ||
        !pdfDocument
    ){
        return;
    }



    const index =

        pageFlip
        .getCurrentPageIndex();



    const total =

        pdfDocument.numPages;



    const mobile =

        window.innerWidth <=
        700;



    const counter =

        document.getElementById(
            "pageCounter"
        );



    /*
    MOBILE
    */


    if(mobile){


        counter.innerText =

            "صفحه " +

            (index + 1) +

            " از " +

            total;



        return;

    }



    /*
    FIRST COVER
    */


    if(index === 0){


        counter.innerText =

            "صفحه 1 از " +

            total;



        return;

    }



    /*
    LAST COVER
    */


    if(
        index >=
        total - 1
    ){


        counter.innerText =

            "صفحه " +

            total +

            " از " +

            total;



        return;

    }



    /*
    DESKTOP SPREAD
    */


    const first =
        index + 1;



    const second =

        Math.min(

            first + 1,

            total

        );



    counter.innerText =

        "صفحه " +

        first +

        "–" +

        second +

        " از " +

        total;

}



/* =========================
   EDGE SWIPE
========================= */

const leftEdge =

    document.getElementById(
        "leftEdge"
    );



const rightEdge =

    document.getElementById(
        "rightEdge"
    );



function startEdgeSwipe(
    side,
    event
){


    /*
    فقط Pointer اصلی.
    */


    if(
        event.pointerType ===
        "touch"
        &&
        !event.isPrimary
    ){
        return;
    }



    edgeGesture = {


        side:
            side,


        pointerId:
            event.pointerId,


        startX:
            event.clientX,


        startY:
            event.clientY


    };



    try{


        event.currentTarget
        .setPointerCapture(
            event.pointerId
        );


    }


    catch(e){}



    event.preventDefault();

}



/* =========================
   EDGE SWIPE END
========================= */

async function endEdgeSwipe(
    event
){


    if(!edgeGesture){
        return;
    }



    if(
        event.pointerId !==
        edgeGesture.pointerId
    ){
        return;
    }



    const dx =

        event.clientX -

        edgeGesture.startX;



    const dy =

        event.clientY -

        edgeGesture.startY;



    const side =

        edgeGesture.side;



    edgeGesture =
        null;



    /*
    TAP ساده = هیچ کاری نکن
    */


    if(
        Math.abs(dx) <
        30
    ){
        return;
    }



    /*
    حرکت باید افقی باشد.
    */


    if(
        Math.abs(dx) <
        Math.abs(dy) *
        1.2
    ){
        return;
    }



    /*
    RIGHT EDGE
    Swipe Left
    */


    if(
        side === "right"
        &&
        dx < -30
    ){


        await nextPage();



        return;

    }



    /*
    LEFT EDGE
    Swipe Right
    */


    if(
        side === "left"
        &&
        dx > 30
    ){


        await previousPage();


    }

}



leftEdge.addEventListener(

    "pointerdown",

    event =>

        startEdgeSwipe(
            "left",
            event
        )

);



rightEdge.addEventListener(

    "pointerdown",

    event =>

        startEdgeSwipe(
            "right",
            event
        )

);



leftEdge.addEventListener(

    "pointerup",

    endEdgeSwipe

);



rightEdge.addEventListener(

    "pointerup",

    endEdgeSwipe

);



leftEdge.addEventListener(

    "pointercancel",

    ()=>{


        edgeGesture =
            null;


    }

);



rightEdge.addEventListener(

    "pointercancel",

    ()=>{


        edgeGesture =
            null;


    }

);



/* =========================
   PAGE PANEL
========================= */

async function togglePagePanel(){


    const panel =

        document.getElementById(
            "pagePanel"
        );



    if(
        panel.style.display ===
        "block"
    ){


        panel.style.display =
            "none";



        return;

    }



    panel.style.display =
        "block";



    /*
    Thumbnail فقط وقتی
    برای اولین بار کاربر
    ▦ را می‌زند ساخته شود.
    */


    if(!thumbnailsBuilt){


        thumbnailsBuilt =
            true;



        await buildThumbnails();


    }



    updateActiveThumbnail();

}



/* =========================
   BUILD THUMBNAILS
========================= */

async function buildThumbnails(){


    if(!pdfDocument){
        return;
    }



    const grid =

        document.getElementById(
            "pageGrid"
        );



    for(
        let i=1;
        i<=pdfDocument.numPages;
        i++
    ){


        const item =

            document.createElement(
                "div"
            );



        item.className =
            "pageThumb";



        const canvas =

            document.createElement(
                "canvas"
            );



        const label =

            document.createElement(
                "div"
            );



        label.className =
            "pageThumbLabel";



        label.innerText =

            "صفحه " +

            i;



        item.appendChild(
            canvas
        );



        item.appendChild(
            label
        );



        grid.appendChild(
            item
        );



        thumbElements.push(
            item
        );



        /*
        انتخاب مستقیم صفحه.
        */


        item.onclick =

            function(){


                goToPage(
                    i - 1
                );



                document.getElementById(
                    "pagePanel"
                ).style.display =
                    "none";


            };



        try{


            const page =

                await pdfDocument
                .getPage(
                    i
                );



            const viewport =

                page.getViewport({

                    scale:
                        .16

                });



            canvas.width =

                Math.round(
                    viewport.width
                );



            canvas.height =

                Math.round(
                    viewport.height
                );



            await page.render({

                canvasContext:

                    canvas.getContext(
                        "2d"
                    ),


                viewport:
                    viewport


            }).promise;


        }


        catch(error){}



        /*
        UI قفل نشود.
        */


        await sleep(
            12
        );


    }

}



/* =========================
   ACTIVE THUMBNAIL
========================= */

function updateActiveThumbnail(){


    if(
        !pageFlip ||
        thumbElements.length ===
        0
    ){
        return;
    }



    const index =

        pageFlip
        .getCurrentPageIndex();



    thumbElements.forEach(

        function(
            item,
            i
        ){


            item.classList.toggle(

                "active",

                i ===
                index

            );


        }

    );



    const active =

        thumbElements[
            index
        ];



    if(active){


        active.scrollIntoView({

            block:
                "nearest",

            behavior:
                "smooth"

        });


    }

}



/* =========================
   GO TO PAGE
========================= */

function goToPage(
    index
){


    if(!pageFlip){
        return;
    }



    preloadAround(
        index + 1
    );



    try{


        pageFlip.flip(
            index,
            "top"
        );


    }


    catch(error){


        try{


            pageFlip.turnToPage(
                index
            );


        }


        catch(e){}


    }

}



/* =========================
   RENDER PAGE
========================= */

async function renderPage(
    pageNumber
){


    if(!pdfDocument){
        return;
    }



    if(
        pageNumber < 1
        ||
        pageNumber >
        pdfDocument.numPages
    ){
        return;
    }



    if(
        renderedPages.has(
            pageNumber
        )
    ){
        return;
    }



    if(
        renderingPages.has(
            pageNumber
        )
    ){
        return;
    }



    renderingPages.add(
        pageNumber
    );



    try{


        const page =

            await pdfDocument
            .getPage(
                pageNumber
            );



        const mobile =

            window.innerWidth <=
            700;



        /*
        تعادل کیفیت و سرعت.
        */


        const pixelRatio =

            Math.min(

                window.devicePixelRatio ||
                1,

                1.4

            );



        const scale =

            mobile
            ? 1.10
            : 1.20;



        const viewport =

            page.getViewport({

                scale:

                    scale *

                    pixelRatio

            });



        const canvas =

            document.createElement(
                "canvas"
            );



        const context =

            canvas.getContext(

                "2d",

                {
                    alpha:false
                }

            );



        canvas.width =

            Math.floor(
                viewport.width
            );



        canvas.height =

            Math.floor(
                viewport.height
            );



        await page.render({

            canvasContext:
                context,


            viewport:
                viewport


        }).promise;



        const target =

            pageElements[
                pageNumber - 1
            ];



        if(target){


            target.innerHTML =
                "";



            target.appendChild(
                canvas
            );


        }



        renderedPages.add(
            pageNumber
        );


    }


    catch(error){


        console.error(
            error
        );


    }


    finally{


        renderingPages.delete(
            pageNumber
        );


    }

}



/* =========================
   LAZY LOAD
========================= */

function preloadAround(
    pageNumber
){


    /*
    فقط صفحات نزدیک
    صفحه فعلی آماده شوند.
    */


    const pages = [

        pageNumber - 2,

        pageNumber - 1,

        pageNumber,

        pageNumber + 1,

        pageNumber + 2,

        pageNumber + 3

    ];



    pages.forEach(

        function(
            number
        ){


            if(

                pdfDocument
                &&
                number >= 1
                &&
                number <=
                pdfDocument.numPages

            ){


                renderPage(
                    number
                );


            }


        }

    );

}



/* =========================
   SLEEP
========================= */

function sleep(ms){


    return new Promise(

        resolve =>

            setTimeout(
                resolve,
                ms
            )

    );

}



/* =========================
   ZOOM IN
========================= */

function zoomIn(){


    zoomValue =

        Math.min(

            2.75,

            zoomValue +
            .25

        );



    applyTransform();

}



/* =========================
   ZOOM OUT
========================= */

function zoomOut(){


    zoomValue =

        Math.max(

            .75,

            zoomValue -
            .25

        );



    if(
        zoomValue <=
        1
    ){


        panX =
            0;



        panY =
            0;


    }



    applyTransform();

}



/* =========================
   APPLY PAN + ZOOM
========================= */

function applyTransform(){


    if(
        zoomValue <=
        1
    ){


        panX =
            0;



        panY =
            0;


    }



    document.getElementById(
        "panStage"
    ).style.transform =

        "translate3d(" +

        panX +

        "px," +

        panY +

        "px,0) scale(" +

        zoomValue +

        ")";

}



/* =========================
   PAN AREA
========================= */

const bookArea =

    document.getElementById(
        "bookArea"
    );



/* =========================
   PAN START
========================= */

bookArea.addEventListener(

    "pointerdown",

    function(event){


        /*
        اگر از نوار لبه شروع شد
        Pan نکن.
        */


        if(
            event.target.closest(
                ".edgeZone"
            )
        ){
            return;
        }



        /*
        فقط در حالت زوم.
        */


        if(
            zoomValue <=
            1
        ){
            return;
        }



        /*
        Pointer دوم برای Pinch.
        */


        if(
            event.pointerType ===
            "touch"
            &&
            !event.isPrimary
        ){
            return;
        }



        dragging =
            true;



        dragPointerId =
            event.pointerId;



        dragStartX =
            event.clientX;



        dragStartY =
            event.clientY;



        dragStartPanX =
            panX;



        dragStartPanY =
            panY;



        try{


            bookArea
            .setPointerCapture(
                event.pointerId
            );


        }


        catch(e){}



        event.preventDefault();

    }

);



/* =========================
   PAN MOVE
========================= */

bookArea.addEventListener(

    "pointermove",

    function(event){


        if(!dragging){
            return;
        }



        if(pinchActive){
            return;
        }



        if(
            event.pointerId !==
            dragPointerId
        ){
            return;
        }



        panX =

            dragStartPanX +

            (
                event.clientX -

                dragStartX
            );



        panY =

            dragStartPanY +

            (
                event.clientY -

                dragStartY
            );



        applyTransform();



        event.preventDefault();

    }

);



/* =========================
   PAN END
========================= */

bookArea.addEventListener(

    "pointerup",

    function(event){


        if(
            dragPointerId ===
            event.pointerId
        ){


            dragging =
                false;



            dragPointerId =
                null;


        }

    }

);



bookArea.addEventListener(

    "pointercancel",

    function(){


        dragging =
            false;



        dragPointerId =
            null;


    }

);



/* =========================
   PINCH DISTANCE
========================= */

function getTouchDistance(
    touches
){


    const dx =

        touches[0].clientX -

        touches[1].clientX;



    const dy =

        touches[0].clientY -

        touches[1].clientY;



    return Math.sqrt(

        dx * dx +

        dy * dy

    );

}



/* =========================
   PINCH START
========================= */

bookArea.addEventListener(

    "touchstart",

    function(event){


        /*
        لبه‌ها مخصوص ورق.
        */


        if(
            event.target.closest(
                ".edgeZone"
            )
        ){
            return;
        }



        if(
            event.touches.length ===
            2
        ){


            dragging =
                false;



            dragPointerId =
                null;



            pinchActive =
                true;



            pinchStartDistance =

                getTouchDistance(
                    event.touches
                );



            pinchStartZoom =
                zoomValue;



            event.preventDefault();

        }

    },

    {
        passive:false
    }

);



/* =========================
   PINCH MOVE
========================= */

bookArea.addEventListener(

    "touchmove",

    function(event){


        if(
            !pinchActive
            ||
            event.touches.length !==
            2
        ){
            return;
        }



        event.preventDefault();



        const distance =

            getTouchDistance(
                event.touches
            );



        const ratio =

            distance /

            pinchStartDistance;



        zoomValue =

            Math.max(

                .75,

                Math.min(

                    2.75,

                    pinchStartZoom *

                    ratio

                )

            );



        applyTransform();

    },

    {
        passive:false
    }

);



/* =========================
   PINCH END
========================= */

bookArea.addEventListener(

    "touchend",

    function(event){


        if(
            event.touches.length <
            2
        ){


            pinchActive =
                false;


        }

    },

    {
        passive:false
    }

);



bookArea.addEventListener(

    "touchcancel",

    function(){


        pinchActive =
            false;


    }

);


</script>
