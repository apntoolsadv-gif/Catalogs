<!DOCTYPE html>
<html lang="fa">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

<title>Digital Catalogs</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
}


/* =========================
   HOME
========================= */

#catalogMenu{
    width:100%;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:24px;
}

.menuBox{
    width:min(430px,92vw);
    text-align:center;
}

#catalogMenu h1{
    margin:0 0 8px;
    font-size:30px;
}

#catalogMenu p{
    margin:0 0 30px;
    color:#999;
    font-size:14px;
}

.catalogButton{
    width:100%;
    min-height:78px;

    border:0;
    border-radius:14px;

    margin-bottom:16px;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.catalogButton:active{
    transform:scale(.98);
}

.rockman{
    background:#ffc400;
    color:#111;
}

.apn{
    background:#c9141c;
    color:#fff;
}


/* =========================
   READER
========================= */

#reader{
    display:none;

    width:100%;
    height:100vh;

    position:relative;

    background:#111;
}


/* =========================
   BOOK AREA
========================= */

#bookArea{
    position:absolute;
    inset:0;

    display:flex;

    justify-content:center;
    align-items:center;

    overflow:auto;

    padding:
        20px
        55px
        72px;
}

#bookStage{
    display:flex;
    justify-content:center;
    align-items:center;

    margin:auto;

    transform-origin:center center;

    transition:transform .2s ease;
}

#book{
    margin:auto;
}


/* =========================
   PAGE
========================= */

.page{
    background:#fff;
    overflow:hidden;
}

.page canvas{
    display:block;
    width:100%;
    height:100%;
}


/* =========================
   PLACEHOLDER
========================= */

.pageLoading{
    width:100%;
    height:100%;

    background:
        linear-gradient(
            110deg,
            #e4e4e4 8%,
            #f5f5f5 18%,
            #e4e4e4 33%
        );

    background-size:200% 100%;

    animation:shimmer 1.3s linear infinite;
}

@keyframes shimmer{
    to{
        background-position-x:-200%;
    }
}


/* =========================
   LOADER
========================= */

#initialLoader{
    position:absolute;
    inset:0;

    z-index:100;

    background:#111;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    gap:14px;
}

.spinner{
    width:36px;
    height:36px;

    border:3px solid #444;

    border-top-color:#fff;

    border-radius:50%;

    animation:rotate .75s linear infinite;
}

@keyframes rotate{
    to{
        transform:rotate(360deg);
    }
}

.loaderText{
    color:#aaa;
    font-size:14px;
}


/* =========================
   SIDE ARROWS
========================= */

.sideArrow{
    position:fixed;

    top:50%;

    transform:translateY(-50%);

    z-index:50;

    width:46px;
    height:70px;

    border:0;
    border-radius:10px;

    background:rgba(15,15,15,.55);

    color:white;

    font-size:34px;

    cursor:pointer;
}

#prevSide{
    left:9px;
}

#nextSide{
    right:9px;
}


/* =========================
   ZOOM BAR
========================= */

#zoomBar{
    display:none;

    position:fixed;

    left:50%;
    bottom:12px;

    transform:translateX(-50%);

    z-index:120;

    background:#f3f3f3;

    border-radius:8px;

    overflow:hidden;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.35);
}

.zoomButton{
    width:54px;
    height:48px;

    border:0;

    background:#f3f3f3;

    color:#444;

    font-size:26px;

    cursor:pointer;
}

.zoomButton + .zoomButton{
    border-left:1px solid #ddd;
}

.zoomButton:hover{
    background:#e8e8e8;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    #catalogMenu h1{
        font-size:25px;
    }

    .catalogButton{
        min-height:68px;
        font-size:18px;
    }

    #bookArea{
        padding:
            8px
            4px
            68px;
    }

    .sideArrow{
        width:34px;
        height:54px;

        font-size:27px;

        background:rgba(15,15,15,.38);
    }

    #prevSide{
        left:1px;
    }

    #nextSide{
        right:1px;
    }

    #zoomBar{
        bottom:7px;
    }

    .zoomButton{
        width:50px;
        height:44px;

        font-size:24px;
    }

}

</style>

</head>

<body>


<!-- =========================
     HOME
========================= -->

<div id="catalogMenu">

    <div class="menuBox">

        <h1>Digital Catalog</h1>

        <p>Select a catalog</p>

        <button
        class="catalogButton rockman"
        onclick="openCatalog('Rockman.catalog.pdf')">

            ROCKMAN CATALOG

        </button>

        <button
        class="catalogButton apn"
        onclick="openCatalog('Apn.catalog.pdf')">

            APN CATALOG

        </button>

    </div>

</div>



<!-- =========================
     READER
========================= -->

<div id="reader">

    <button
    id="prevSide"
    class="sideArrow"
    onclick="prevPage()">

        ‹

    </button>


    <button
    id="nextSide"
    class="sideArrow"
    onclick="nextPage()">

        ›

    </button>


    <div id="bookArea">


        <div id="initialLoader">

            <div class="spinner"></div>

            <div class="loaderText">
                Opening catalog...
            </div>

        </div>


        <div id="bookStage">

            <div id="book"></div>

        </div>


    </div>

</div>



<!-- =========================
     ZOOM ONLY
========================= -->

<div id="zoomBar">

    <button
    class="zoomButton"
    onclick="zoomOut()">

        −

    </button>


    <button
    class="zoomButton"
    onclick="zoomIn()">

        +

    </button>

</div>



<!-- SOUND -->

<audio
id="pageFlipAudio"
src="./pageflip.mp3?v=20"
preload="auto">
</audio>



<!-- PDF JS -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<!-- PAGE FLIP -->

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>



<script>


pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


let pdfDocument = null;

let pageFlip = null;

let pageElements = [];

let renderedPages = new Set();

let renderingPages = new Set();

let backgroundStopped = false;

let soundUnlocked = false;

let zoomValue = 1;

let currentPageIndex = 0;

let pageRatio = 1.414;

let storedCanvases = {};



/* =========================
   AUDIO
========================= */

async function unlockSound(){

    if(soundUnlocked)
        return;

    const audio =
        document.getElementById(
            "pageFlipAudio"
        );

    try{

        audio.muted = true;

        await audio.play();

        audio.pause();

        audio.currentTime = 0;

        audio.muted = false;

        soundUnlocked = true;

    }

    catch(e){

        audio.muted = false;

    }
}


function playFlipSound(){

    const base =
        document.getElementById(
            "pageFlipAudio"
        );

    if(!base)
        return;

    const sound =
        base.cloneNode(true);

    sound.volume = .8;

    sound.currentTime = 0;

    sound.play()
        .catch(()=>{});
}



/* =========================
   OPEN
========================= */

async function openCatalog(pdfFile){

    await unlockSound();

    backgroundStopped = false;

    zoomValue = 1;

    currentPageIndex = 0;

    storedCanvases = {};

    renderedPages.clear();

    renderingPages.clear();

    pageElements = [];


    document.getElementById(
        "catalogMenu"
    ).style.display = "none";


    document.getElementById(
        "reader"
    ).style.display = "block";


    document.getElementById(
        "zoomBar"
    ).style.display = "flex";


    document.getElementById(
        "initialLoader"
    ).style.display = "flex";


    applyZoom();


    try{


        pdfDocument =

            await pdfjsLib.getDocument({

                url:pdfFile,

                disableRange:false,

                disableStream:false,

                disableAutoFetch:true

            }).promise;



        const firstPage =

            await pdfDocument.getPage(1);



        const firstViewport =

            firstPage.getViewport({
                scale:1
            });



        pageRatio =

            firstViewport.height /

            firstViewport.width;



        createPageDOM();



        /*
        فقط جلد رندر می‌شود.
        بنابراین منتظر صفحه 2 و 3 نمی‌مانیم.
        */


        await renderPage(1);



        createFlipbook(0);



        document.getElementById(
            "initialLoader"
        ).style.display = "none";



        /*
        بعد از اینکه جلد دیده شد،
        صفحات بعدی شروع به آماده شدن می‌کنند.
        */


        setTimeout(()=>{

            preloadPages(2);

        },50);



        setTimeout(()=>{

            backgroundRender();

        },500);


    }

    catch(error){


        console.error(error);


        document.getElementById(
            "initialLoader"
        ).innerHTML =

        "<div class='loaderText'>Error loading catalog.</div>";


    }

}



/* =========================
   CREATE PAGES
========================= */

function createPageDOM(){


    const book =

        document.getElementById(
            "book"
        );


    book.innerHTML = "";


    pageElements = [];


    for(

        let i=1;

        i<=pdfDocument.numPages;

        i++

    ){


        const page =

            document.createElement(
                "div"
            );


        page.className =
            "page";


        page.dataset.pageNumber =
            i;



        const loading =

            document.createElement(
                "div"
            );


        loading.className =
            "pageLoading";


        page.appendChild(
            loading
        );


        book.appendChild(
            page
        );


        pageElements.push(
            page
        );


    }

}



/* =========================
   CREATE FLIPBOOK
========================= */

function createFlipbook(startPage){


    if(pageFlip){


        try{

            pageFlip.destroy();

        }

        catch(e){}


        pageFlip = null;


    }



    rebuildPages();



    const isMobile =

        window.innerWidth <= 700;



    /*
    Desktop page size is intentionally
    larger than before.
    */


    let logicalWidth;


    if(isMobile){


        /*
        Mobile single page fills
        most of screen width.
        */

        logicalWidth =
            430;


    }

    else{


        /*
        Desktop page width.
        Larger and easier to read.
        */

        logicalWidth =
            620;


    }



    const logicalHeight =

        Math.round(

            logicalWidth *

            pageRatio

        );



    pageFlip =

        new St.PageFlip(

            document.getElementById(
                "book"
            ),

            {


                width:
                    logicalWidth,


                height:
                    logicalHeight,


                size:
                    "stretch",



                /*
                Keep book from shrinking
                too aggressively.
                */


                minWidth:

                    isMobile
                    ? 300
                    : 420,


                maxWidth:

                    isMobile
                    ? 520
                    : 760,



                minHeight:

                    Math.round(

                        (
                            isMobile
                            ? 300
                            : 420
                        )

                        *

                        pageRatio

                    ),



                maxHeight:

                    Math.round(

                        (
                            isMobile
                            ? 520
                            : 760
                        )

                        *

                        pageRatio

                    ),



                /*
                Cover and back cover
                stay single.
                */


                showCover:
                    true,



                /*
                Mobile:
                always single page.

                Desktop:
                cover single,
                inside double.
                */


                usePortrait:
                    isMobile,



                startPage:
                    startPage,



                autoSize:
                    true,


                drawShadow:
                    true,


                maxShadowOpacity:
                    .42,


                flippingTime:
                    850,


                mobileScrollSupport:
                    false,


                showPageCorners:
                    true


            }

        );



    pageFlip.loadFromHTML(

        document.querySelectorAll(
            ".page"
        )

    );



    currentPageIndex =

        pageFlip
        .getCurrentPageIndex();



    pageFlip.on(
        "flip",
        function(event){


            const newIndex =
                event.data;


            if(
                newIndex !==
                currentPageIndex
            ){


                playFlipSound();


                currentPageIndex =
                    newIndex;


            }


            preloadPages(
                newIndex + 1
            );


        }
    );

}



/* =========================
   REBUILD PAGES
========================= */

function rebuildPages(){


    const book =

        document.getElementById(
            "book"
        );


    book.innerHTML = "";


    const newElements = [];


    for(

        let i=1;

        i<=pdfDocument.numPages;

        i++

    ){


        const page =

            document.createElement(
                "div"
            );


        page.className =
            "page";


        page.dataset.pageNumber =
            i;



        if(
            storedCanvases[i]
        ){


            const source =
                storedCanvases[i];


            const canvas =

                document.createElement(
                    "canvas"
                );


            canvas.width =
                source.width;


            canvas.height =
                source.height;


            canvas
            .getContext("2d")
            .drawImage(
                source,
                0,
                0
            );


            page.appendChild(
                canvas
            );


        }

        else{


            const loading =

                document.createElement(
                    "div"
                );


            loading.className =
                "pageLoading";


            page.appendChild(
                loading
            );


        }


        book.appendChild(
            page
        );


        newElements.push(
            page
        );


    }


    pageElements =
        newElements;

}



/* =========================
   RENDER PAGE
========================= */

async function renderPage(pageNumber){


    if(!pdfDocument)
        return;


    if(
        pageNumber < 1 ||
        pageNumber >
        pdfDocument.numPages
    )
        return;


    if(
        renderedPages.has(
            pageNumber
        )
    )
        return;


    if(
        renderingPages.has(
            pageNumber
        )
    )
        return;



    renderingPages.add(
        pageNumber
    );



    try{


        const pdfPage =

            await pdfDocument.getPage(
                pageNumber
            );



        const mobile =

            window.innerWidth <= 700;



        const pixelRatio =

            Math.min(

                window.devicePixelRatio || 1,

                1.4

            );



        const renderScale =

            mobile
            ? 1.15
            : 1.25;



        const viewport =

            pdfPage.getViewport({

                scale:

                    renderScale *

                    pixelRatio

            });



        const canvas =

            document.createElement(
                "canvas"
            );



        const ctx =

            canvas.getContext(

                "2d",

                {
                    alpha:false
                }

            );



        canvas.width =

            Math.floor(
                viewport.width
            );


        canvas.height =

            Math.floor(
                viewport.height
            );



        await pdfPage.render({

            canvasContext:
                ctx,

            viewport:
                viewport

        }).promise;



        storedCanvases[
            pageNumber
        ] = canvas;



        const target =

            pageElements[
                pageNumber - 1
            ];



        if(target){


            target.innerHTML =
                "";


            const visible =

                document.createElement(
                    "canvas"
                );


            visible.width =
                canvas.width;


            visible.height =
                canvas.height;


            visible
            .getContext("2d")
            .drawImage(
                canvas,
                0,
                0
            );


            target.appendChild(
                visible
            );


        }



        renderedPages.add(
            pageNumber
        );


    }


    catch(error){


        console.error(
            error
        );


    }


    finally{


        renderingPages.delete(
            pageNumber
        );


    }

}



/* =========================
   PRELOAD AROUND PAGE
========================= */

function preloadPages(pageNumber){


    if(!pdfDocument)
        return;


    [

        pageNumber,

        pageNumber + 1,

        pageNumber + 2,

        pageNumber + 3

    ]

    .forEach(number=>{


        if(
            number >= 1 &&
            number <=
            pdfDocument.numPages
        ){


            renderPage(
                number
            );


        }


    });

}



/* =========================
   BACKGROUND LOAD
========================= */

async function backgroundRender(){


    if(!pdfDocument)
        return;


    for(

        let i=1;

        i<=pdfDocument.numPages;

        i++

    ){


        if(
            backgroundStopped
        )
            break;


        if(
            !renderedPages.has(i)
        ){


            await renderPage(i);


            await sleep(160);


        }


    }

}



function sleep(ms){


    return new Promise(

        resolve =>

            setTimeout(
                resolve,
                ms
            )

    );

}



/* =========================
   NEXT
========================= */

async function nextPage(){


    if(!pageFlip)
        return;


    await unlockSound();


    try{


        pageFlip.flipNext(
            "top"
        );


    }

    catch(e){


        pageFlip.flipNext();


    }

}



/* =========================
   PREVIOUS
========================= */

async function prevPage(){


    if(!pageFlip)
        return;


    await unlockSound();


    try{


        pageFlip.flipPrev(
            "top"
        );


    }

    catch(e){


        pageFlip.flipPrev();


    }

}



/* =========================
   ZOOM
========================= */

function zoomIn(){


    if(
        zoomValue >= 2.25
    )
        return;


    zoomValue += .25;


    applyZoom();

}



function zoomOut(){


    if(
        zoomValue <= .75
    )
        return;


    zoomValue -= .25;


    applyZoom();

}



function applyZoom(){


    document.getElementById(
        "bookStage"
    ).style.transform =

        "scale(" +

        zoomValue +

        ")";

}



/* =========================
   RESPONSIVE
========================= */

let resizeTimer;


window.addEventListener(
    "resize",
    function(){


        clearTimeout(
            resizeTimer
        );


        resizeTimer =

            setTimeout(()=>{


                if(
                    !pageFlip ||
                    !pdfDocument
                )
                    return;


                const current =

                    pageFlip
                    .getCurrentPageIndex();


                createFlipbook(
                    current
                );


            },250);


    }
);


</script>

</body>
</html>
