<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Catalogs</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #101010;
    font-family: Arial, sans-serif;
    color: white;
}

body {
    overflow-x: hidden;
}

/* =========================
   HOME
========================= */

#catalogMenu {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 30px 20px;
}

.menuBox {
    width: min(430px, 94vw);
    text-align: center;
}

#catalogMenu h1 {
    font-size: 30px;
    margin: 0 0 8px;
}

#catalogMenu p {
    margin: 0 0 35px;
    color: #999;
    font-size: 14px;
}

.catalogButton {
    display: block;
    width: 100%;
    min-height: 82px;
    border: 0;
    border-radius: 14px;
    margin-bottom: 18px;
    font-size: 21px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .2s, opacity .2s;
}

.catalogButton:hover {
    transform: translateY(-2px);
}

.catalogButton:active {
    transform: scale(.98);
}

.rockman {
    background: #ffc400;
    color: #111;
}

.apn {
    background: #c9141c;
    color: white;
}


/* =========================
   READER
========================= */

#reader {
    display: none;
    min-height: 100vh;
    flex-direction: column;
    align-items: center;
}

#toolbar {
    position: relative;
    z-index: 20;
    width: 100%;
    min-height: 64px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
    padding: 10px 12px;
    background: rgba(15,15,15,.96);
    border-bottom: 1px solid #292929;
}

#toolbar button {
    background: #262626;
    color: white;
    border: 1px solid #414141;
    border-radius: 8px;
    padding: 9px 14px;
    cursor: pointer;
    font-size: 14px;
}

#toolbar button:hover {
    background: #353535;
}

#pageInfo {
    min-width: 95px;
    text-align: center;
    font-size: 14px;
    color: #ddd;
}

#bookArea {
    width: 100%;
    flex: 1;
    min-height: calc(100vh - 64px);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    padding: 14px;
}

#book {
    margin: auto;
}

.page {
    background: white;
    overflow: hidden;
}

.page canvas {
    display: block;
    width: 100%;
    height: 100%;
}

.pageLoading {
    width: 100%;
    height: 100%;
    background:
        linear-gradient(
            110deg,
            #e7e7e7 8%,
            #f4f4f4 18%,
            #e7e7e7 33%
        );
    background-size: 200% 100%;
    animation: shimmer 1.4s linear infinite;
}

@keyframes shimmer {
    to {
        background-position-x: -200%;
    }
}

#initialLoader {
    position: absolute;
    z-index: 50;
    inset: 0;
    background: #101010;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 15px;
}

.spinner {
    width: 34px;
    height: 34px;
    border: 3px solid #444;
    border-top-color: white;
    border-radius: 50%;
    animation: rotate .8s linear infinite;
}

@keyframes rotate {
    to {
        transform: rotate(360deg);
    }
}

.loaderText {
    color: #aaa;
    font-size: 14px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    #catalogMenu h1 {
        font-size: 25px;
    }

    .catalogButton {
        min-height: 70px;
        font-size: 18px;
    }

    #toolbar {
        gap: 6px;
        padding: 7px 5px;
        min-height: 56px;
    }

    #toolbar button {
        padding: 8px 9px;
        font-size: 12px;
    }

    #pageInfo {
        min-width: 72px;
        font-size: 12px;
    }

    #bookArea {
        min-height: calc(100vh - 56px);
        padding: 4px;
    }
}
</style>
</head>

<body>


<!-- ======================================
     HOME PAGE
====================================== -->

<div id="catalogMenu">

    <div class="menuBox">

        <h1>Digital Catalog</h1>

        <p>Select a catalog</p>

        <button
            class="catalogButton rockman"
            onclick="openCatalog('Rockman.catalog.pdf')">
            ROCKMAN CATALOG
        </button>

        <button
            class="catalogButton apn"
            onclick="openCatalog('Apn.catalog.pdf')">
            APN CATALOG
        </button>

    </div>

</div>



<!-- ======================================
     CATALOG READER
====================================== -->

<div id="reader">

    <div id="toolbar">

        <button onclick="goHome()">
            Catalogs
        </button>

        <button onclick="prevPage()">
            ◀
        </button>

        <span id="pageInfo">
            Page 1
        </span>

        <button onclick="nextPage()">
            ▶
        </button>

        <button onclick="toggleFullscreen()">
            ⛶
        </button>

    </div>


    <div id="bookArea">

        <div id="initialLoader">

            <div class="spinner"></div>

            <div class="loaderText">
                Opening catalog...
            </div>

        </div>

        <div id="book"></div>

    </div>

</div>



<!-- PDF.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<!-- ST PAGE FLIP -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>



<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


let pdfDocument = null;
let pageFlip = null;

let pageElements = [];
let renderedPages = new Set();
let renderingPages = new Set();

let audioContext = null;

let currentCatalog = null;


/* ======================================
   OPEN CATALOG
====================================== */

async function openCatalog(pdfFile) {

    currentCatalog = pdfFile;

    unlockAudio();

    document.getElementById("catalogMenu").style.display = "none";
    document.getElementById("reader").style.display = "flex";

    document.getElementById("initialLoader").style.display = "flex";

    document.getElementById("book").innerHTML = "";

    renderedPages.clear();
    renderingPages.clear();
    pageElements = [];


    try {

        const loadingTask =
            pdfjsLib.getDocument({
                url: pdfFile,

                /* Allows PDF.js to request pieces when possible */
                disableRange: false,
                disableStream: false,
                disableAutoFetch: false
            });

        pdfDocument = await loadingTask.promise;


        const firstPage =
            await pdfDocument.getPage(1);

        const firstViewport =
            firstPage.getViewport({
                scale: 1
            });


        const originalWidth =
            firstViewport.width;

        const originalHeight =
            firstViewport.height;

        const ratio =
            originalHeight / originalWidth;


        /* Logical page dimensions */

        let pageWidth = 550;
        let pageHeight =
            Math.round(pageWidth * ratio);


        /* Create lightweight blank pages immediately */

        const book =
            document.getElementById("book");

        for (
            let i = 0;
            i < pdfDocument.numPages;
            i++
        ) {

            const page =
                document.createElement("div");

            page.className = "page";

            page.dataset.pageNumber =
                i + 1;

            const skeleton =
                document.createElement("div");

            skeleton.className =
                "pageLoading";

            page.appendChild(skeleton);

            book.appendChild(page);

            pageElements.push(page);

        }


        /*
        Render only first few pages before opening.
        Much faster than rendering all 60 pages.
        */

        await Promise.all([
            renderPage(1),
            renderPage(2),
            renderPage(3)
        ]);


        pageFlip =
            new St.PageFlip(
                book,
                {

                    width: pageWidth,
                    height: pageHeight,

                    size: "stretch",

                    minWidth: 280,
                    maxWidth: 700,

                    minHeight:
                        Math.round(280 * ratio),

                    maxHeight:
                        Math.round(700 * ratio),

                    showCover: true,

                    /*
                    Desktop = double pages.
                    Small screens automatically
                    use portrait/single page.
                    */
                    usePortrait: true,

                    autoSize: true,

                    drawShadow: true,

                    maxShadowOpacity: 0.35,

                    flippingTime: 720,

                    mobileScrollSupport: false,

                    startPage: 0
                }
            );


        pageFlip.loadFromHTML(
            document.querySelectorAll(".page")
        );


        document.getElementById("initialLoader")
            .style.display = "none";


        updatePageNumber();


        /*
        Preload pages near current position.
        */

        preloadAround(1);


        pageFlip.on("flip", function(event) {

            const index =
                event.data;

            updatePageNumber();

            playPageSound();

            /*
            User is now around index + 1
            */

            preloadAround(index + 1);

        });


        /*
        Slowly continue rendering remaining pages
        in the background.
        */

        setTimeout(() => {
            backgroundRender();
        }, 700);


    }

    catch(error) {

        console.error(error);

        document.getElementById(
            "initialLoader"
        ).innerHTML =
        "<div class='loaderText'>Error loading catalog.</div>";

    }

}



/* ======================================
   RENDER A SINGLE PDF PAGE
====================================== */

async function renderPage(pageNumber) {

    if (!pdfDocument)
        return;

    if (
        pageNumber < 1 ||
        pageNumber > pdfDocument.numPages
    )
        return;


    if (renderedPages.has(pageNumber))
        return;


    if (renderingPages.has(pageNumber))
        return;


    renderingPages.add(pageNumber);


    try {

        const pdfPage =
            await pdfDocument.getPage(
                pageNumber
            );


        /*
        Good quality without huge memory use.
        High-DPI screens get a little extra detail.
        */

        const pixelRatio =
            Math.min(
                window.devicePixelRatio || 1,
                1.5
            );


        const baseScale =
            window.innerWidth <= 700
            ? 1.15
            : 1.3;


        const viewport =
            pdfPage.getViewport({
                scale:
                    baseScale *
                    pixelRatio
            });


        const canvas =
            document.createElement("canvas");

        const context =
            canvas.getContext(
                "2d",
                {
                    alpha: false
                }
            );


        canvas.width =
            Math.floor(viewport.width);

        canvas.height =
            Math.floor(viewport.height);


        await pdfPage.render({
            canvasContext: context,
            viewport: viewport
        }).promise;


        const target =
            pageElements[
                pageNumber - 1
            ];


        if (target) {

            target.innerHTML = "";

            target.appendChild(canvas);

        }


        renderedPages.add(
            pageNumber
        );

    }

    catch(error) {

        console.error(
            "Page render error:",
            pageNumber,
            error
        );

    }

    finally {

        renderingPages.delete(
            pageNumber
        );

    }

}



/* ======================================
   PRELOAD NEAR CURRENT PAGE
====================================== */

function preloadAround(pageNumber) {

    if (!pdfDocument)
        return;


    const pagesToLoad = [
        pageNumber - 2,
        pageNumber - 1,
        pageNumber,
        pageNumber + 1,
        pageNumber + 2,
        pageNumber + 3,
        pageNumber + 4
    ];


    pagesToLoad.forEach(number => {

        if (
            number >= 1 &&
            number <= pdfDocument.numPages
        ) {

            renderPage(number);

        }

    });

}



/* ======================================
   BACKGROUND RENDER
====================================== */

async function backgroundRender() {

    if (!pdfDocument)
        return;


    for (
        let i = 1;
        i <= pdfDocument.numPages;
        i++
    ) {

        if (!pdfDocument)
            break;


        if (!renderedPages.has(i)) {

            await renderPage(i);


            /*
            Tiny pause prevents browser freezing
            while 60 pages are rendered.
            */

            await sleep(80);

        }

    }

}


function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );

}



/* ======================================
   PAGE NUMBER
====================================== */

function updatePageNumber() {

    if (!pageFlip)
        return;


    const current =
        pageFlip.getCurrentPageIndex()
        + 1;


    const total =
        pageFlip.getPageCount();


    document.getElementById(
        "pageInfo"
    ).innerText =
        current + " / " + total;

}



/* ======================================
   NAVIGATION
====================================== */

function nextPage() {

    if (pageFlip) {
        pageFlip.flipNext();
    }

}


function prevPage() {

    if (pageFlip) {
        pageFlip.flipPrev();
    }

}



/* ======================================
   RETURN HOME
====================================== */

function goHome() {

    if (pageFlip) {

        try {
            pageFlip.destroy();
        }
        catch(e) {}

    }


    pageFlip = null;
    pdfDocument = null;

    renderedPages.clear();
    renderingPages.clear();

    document.getElementById(
        "book"
    ).innerHTML = "";


    document.getElementById(
        "reader"
    ).style.display = "none";


    document.getElementById(
        "catalogMenu"
    ).style.display = "flex";

}



/* ======================================
   FULLSCREEN
====================================== */

function toggleFullscreen() {

    if (!document.fullscreenElement) {

        document.documentElement
            .requestFullscreen()
            .catch(() => {});

    }

    else {

        document.exitFullscreen()
            .catch(() => {});

    }

}



/* ======================================
   AUDIO INITIALIZATION
====================================== */

function unlockAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }

}



/* ======================================
   NATURAL PAGE FLIP SOUND
====================================== */

function playPageSound() {

    if (!audioContext)
        return;


    const ctx =
        audioContext;

    const now =
        ctx.currentTime;


    /*
    Layer 1:
    soft paper movement
    */

    createPaperNoise(
        now,
        0.17,
        1250,
        0.055
    );


    /*
    Layer 2:
    paper landing
    */

    createPaperNoise(
        now + 0.10,
        0.10,
        720,
        0.035
    );

}



/* ======================================
   CREATE PAPER SOUND
====================================== */

function createPaperNoise(
    start,
    duration,
    frequency,
    volume
) {

    const ctx =
        audioContext;


    const length =
        Math.floor(
            ctx.sampleRate *
            duration
        );


    const buffer =
        ctx.createBuffer(
            1,
            length,
            ctx.sampleRate
        );


    const data =
        buffer.getChannelData(0);


    /*
    Smoothed random noise:
    less harsh than raw white noise.
    */

    let last = 0;


    for (
        let i = 0;
        i < length;
        i++
    ) {

        const white =
            Math.random() * 2 - 1;


        last =
            last * 0.72 +
            white * 0.28;


        const progress =
            i / length;


        const envelope =
            Math.sin(
                Math.PI *
                progress
            );


        data[i] =
            last *
            envelope *
            0.8;

    }


    const source =
        ctx.createBufferSource();


    const filter =
        ctx.createBiquadFilter();


    const gain =
        ctx.createGain();


    filter.type =
        "bandpass";


    filter.frequency
        .setValueAtTime(
            frequency,
            start
        );


    filter.Q
        .setValueAtTime(
            0.65,
            start
        );


    gain.gain
        .setValueAtTime(
            0.001,
            start
        );


    gain.gain
        .linearRampToValueAtTime(
            volume,
            start + 0.025
        );


    gain.gain
        .exponentialRampToValueAtTime(
            0.001,
            start + duration
        );


    source.buffer =
        buffer;


    source.connect(filter);

    filter.connect(gain);

    gain.connect(
        ctx.destination
    );


    source.start(start);

    source.stop(
        start + duration
    );

}

</script>

</body>
</html>
