<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Catalogs</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #101010;
    color: #fff;
    font-family: Arial, sans-serif;
}

body {
    overflow-x: hidden;
}

/* =========================
   HOME
========================= */

#catalogMenu {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
}

.menuBox {
    width: min(430px, 94vw);
    text-align: center;
}

#catalogMenu h1 {
    margin: 0 0 8px;
    font-size: 30px;
}

#catalogMenu p {
    margin: 0 0 35px;
    color: #999;
    font-size: 14px;
}

.catalogButton {
    width: 100%;
    min-height: 82px;
    display: block;
    border: 0;
    border-radius: 14px;
    margin-bottom: 18px;
    font-size: 21px;
    font-weight: bold;
    cursor: pointer;
    transition: transform .2s, opacity .2s;
}

.catalogButton:hover {
    transform: translateY(-2px);
}

.catalogButton:active {
    transform: scale(.98);
}

.rockman {
    background: #ffc400;
    color: #111;
}

.apn {
    background: #c9141c;
    color: #fff;
}

/* =========================
   READER
========================= */

#reader {
    display: none;
    min-height: 100vh;
    flex-direction: column;
    align-items: center;
}

#toolbar {
    width: 100%;
    min-height: 64px;
    position: relative;
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 9px;
    padding: 10px 12px;
    background: rgba(15,15,15,.97);
    border-bottom: 1px solid #292929;
}

#toolbar button {
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid #414141;
    background: #262626;
    color: white;
    font-size: 14px;
    cursor: pointer;
}

#toolbar button:hover {
    background: #353535;
}

#pageInfo {
    min-width: 95px;
    text-align: center;
    color: #ddd;
    font-size: 14px;
}

/* =========================
   BOOK AREA
========================= */

#bookArea {
    width: 100%;
    flex: 1;
    min-height: calc(100vh - 64px);
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    padding: 14px;
}

#book {
    margin: auto;
}

.page {
    background: white;
    overflow: hidden;
}

.page canvas {
    width: 100%;
    height: 100%;
    display: block;
}

/* =========================
   PAGE LOADING
========================= */

.pageLoading {
    width: 100%;
    height: 100%;

    background:
        linear-gradient(
            110deg,
            #e7e7e7 8%,
            #f5f5f5 18%,
            #e7e7e7 33%
        );

    background-size: 200% 100%;
    animation: shimmer 1.4s linear infinite;
}

@keyframes shimmer {
    to {
        background-position-x: -200%;
    }
}

/* =========================
   INITIAL LOADER
========================= */

#initialLoader {
    position: absolute;
    inset: 0;
    z-index: 50;
    background: #101010;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 15px;
}

.spinner {
    width: 36px;
    height: 36px;
    border: 3px solid #444;
    border-top-color: white;
    border-radius: 50%;
    animation: rotate .8s linear infinite;
}

@keyframes rotate {
    to {
        transform: rotate(360deg);
    }
}

.loaderText {
    color: #aaa;
    font-size: 14px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    #catalogMenu h1 {
        font-size: 25px;
    }

    .catalogButton {
        min-height: 70px;
        font-size: 18px;
    }

    #toolbar {
        min-height: 56px;
        gap: 6px;
        padding: 7px 5px;
    }

    #toolbar button {
        padding: 8px 9px;
        font-size: 12px;
    }

    #pageInfo {
        min-width: 72px;
        font-size: 12px;
    }

    #bookArea {
        min-height: calc(100vh - 56px);
        padding: 2px;
    }

}

</style>
</head>

<body>

<div id="catalogMenu">

    <div class="menuBox">

        <h1>Digital Catalog</h1>

        <p>Select a catalog</p>

        <button
            class="catalogButton rockman"
            onclick="openCatalog('Rockman.catalog.pdf')">
            ROCKMAN CATALOG
        </button>

        <button
            class="catalogButton apn"
            onclick="openCatalog('Apn.catalog.pdf')">
            APN CATALOG
        </button>

    </div>

</div>

<div id="reader">

    <div id="toolbar">

        <button onclick="goHome()">Catalogs</button>

        <button onclick="prevPage()">◀</button>

        <span id="pageInfo">1 / 1</span>

        <button onclick="nextPage()">▶</button>

        <button onclick="toggleFullscreen()">⛶</button>

    </div>

    <div id="bookArea">

        <div id="initialLoader">

            <div class="spinner"></div>

            <div class="loaderText">
                Opening catalog...
            </div>

        </div>

        <div id="book"></div>

    </div>

</div>

<audio id="pageFlipAudio" preload="auto">
    <source src="page-flip.mp3" type="audio/mpeg">
</audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


let pdfDocument = null;
let pageFlip = null;

let pageElements = [];

let renderedPages = new Set();
let renderingPages = new Set();

let backgroundRenderStopped = false;


/* =========================
   OPEN CATALOG
========================= */

async function openCatalog(pdfFile) {

    unlockSound();

    document.getElementById("catalogMenu").style.display = "none";
    document.getElementById("reader").style.display = "flex";

    document.getElementById("initialLoader").style.display = "flex";

    document.getElementById("book").innerHTML = "";

    renderedPages.clear();
    renderingPages.clear();

    pageElements = [];

    backgroundRenderStopped = false;

    try {

        const loadingTask =
            pdfjsLib.getDocument({

                url: pdfFile,

                disableRange: false,
                disableStream: false,
                disableAutoFetch: false

            });


        pdfDocument =
            await loadingTask.promise;


        const firstPage =
            await pdfDocument.getPage(1);


        const originalViewport =
            firstPage.getViewport({
                scale: 1
            });


        const ratio =
            originalViewport.height /
            originalViewport.width;


        const pageWidth = 550;

        const pageHeight =
            Math.round(
                pageWidth * ratio
            );


        const book =
            document.getElementById("book");


        for (
            let i = 0;
            i < pdfDocument.numPages;
            i++
        ) {

            const page =
                document.createElement("div");

            page.className = "page";

            page.dataset.pageNumber =
                i + 1;


            const skeleton =
                document.createElement("div");

            skeleton.className =
                "pageLoading";


            page.appendChild(skeleton);

            book.appendChild(page);

            pageElements.push(page);

        }


        const initialPages = [];


        if (pdfDocument.numPages >= 1)
            initialPages.push(renderPage(1));

        if (pdfDocument.numPages >= 2)
            initialPages.push(renderPage(2));

        if (pdfDocument.numPages >= 3)
            initialPages.push(renderPage(3));


        await Promise.all(initialPages);


        pageFlip =
            new St.PageFlip(

                book,

                {

                    width: pageWidth,
                    height: pageHeight,

                    size: "stretch",

                    minWidth: 150,
                    maxWidth: 700,

                    minHeight:
                        Math.round(
                            150 * ratio
                        ),

                    maxHeight:
                        Math.round(
                            700 * ratio
                        ),

                    /*
                    COVER ONLY = SINGLE PAGE
                    INTERNAL PAGES = DOUBLE SPREAD
                    */

                    showCover: true,

                    /*
                    IMPORTANT:
                    FALSE = even mobile stays double-page.
                    */

                    usePortrait: false,

                    startPage: 0,

                    autoSize: true,

                    drawShadow: true,

                    maxShadowOpacity: 0.42,

                    flippingTime: 850,

                    mobileScrollSupport: false

                }

            );


        pageFlip.loadFromHTML(
            document.querySelectorAll(".page")
        );


        document.getElementById("initialLoader")
            .style.display = "none";


        updatePageNumber();


        preloadAround(1);


        pageFlip.on(
            "flip",
            function(event) {

                const index =
                    event.data;

                updatePageNumber();

                playFlipSound();

                preloadAround(
                    index + 1
                );

            }
        );


        setTimeout(
            backgroundRender,
            900
        );

    }


    catch(error) {

        console.error(error);

        document.getElementById(
            "initialLoader"
        ).innerHTML =
        "<div class='loaderText'>Error loading catalog.</div>";

    }

}


/* =========================
   RENDER PAGE
========================= */

async function renderPage(pageNumber) {

    if (!pdfDocument)
        return;

    if (
        pageNumber < 1 ||
        pageNumber > pdfDocument.numPages
    )
        return;

    if (
        renderedPages.has(pageNumber)
    )
        return;

    if (
        renderingPages.has(pageNumber)
    )
        return;


    renderingPages.add(
        pageNumber
    );


    try {

        const pdfPage =
            await pdfDocument.getPage(
                pageNumber
            );


        const deviceRatio =
            Math.min(

                window.devicePixelRatio || 1,

                1.4

            );


        const baseScale =
            window.innerWidth <= 700
            ? 1.0
            : 1.22;


        const viewport =
            pdfPage.getViewport({

                scale:
                    baseScale *
                    deviceRatio

            });


        const canvas =
            document.createElement(
                "canvas"
            );


        const context =
            canvas.getContext(
                "2d",
                {
                    alpha: false
                }
            );


        canvas.width =
            Math.floor(
                viewport.width
            );

        canvas.height =
            Math.floor(
                viewport.height
            );


        await pdfPage.render({

            canvasContext:
                context,

            viewport:
                viewport

        }).promise;


        const target =
            pageElements[
                pageNumber - 1
            ];


        if (target) {

            target.innerHTML = "";

            target.appendChild(
                canvas
            );

        }


        renderedPages.add(
            pageNumber
        );

    }


    catch(error) {

        console.error(
            "Page render error:",
            pageNumber,
            error
        );

    }


    finally {

        renderingPages.delete(
            pageNumber
        );

    }

}


/* =========================
   PRELOAD
========================= */

function preloadAround(pageNumber) {

    if (!pdfDocument)
        return;


    const pages = [

        pageNumber - 2,
        pageNumber - 1,
        pageNumber,
        pageNumber + 1,
        pageNumber + 2,
        pageNumber + 3,
        pageNumber + 4

    ];


    pages.forEach(number => {

        if (

            number >= 1 &&

            number <=
            pdfDocument.numPages

        ) {

            renderPage(number);

        }

    });

}


/* =========================
   BACKGROUND RENDER
========================= */

async function backgroundRender() {

    if (!pdfDocument)
        return;


    for (

        let i = 1;

        i <= pdfDocument.numPages;

        i++

    ) {

        if (
            !pdfDocument ||
            backgroundRenderStopped
        )
            break;


        if (
            !renderedPages.has(i)
        ) {

            await renderPage(i);

            await sleep(110);

        }

    }

}


function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );

}


/* =========================
   PAGE NUMBER
========================= */

function updatePageNumber() {

    if (!pageFlip)
        return;


    const current =
        pageFlip
            .getCurrentPageIndex()
        + 1;


    const total =
        pageFlip
            .getPageCount();


    document.getElementById(
        "pageInfo"
    ).innerText =
        current +
        " / " +
        total;

}


/* =========================
   NEXT
========================= */

function nextPage() {

    if (!pageFlip)
        return;

    unlockSound();

    /*
    Animated page flip forward.
    */

    try {

        pageFlip.flipNext("top");

    }
    catch(e) {

        pageFlip.flipNext();

    }

}


/* =========================
   PREVIOUS
========================= */

function prevPage() {

    if (!pageFlip)
        return;

    unlockSound();

    /*
    Animated reverse page flip.
    This makes Previous turn visually,
    rather than simply jumping back.
    */

    try {

        pageFlip.flipPrev("top");

    }
    catch(e) {

        pageFlip.flipPrev();

    }

}


/* =========================
   HOME
========================= */

function goHome() {

    backgroundRenderStopped = true;


    if (pageFlip) {

        try {
            pageFlip.destroy();
        }
        catch(e) {}

    }


    pageFlip = null;
    pdfDocument = null;

    renderedPages.clear();
    renderingPages.clear();

    pageElements = [];


    document.getElementById(
        "book"
    ).innerHTML = "";


    document.getElementById(
        "reader"
    ).style.display = "none";


    document.getElementById(
        "catalogMenu"
    ).style.display = "flex";

}


/* =========================
   FULLSCREEN
========================= */

function toggleFullscreen() {

    if (!document.fullscreenElement) {

        document.documentElement
            .requestFullscreen()
            .catch(() => {});

    }

    else {

        document.exitFullscreen()
            .catch(() => {});

    }

}


/* =========================
   REAL PAGE FLIP AUDIO
========================= */

function unlockSound() {

    const audio =
        document.getElementById(
            "pageFlipAudio"
        );

    if (!audio)
        return;


    audio.volume = 0;


    const promise =
        audio.play();


    if (
        promise &&
        typeof promise.then === "function"
    ) {

        promise
            .then(() => {

                audio.pause();

                audio.currentTime = 0;

                audio.volume = 0.75;

            })
            .catch(() => {

                audio.volume = 0.75;

            });

    }

}


/* =========================
   PLAY SOUND
========================= */

function playFlipSound() {

    const original =
        document.getElementById(
            "pageFlipAudio"
        );


    if (!original)
        return;


    /*
    Clone allows rapid page turns
    without cutting off previous sound.
    */

    const audio =
        original.cloneNode(true);


    audio.volume = 0.75;


    audio.currentTime = 0;


    audio.play()
        .catch(() => {});

}

</script>

</body>
</html>
